<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIL Presentation</title>
<style>
  :root{
    --navy:#0f2942; --navy-2:#173a5e; --red:#c8102e; --ink:#0f2942;
    --paper:#f4f6f9; --line:#dde3ea; --muted:#5b6b7d;
    --slate:#10151c; --slate-2:#19212c; --slate-line:#2a3542;
    --slate-text:#e7edf3; --slate-muted:#8ea0b3; --cue:#ffcf6b;
    --gold:#c9a227; --silver:#9aa5b1; --bronze:#b3703a;
    --serif:Georgia,'Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  #root{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper)}

  .logo-box{background:#fff;border-radius:10px;padding:10px 14px;display:inline-flex;
    align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(15,41,66,.12);border:1px solid var(--line)}
  .logo-box img{display:block;width:auto;height:auto;max-width:240px;max-height:88px;object-fit:contain}
  .logo-box .no-logo{font-size:12px;color:var(--muted);padding:6px 10px;white-space:nowrap}

  /* ---------------- LAUNCHER ---------------- */
  #launcher{max-width:720px;margin:0 auto;padding:38px 26px 60px}
  #launcher h1{font-family:var(--serif);font-size:30px;margin:0 0 4px;letter-spacing:.3px}
  #launcher .sub{color:var(--muted);margin:0 0 26px;font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,41,66,.05)}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:0 0 16px;font-weight:700}
  .field{margin-bottom:14px}.field:last-child{margin-bottom:0}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:var(--sans);background:#fff;color:var(--ink)}
  textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(23,58,94,.12)}
  .row{display:flex;gap:12px}.row>*{flex:1}
  .btn{appearance:none;border:none;border-radius:9px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans)}
  .btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-2)}
  .btn-red{background:var(--red);color:#fff}.btn-red:hover{filter:brightness(1.06)}
  .btn-ghost{background:#eef2f6;color:var(--ink)}.btn-ghost:hover{background:#e3e9ef}
  .btn-wide{width:100%}
  .inline{display:flex;gap:10px;align-items:flex-end}.inline .field{flex:1;margin:0}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .status{font-size:12.5px;margin-top:10px;min-height:16px}.status.ok{color:#1a7f37}.status.err{color:var(--red)}
  .preview{margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .launch-row{display:flex;gap:12px}.launch-row .btn{flex:1}
  details{margin-top:14px}summary{cursor:pointer;font-size:12.5px;color:var(--navy-2);font-weight:600}
  .note{background:#fff8e6;border:1px solid #f2e0a8;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#6a5511;line-height:1.55}
  .note b{color:#5a4700}
  code.k{background:#eef2f6;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

  /* ---------------- PRESENTATION ---------------- */
  #present{height:100%;display:flex;flex-direction:column;background:var(--paper)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
  .topbar .brandmark{text-align:right}
  .topbar .brandmark .b1{font-family:var(--serif);font-size:18px;color:var(--navy);line-height:1}
  .topbar .brandmark .b2{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .stage{flex:1 1 auto;position:relative;overflow:hidden}
  .brand-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
  .brand-slide .watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .brand-slide .watermark img{max-width:60%;max-height:60%;opacity:.06;filter:grayscale(1)}
  .brand-slide .eyebrow{position:relative;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:18px}
  .brand-slide h2{position:relative;font-family:var(--serif);font-size:clamp(34px,5.4vw,66px);line-height:1.06;margin:0;max-width:16ch;color:var(--navy)}
  .brand-slide .rule{position:relative;width:64px;height:4px;background:var(--red);border-radius:3px;margin:26px 0 0}
  .pdf-slide{position:absolute;inset:0;display:flex;background:#525659}
  .pdf-slide iframe{border:0;flex:1;height:100%;width:100%;background:#525659}
  .pdf-slide .split{flex:1;height:100%;border-right:2px solid #2f3235}
  .pdf-slide .split:last-child{border-right:0}
  .letter-slide{position:absolute;inset:0;background:#525659}
  .letter-slide iframe{border:0;width:100%;height:100%}
  .letter-slide img{width:100%;height:100%;object-fit:contain;background:#525659}
  .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;text-align:center;padding:40px;background:var(--paper)}
  .placeholder .big{font-family:var(--serif);font-size:26px;color:var(--navy)}

  /* ---------------- Senior graphics ---------------- */
  .sen-slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    gap:clamp(14px,2.4vh,26px);padding:clamp(24px,4vw,56px)}
  .sen-head{text-align:center;margin-bottom:4px}
  .sen-head .eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:700}
  .sen-head h2{font-family:var(--serif);font-size:clamp(28px,4vw,48px);color:var(--navy);margin:6px 0 0}
  /* gap bars */
  .gap-block{display:grid;grid-template-columns:150px 1fr 130px;align-items:center;gap:16px}
  .gap-lab{font-size:14px;font-weight:700;color:var(--muted);text-align:right}
  .gap-bar{display:flex;height:clamp(46px,7vh,64px);border-radius:12px;overflow:hidden;
    box-shadow:0 2px 8px rgba(15,41,66,.15)}
  .gap-bar .seg{display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;font-size:13px;font-weight:600;min-width:0;padding:0 8px;line-height:1.15;text-align:center}
  .gap-bar .seg b{font-size:clamp(15px,1.9vw,20px);font-weight:800}
  .seg.segA{background:var(--navy)}
  .seg.segB{background:var(--navy-2)}
  .seg.segKept{background:#2f7d4f}
  .seg.segLost{background:var(--red);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 10px,transparent 10px 20px)}
  .gap-tot{font-family:var(--serif);font-size:clamp(22px,2.6vw,30px);color:var(--navy);font-weight:700}
  .gap-tot span{font-size:14px;color:var(--muted);font-family:var(--sans)}
  .gap-arrow{text-align:center;font-size:14px;color:var(--red);font-weight:700;letter-spacing:.3px}
  .gap-callout{margin:2px auto 0;text-align:center;background:#fff;border:2px solid var(--red);
    border-radius:16px;padding:clamp(12px,2vh,20px) 34px;box-shadow:0 4px 16px rgba(200,16,46,.14)}
  .gap-callout .gc-lab{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .gap-callout .gc-big{font-family:var(--serif);font-size:clamp(34px,5vw,60px);color:var(--red);line-height:1;margin:6px 0 4px}
  .gap-callout .gc-big span{font-size:clamp(16px,1.8vw,22px);color:var(--muted);font-family:var(--sans)}
  .gap-callout .gc-year{font-size:clamp(15px,1.8vw,20px);color:var(--navy);font-weight:700}
  /* tier board */
  .tier-row{display:flex;gap:clamp(12px,2vw,22px);justify-content:center;align-items:stretch}
  .tier{flex:1;max-width:300px;background:#fff;border:1px solid var(--line);border-top:6px solid var(--hue);
    border-radius:14px;padding:clamp(14px,2vh,22px);box-shadow:0 2px 10px rgba(15,41,66,.08);
    display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s;position:relative}
  .tier.on{transform:scale(1.05);box-shadow:0 8px 26px rgba(15,41,66,.2);border-color:var(--hue)}
  .tier.dim{opacity:.5}
  .tier.ring{box-shadow:0 0 0 3px var(--silver),0 8px 26px rgba(15,41,66,.18)}
  .tier-name{font-family:var(--serif);font-size:clamp(20px,2.4vw,28px);color:var(--navy)}
  .tier-mo{text-align:center;line-height:1}
  .tier-mo b{font-size:clamp(38px,5vw,64px);color:var(--hue);font-weight:800;display:block}
  .tier-mo span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .tier-line{font-size:13px;color:var(--ink);text-align:center}
  .tier-badge{margin-top:6px;background:var(--hue);color:#fff;font-size:12px;font-weight:700;
    padding:4px 12px;border-radius:20px}
  .tier-foot{text-align:center;font-size:13px;color:var(--muted);letter-spacing:.3px}

  /* ---------------- CONTROL (script on top) ---------------- */
  #control{height:100%;display:flex;flex-direction:column;background:var(--slate);color:var(--slate-text)}
  #control .script{flex:1 1 auto;overflow:auto;padding:16px 18px 22px;line-height:1.6;font-size:16px;order:0}
  #control .script .cue{color:var(--cue);font-style:italic}
  #control .script p{margin:0 0 13px;white-space:pre-wrap}
  #control .cfoot{flex:0 0 auto;border-top:1px solid var(--slate-line);background:var(--slate-2);padding:12px 16px}
  #control .pos{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--slate-muted)}
  #control .ctitle{font-family:var(--serif);font-size:17px;margin:2px 0 10px;line-height:1.15}
  #control .nav{display:flex;gap:8px}
  #control .nav .btn{flex:1;padding:11px}
  #control .nav .btn-ghost{background:#26313f;color:var(--slate-text)}#control .nav .btn-ghost:hover{background:#2e3b4c}
  #control .jump{margin-top:8px}
  #control select{background:#26313f;color:var(--slate-text);border-color:var(--slate-line)}
  #control select:focus{box-shadow:0 0 0 3px rgba(200,16,46,.25);border-color:var(--red)}
  #control .vars{margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  #control .vars label{color:var(--slate-muted);font-size:11px}
  #control .vars input{background:#26313f;color:var(--slate-text);border-color:var(--slate-line);padding:9px 10px}
  #control .calc{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  #control .chip{background:#22303f;border:1px solid var(--slate-line);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--slate-text)}
  #control .chip b{color:var(--cue)}
  /* segmented mode selectors */
  .seg{display:flex;gap:6px;background:#eef2f6;border:1px solid var(--line);border-radius:10px;padding:4px}
  .seg button{flex:1;appearance:none;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:9px 8px;border-radius:7px;cursor:pointer;font-family:var(--sans)}
  .seg button.on{background:var(--navy);color:#fff}
  .segc{display:flex;gap:6px;margin:0 0 10px;background:#0d1218;border:1px solid var(--slate-line);border-radius:9px;padding:4px}
  .segc button{flex:1;appearance:none;border:none;background:transparent;color:var(--slate-muted);font-weight:700;font-size:12px;padding:8px 6px;border-radius:6px;cursor:pointer;font-family:var(--sans)}
  .segc button.on{background:var(--red);color:#fff}
  ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#33414f;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ============ slide order (exact) ============ */
/* ============ slides: shared base + per-mode tails ============ */
// Everything through FOC is identical across modes. After FOC, HC/REF continue one way, Senior another.
const BASE_SLIDES = [
  {id:'intro',     file:'intro',     title:'Introduction',                     eyebrow:'Getting Started',        visual:'brand'},
  {id:'company',   file:'company',   title:'American Income Life',             eyebrow:'Our Company',            visual:'brand'},
  {id:'add',       file:'ADD',       title:'Accidental Death & Dismemberment',eyebrow:'',                        visual:'pdf',   pdf:['add.pdf']},
  {id:'csk',       file:'CSK',       title:'Child Safe Kit',                  eyebrow:'',                        visual:'pdf',   pdf:['csk.pdf']},
  {id:'will',      file:'will',      title:'Will Kit',                        eyebrow:'',                        visual:'pdf',   pdf:['will.pdf']},
  {id:'faminfo',   file:'Faminfo',   title:'Family Information Guide',        eyebrow:'',                        visual:'pdf',   pdf:['faminfo.pdf']},
  {id:'ailplus',   file:'ailplus',   title:'AIL Plus Savings',               eyebrow:'',                        visual:'pdf',   pdf:['ailplus.pdf']},
  {id:'refs',      file:'refs',      title:'Blanket of Protection',          eyebrow:'Referrals',               visual:'brand'},
  {id:'letter',    file:'letter',    title:'Mandatory Read-Off Letter',      eyebrow:'',                        visual:'letter'},
  {id:'needs',     file:'needs',     title:'Needs Analysis',                 eyebrow:'Qualifying',              visual:'brand'},
  {id:'hourpower', file:'hourpower', title:'The Hour Power Principle',       eyebrow:'The Concept',             visual:'brand'},
  {id:'fex',       file:'fex',       title:'The Cost of a Funeral Today',    eyebrow:'Final Expense',           visual:'brand'},
  {id:'foc',       file:'foc',       title:'Freedom of Choice',              eyebrow:'',                        visual:'pdf2',  pdf:['foc.pdf','foc2.pdf']},
];
const TAIL_HC = [
  {id:'income',    file:'income',    title:'Income Protection',              eyebrow:'Protecting the Paycheck', visual:'brand'},
  {id:'college',   file:'college',   title:'College Fund Benefit',           eyebrow:'The Kids',                visual:'brand'},
  {id:'ghgp',      file:'ghgp',      title:'Get Hurt, Get Paid',             eyebrow:'Living Benefits',         visual:'brand'},
  {id:'close',     file:'close',     title:'The Close',                      eyebrow:'1 Hour vs 2 Hour',        visual:'brand'},
];
// Senior-specific tail (hardcoded script + custom graphic). Ends on the SS gap;
// the Gold/Silver/Bronze close is handled on Thomas's external pitch sheet.
const TAIL_SEN = [
  {id:'ssgap',    file:'ssgap',    title:'Social Security Protection', eyebrow:'The Survivor Gap',   visual:'ssgap'},
];
function slidesFor(mode){ return (mode==='SEN') ? BASE_SLIDES.concat(TAIL_SEN) : BASE_SLIDES.concat(TAIL_HC); }
function activeSlides(){ return slidesFor(STATE.scriptMode||'HC'); }
const ALL_SLIDES = BASE_SLIDES.concat(TAIL_HC, TAIL_SEN);
function slideFile(id){ const s=ALL_SLIDES.find(x=>x.id===id); return s?s.file:id; }

/* ============ built-in Hard Card scripts (offline fallback) ============ */
const SCRIPTS_HC = {
intro:`Have you ever met with someone like me about your benefits or happen to hear about us at a union meeting? Ok, do you remember that little card we talked about on the phone, that you filled out? Perfect… well, you're probably going to get that every couple of years from now on, as long as you are still in the union or are retired from the union. The reason is because we know the union does the best job it can of providing you with benefits, but we both know they can't give you everything you need with the amount of money they have to work with. That's exactly why they give you a chance to work with us, and today's your lucky day… You get to work with me.`,

company:`The name of our company is American Income and we have been serving unions for over 70 years and work with over 40,000 different unions, including all the big ones like the UAW, Teamsters, Police, Fire Fighters, Veterans, and yours. The reason we work with all these unions is because we are a 100% wall-to-wall union benefit company. In fact, I'm a union member just like you. My union is the OPEIU Local 277, and we are the largest unionized benefit company in the country.

My job is simple but extremely important. I'm going to walk you through setting up your pre-paid benefits and answer all your questions, but more importantly, we are going to go through the permanent plans that you may qualify for. These benefits are designed to pick up where your work program left off and fill in your gaps. So, as we go through this, if you say to yourself, "Yeah, that makes sense, I see why they did this," GREAT, I'll set that up for you today. If not, NO BIG DEAL. Understand this isn't a big sales pitch. The union guys have ALL liked it because it's SO much cheaper than what they get from non-union companies, and you'll see it's a far better variety of benefits. That's why EVERYONE enrolls… All they need is a yes or no, and that decision needs to be made today because we have several hundred of you guys to do this with, and we have to see you ONE- FAMILY- AT- A- TIME. Is that fair?`,

add:`The first thing you're getting is the Accidental Death and Dismemberment benefit. This will pay $4,000 to (beneficiary) if you were to die in any accident. It is also dismemberment, so it will also pay you half of the amount if you were to lose one hand, one foot, or sight in one eye and the full amount for the combination of any two. NO one is getting rich off of this, but it is non-contributory, which it means you DON'T pay for it, and we both know every little bit helps, right!!!

Now just in case you were to pass away in a common accident, we need to take down two emergency contacts for each of you. These should be people you associate with regularly and are typically between the ages of 18 and 60 years old. Who's first (name, relationship, city, phone)`,

csk:`How many kids go missing a year (PAUSE LET THEM FEEL) Its 305,000 in the U.S in 2025, that 1 child every minute. How long does it take to start a search (PAUSE LET THEM GUESS)
on average it can take 1 to 6 hours on average, every hour the search radius increases by 50 miles, from just the mall, grocery store, playground, after 1 hour it becomes almost 8 THOUSAND square miles. We have close relationships with First-Responders, Police, Firefighters, & Teachers and we've been trying to find ways to keep kids safer and this is what they have come up with. (show the Child Safe Kit slide)

When I email you, there will be a QR code. Once you have the app downloaded and your account set up, you will be prompted to scan or upload the QR code. Once the QR code is uploaded you will put all your kid's information into the app. It's the same information that's on this printable kit. Important information, such as section
Section 1 is for personal information: name nickname, height, weight, allergies, medication... all of that.
Section 2 is for Identifying marks: scars, birthmarks, glasses, braces and then you can mark where on the body it is.
Section 3 is for DNA samples: Fingernail clippings work and so does hair. If you use hair, it does need to be plucked because you need the root at the end.
Section 4 is for fingerprints: If you don't have inkpads, markers work but also any police station would be happy to roll the fingerprints. Then you know it was done correctly and the kids usually enjoy it because they get to meet uniformed officers and it's not scary because no one is in trouble.

Then on the next page, you'll add a current picture, along with the age and date it was taken. These printed copies are great to keep in the diaper bag or glove box of the car but once the info is in the app, it does great stuff.

Most parents have had a moment where they turn around and their kid isn't right there. Either they ran into the next aisle at the grocery store or down the beach... some parents feel like they never take their eyes off their kids in public, but things happen, and they happen fast. In fact, just over the past couple years, our Child Safe Kits have been accredited for helping to find two children abducted in the US. One child in Chicago, that was later found but taken by a crazed relative. The other in Houston, who was found at the border where her abductors were trying to leave the country.

Im sure you can see how important this is for every family with children to have. (go down deep emotional low tone sad)

We made a commitment to the American Federation of teachers, and the police unions, that we would get these out to every family with kids, we cant do that without your help.

Who do you know who loves their kids. (not a question)

("EVERYONE"): Yea exactly lets get this to those families, whose the parent you know whos got the most kids.`,

will:`How does probate work. (wait for response)
Probate is basically the court deciding who gets your stuff, making sure debts are paid, and giving permission before your family can access or distribute your assets. It can take months, and in some cases over a year. During that time, accounts can be frozen, bills still have to be paid, and your loved ones are dealing with paperwork and legal costs while they're grieving.

One of the MOST important benefits we have for our members is a Will Kit. This is something that EVERYONE needs, especially if you have minor children, but people have not had the time or money to set this up. Rather than spending a couple thousand dollars meeting with an attorney to set up a Will, we are providing you one of our professionally organized Will Kits at absolutely no-cost. Everything you need to protect your assets, and your family, is listed in the Will Kit. Now do you either use a regular brick and mortar bank, credit union, or online bank? You can get this notarized at the bank/credit union. Once you have this completely filled out, you will want to make a copy for a couple of people that are the closest to you. We all know how difficult it is to lose a loved one, so this needs to be done ASAP to protect your family`,

faminfo:`Now the will is for the court, if you dont mind me asking, have you ever had to handle or manage a funeral. (DOWN TONE SAD)
IF YES: Im sorry to hear that, it goes without saying theres alot you have to figure out or
IF NO: ok, now im sure youve seen someone else handle a funeral right? im sorry to hear that, who was it? it goes without saying theres alot you have to figure out or

this is the family information guide, this is for the family. This benefit is extremely important as it serves as a road map for your family when something bad happens. It pretty much tells everyone what you want done. For example (then walk them through and briefly show the below areas)
This is where you put your information, when something happens to you every place will require all of these details.
Are you a veteran?
Spouse Information
People to notify.
This part is EXTREMELY important, when some thing happens you need to make sure your family knows, theres a will, where to find it, and who the executor is.
This is where your insurances go, for example like everyone else you have regular old life insurance through work. (downplay how cool this is)
ok perfect is that 50 or 100 thousand.
awesome, now im sure you also have regular life insurance, or a funeral benefit, outside of work just like all the other union/association members right (make it sound like "duh" you have something)

(if yes): perfect, what company is that through. and how much is it worth. ok perfect that's where that information goes.
(if no): (act like stupid confused like WTF?) wait, you dont have anything out side of work? whys that, never thought about it or... (MAKE THEM FEEL STUPID)
(let them respond all confused put them on the spot)
Yea no worries well help you out with that but thats for later, this next part this is where the bank accounts go

when something happens to you you want to make sure they have access to you bank accounts to use the funds for final expenses and close the accounts.
now this is where you fill in final requests, for example, are you getting buried or cremated (not a question demand for it)`,

ailplus:`The next benefit helps EVERYONE save money. Have you been saving $100 every month like all the other union/association members? It's called the AIL PLUS program and it's designed to help with health-related costs. This doesn't affect any medical coverages you already have in any way. It saves so much money, up to 85%, on so many areas like glasses, dental, lab testing, and even vet bills and pet prescriptions, because barely anyone has health insurance on the pets (chuckle) When is the last time youve had a dental visit? this will help you save there, any medications? this will save you money every month.

letter:`Now these next benefits are by far the most important and most popular with the members, but before I go over them, I'm going to go over this mandatory read-off letter. Here it is (show computer screen). It basically says that my job is to show you the benefits, explain how they work, answer any questions you have, and get you enrolled. These benefits are permanent for life, unlike most of the group benefits, where 31 days after you quit, leave or retire, what happens? (Wait for a response) Right… They're gone! The program will greatly enhance your current protection, but more importantly, it is permanent and portable. Even if you quit, leave or retire… they go with you ALWAYS! Does that make sense?`,

hourpower:`How many hours are you working a week? Have you heard of the hour power principle before? It's the old union term that states you always need to set aside one hour of your wages, per week, to protect your family and their future. I see a lot of families and I don't know if you are like most of them, but most people waste half their money on things they don't even need. People are not setting aside even close to enough for their family and for their own future. So, what union members do is set aside just one hour of their wages each week for their families. EVERYONE can agree that just one hour never changes your lifestyle, right? Exactly! Because when you work just one less hour a week, your not going bankrupt are you? You are just going to spend it on something you don't even need. So, from this point forward, if you qualify, 39 hours a week you can spend on whatever you want… and just one hour will go towards your permanent benefits to protect your family's future. Does that make sense? Most members in your union/Association do more 2 or 3, but as long as you're doing at least one hour you will be okay. That makes sense, right? Perfect!`,

foc:`So, this IS different, this is what they call the Freedom of Choice funeral benefit. What this does is, if you die, and it doesn't matter when or how you die, you could die tomorrow in an auto accident, have a heart attack in ten years, or die of cancer at age 80... it doesn't matter. But, when it does happen, your funeral is covered! The way this works is… you would take this certificate to ANY funeral home, cemetery, or crematorium in the United States. In fact, funeral directors love this because they know it is union backed and they don't have to worry about it being paid. You have to get everything taken care of - flowers, casket, service, grave site – let's say the whole thing ends up totaling $15,000. You take the certificate, turn it over, write in $15,000 here (show them on the FOC), sign it here, hand it to the funeral director and the total costs of the funeral are completely taken care of. You DO NOT have to pay a dime out of pocket, as long as you can keep the total under however much we set this up.

income:`The next concern, of course, deals with Income Protection. Now Mary, if Jim were to get hurt and be off from work for three months, with no paycheck coming in, how would that effect the family? Exactly, I'm sure it would be tough, but you would get by. Now, if Jim is killed on the way home from work tomorrow, his ability to earn an income stops forever. What is the first thing you are going to miss? Well hopefully him, however very quickly thereafter it will be his paycheck. That is exactly why the unions saw this as such a concern. So, what this program is designed to do, is when Jim dies, his income of (client's monthly income) per month will continue to come into the household each and every month, tax free/probate free, for the next five years or 60 months. This will allow you time to grieve and to adjust to losing Jim's income. Tie Down - Jim, if you had the choice of protecting your income for your family, or NOT protecting your income for your family, which would you choose? Exactly. That's what everyone says.

college:`I am sure it goes without saying that we all want our kids to have better opportunities than we did, right? Well, that's exactly what this next benefit is designed to protect. If anything were to happen to you, say in an accident, there will be up to $100,000 for each child to pay for college, trade school, or even start a business. The point is there, you may not be around anymore, but you are still there helping support their dreams. Tie Down - Doesn't it make sense to have this in place to protect our kid's future? Exactly!`,

/* ============ script sets / folder loading ============ */
const MODES = {
  HC:  {suffix:'HC',  label:'Hard Card', folder:'scriptsHC'},
  REF: {suffix:'REF', label:'Referral',  folder:'scriptsREF'},
  SEN: {suffix:'SEN', label:'Senior',    folder:'scriptsSEN'},
};
const LOADED = { HC:{}, REF:{}, SEN:{} };   // fetched folder scripts, per mode
// Pull each slide's script for a mode from scripts{SUFFIX}/{file}{SUFFIX}.txt (same-origin, CORS-clean).
async function loadScriptsFor(mode){
  const m = MODES[mode] || MODES.HC;
  const pairs = await Promise.all(slidesFor(mode).map(async s=>{
    const url = `${m.folder}/${s.file}${m.suffix}.txt`;
    try{ const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw 0; const t=await r.text(); return [s.id, t]; }
    catch(e){ return [s.id, null]; }   // fails on plain file:// — that's expected
  }));
  const map={}; pairs.forEach(([id,t])=>{ if(t!=null && t.trim()!=='') map[id]=t; });
  LOADED[mode]=map; return map;
}
// Resolve a script. Senior tail is hardcoded; senior shared slides reuse HC; HC/REF use folder→HC.
function getScript(mode, id){
  if(mode==='SEN'){
    if(SCRIPTS_SEN[id]!=null) return SCRIPTS_SEN[id];
    return SCRIPTS_HC[id] || '';        // intro..foc identical to standard
  }
  const folder = LOADED[mode] && LOADED[mode][id];
  if(folder!=null) return folder;
  if(mode==='HC') return SCRIPTS_HC[id] || '';
  return null;                          // REF folder not yet loaded
}

/* ============ Drive helpers ============ */
function driveId(url){ if(!url) return null;
  let m = url.match(/\/file\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/) || url.match(/\/d\/([^/]+)/);
  return m ? m[1] : null; }
function isImageUrl(u){ return /\.(png|jpe?g|gif|webp|svg)(\?|#|$)/i.test(u||''); }
function isPdfUrl(u){ return /\.pdf(\?|#|$)/i.test(u||''); }
function logoSrc(url){ if(!url) return ''; const id=driveId(url);
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url; }
function letterEmbed(url){ if(!url) return null; const id=driveId(url);
  if(id) return {type:'iframe', src:`https://drive.google.com/file/d/${id}/preview`};
  if(isImageUrl(url)) return {type:'img', src:url};
  if(isPdfUrl(url)) return {type:'iframe', src:url+'#toolbar=0&navpanes=0&view=FitH'};
  return {type:'iframe', src:url}; }

/* ============ shared state via localStorage (works under file://) ============ */
const HARDCODED_API_URL = "https://script.google.com/macros/s/AKfycbwcST34raI84xtn2PV5oGr4D3SKDQBlWXRreCBSSX6AgypMdpXvkNF1QJQnEpzCwELg/exec";
const LS_KEY = 'ail_pres_shared';
const DEFAULT_STATE = { apiUrl:'', mainName:'', spouseName:'', income:'', ssMain:'', ssSpouse:'', union:'', logoUrl:'', letterUrl:'', slideIndex:0, scriptMode:'HC', _v:0 };
let STATE = Object.assign({}, DEFAULT_STATE);
let localVersion = -1;

function readShared(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); }catch(e){} return null; }
function commit(patch, silent){
  const cur = readShared() || Object.assign({}, DEFAULT_STATE);      // re-read so we don't clobber other fields
  const next = Object.assign({}, cur, patch);
  const maxI = slidesFor(next.scriptMode||'HC').length - 1;          // mode may change the slide count
  if(next.slideIndex > maxI) next.slideIndex = maxI;
  if(next.slideIndex < 0) next.slideIndex = 0;
  next._v = (cur._v||0) + 1;
  STATE = next; localVersion = next._v;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(next)); }catch(e){}
  if(!silent) render();
}
function poll(){
  const sh = readShared();
  if(sh && (sh._v||0) !== localVersion){
    localVersion = sh._v||0;
    STATE = Object.assign({}, DEFAULT_STATE, sh);
    render();
  }
}

let UNIONS = [];
function findUnion(g){ return UNIONS.find(u=>u.group===g); }
function pick(obj, keys){ for(const k of keys){ if(obj[k]!=null && String(obj[k]).trim()!=='') return String(obj[k]).trim(); } return ''; }
function mapRows(rows){
  return (Array.isArray(rows)?rows:[]).map(row=>({
    group:   pick(row,['GROUP','Group','group']),
    display: pick(row,['DISPLAY NAME','Display Name','DisplayName','display']) || pick(row,['GROUP','Group']),
    aliases: pick(row,['ALIASES','Aliases','aliases']),
    logo:    pick(row,['LOGO LINK','Logo Link','LOGO','logo','LogoLink']),
    letter:  pick(row,['LETTER LINK','Letter Link','LETTER','letter','LetterLink']),
  })).filter(u=>u.group||u.display).sort((a,b)=>(a.display||'').localeCompare(b.display||''));
}
function parseCSV(text){
  const rows=[]; let row=[],f='',i=0,q=false;
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=c;i++; }
    else{ if(c==='"'){q=true;i++;} else if(c===','){row.push(f);f='';i++;}
      else if(c==='\r'){i++;} else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;}
      else{f+=c;i++;} } }
  row.push(f); rows.push(row);
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function csvToObjects(text){ const r=parseCSV(text); if(!r.length) return []; const h=r[0].map(x=>x.trim());
  return r.slice(1).map(rw=>{const o={};h.forEach((k,idx)=>o[k]=rw[idx]||'');return o;}); }

      </div>
      <button class="btn btn-ghost btn-wide" id="launchBoth" style="margin-top:12px">Open both</button>
      <div class="hint">The <b>presentation</b> window is the clean tab you screen-share. The <b>control panel</b> is your private tab — script up top (under your camera), controls at the bottom. Keyboard: ← / → or Space moves between slides.</div>
    </div>

    <div class="note">
      <b>Run in Chrome or Edge.</b> The three windows sync through local storage, which those browsers share across the file. Keep the PDFs in the <b>same folder</b> as this file:
      <code class="k">add.pdf</code> <code class="k">csk.pdf</code> <code class="k">will.pdf</code>
      <code class="k">faminfo.pdf</code> <code class="k">ailplus.pdf</code> <code class="k">foc.pdf</code> <code class="k">foc2.pdf</code>.
      If a pop-out is blocked, allow pop-ups for this page.
    </div>
  </div>`;

  const $=id=>document.getElementById(id);
  $('apiUrl').addEventListener('change', e=>commit({apiUrl:e.target.value.trim()}, true));
  $('loadBtn').addEventListener('click', loadUnions);
  $('parseBtn').addEventListener('click', ()=>{
    const raw=($('pasteData').value||'').trim(); if(!raw){ setStatus('apiStatus','Nothing pasted.','err'); return; }
    try{ let rows; if(raw[0]==='['||raw[0]==='{'){ rows=JSON.parse(raw); } else { rows=csvToObjects(raw); }
      UNIONS=mapRows(rows); setStatus('apiStatus',`Parsed ${UNIONS.length} union(s) from pasted data.`,'ok'); render();
    }catch(err){ setStatus('apiStatus','Could not parse that. Make sure it is the JSON array or the CSV. '+(err&&err.message?('('+err.message+')'):''),'err'); }
  });
  const mseg=document.getElementById('modeSeg');
  if(mseg) mseg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>commit({scriptMode:b.dataset.m})));
  $('union').addEventListener('change', e=>{ const u=findUnion(e.target.value);
    commit({union:e.target.value, logoUrl:u?u.logo:'', letterUrl:u?u.letter:''}); });
  $('mainName').addEventListener('input', e=>commit({mainName:e.target.value}, true));
  $('spouseName').addEventListener('input', e=>commit({spouseName:e.target.value}, true));
  $('launchPresent').addEventListener('click', ()=>openWin('present'));
  $('launchControl').addEventListener('click', ()=>openWin('control'));
  $('launchBoth').addEventListener('click', ()=>{ openWin('present'); setTimeout(()=>openWin('control'),150); });
}

function openWin(mode){
  const base=location.href.split('?')[0].split('#')[0];
  const feat = mode==='present' ? 'width=1280,height=800' : 'width=480,height=920';
  const w=window.open(base+'?mode='+mode, 'ail_'+mode, feat);
  if(!w) setStatus('apiStatus','Pop-up blocked — allow pop-ups for this page.','err');
}
function setStatus(id,msg,kind){ const el=document.getElementById(id); if(!el) return; el.textContent=msg; el.className='status '+(kind||''); }

async function loadUnions(){
  const url=(document.getElementById('apiUrl').value||'').trim();
  if(!url){ setStatus('apiStatus','Paste your /exec URL first.','err'); return; }
  commit({apiUrl:url}, true); setStatus('apiStatus','Loading…','');
  try{
    const sep=url.includes('?')?'&':'?';
    const res=await fetch(url+sep+'format=json',{redirect:'follow'});
    const data=await res.json();
    UNIONS=mapRows(data);
    setStatus('apiStatus',`Loaded ${UNIONS.length} union${UNIONS.length===1?'':'s'}.`,'ok');
    render();
  }catch(err){
    setStatus('apiStatus','Fetch failed (often CORS from file://). Open your /exec?format=json in a browser tab, copy it, and use "Paste the data instead" above. '+(err&&err.message?('('+err.message+')'):''),'err');
  }
}

/* ---------------- PRESENTATION (re-render only when visual changes) ---------------- */
let lastPresentSig=null;
function renderPresent(){
  const slides=activeSlides();
  const s=slides[STATE.slideIndex]||slides[0];
  const mode=STATE.scriptMode||'HC';
  // dynamic slides depend on names/SS; static ones (pdf/letter) must not reload on those edits
  const dyn = (s.visual==='ssgap'||s.visual==='gsb')
    ? '|'+STATE.mainName+'|'+STATE.spouseName+'|'+STATE.ssMain+'|'+STATE.ssSpouse : '';
  const sig=mode+'|'+STATE.slideIndex+'|'+STATE.logoUrl+'|'+STATE.letterUrl+dyn;
  if(sig===lastPresentSig) return;         // avoids reloading PDFs when unrelated fields change
  lastPresentSig=sig;
  document.body.style.background='var(--paper)';
  const logo=STATE.logoUrl?logoSrc(STATE.logoUrl):'';
  const logoBox=`<div class="logo-box">${logo
    ?`<img src="${escAttr(logo)}" alt="union logo" onerror="this.style.display='none';this.parentNode.innerHTML='<span class=&quot;no-logo&quot;>logo unavailable</span>'">`
    :`<span class="no-logo">No union selected</span>`}</div>`;

  let stage='';
  if(s.visual==='brand'){
    stage=`<div class="brand-slide">${logo?`<div class="watermark"><img src="${escAttr(logo)}" alt=""></div>`:''}
      ${s.eyebrow?`<div class="eyebrow">${escHtml(s.eyebrow)}</div>`:''}
      <h2>${escHtml(s.title)}</h2><div class="rule"></div></div>`;
  }else if(s.visual==='pdf'){
    stage=`<div class="pdf-slide"><iframe src="${escAttr(s.pdf[0])}#toolbar=0&navpanes=0&scrollbar=0&view=Fit" title="${escAttr(s.title)}"></iframe></div>`;
  }else if(s.visual==='pdf2'){
    stage=`<div class="pdf-slide">
      <div class="split"><iframe src="${escAttr(s.pdf[0])}#toolbar=0&navpanes=0&scrollbar=0&view=Fit" title="FOC left"></iframe></div>
      <div class="split"><iframe src="${escAttr(s.pdf[1])}#toolbar=0&navpanes=0&scrollbar=0&view=Fit" title="FOC right"></iframe></div></div>`;
  }else if(s.visual==='letter'){
    const emb=letterEmbed(STATE.letterUrl);
    if(!emb) stage=`<div class="placeholder"><div class="big">Read-Off Letter</div><div>Select a union with a letter on file to display it here.</div></div>`;
    else if(emb.type==='img') stage=`<div class="letter-slide"><img src="${escAttr(emb.src)}" alt="read-off letter"></div>`;
    else stage=`<div class="letter-slide"><iframe src="${escAttr(emb.src)}" title="read-off letter"></iframe></div>`;
  }else if(s.visual==='ssgap'){
    stage=ssGapGraphic();
  }else if(s.visual==='gsb'){
    stage=gsbGraphic(s.tier||null);
  }
  root.innerHTML=`<div id="present"><div class="topbar">${logoBox}
    <div class="brandmark"><div class="b1">American Income Life</div><div class="b2">Union Benefits</div></div></div>
    <div class="stage">${stage}</div></div>`;
}

/* ---------------- Senior graphics ---------------- */
// Survivor rule: keep the greater SS, lose the lesser. Uses entered amounts, falls back to example.
function senValues(){
  const jim  = parseMoney(STATE.ssMain)   || 2000;
  const mary = parseMoney(STATE.ssSpouse) || 1400;
  const kept = Math.max(jim,mary), lost = Math.min(jim,mary);
  return { jim, mary, kept, lost, combined:jim+mary, lostYr:lost*12,
    nameA:(STATE.mainName||'Member'), nameB:(STATE.spouseName||'Spouse') };
}
function ssGapGraphic(){
  const v=senValues();
  const pA=Math.max(6,(v.jim/v.combined)*100), pB=Math.max(6,(v.mary/v.combined)*100);
  const keptPct=Math.max(6,(v.kept/v.combined)*100), lostPct=Math.max(6,(v.lost/v.combined)*100);
  return `<div class="sen-slide">
    <div class="sen-head"><span class="eyebrow">Social Security</span><h2>The Survivor Gap</h2></div>
    <div class="gap-block">
      <div class="gap-lab">Today, together</div>
      <div class="gap-bar">
        <div class="seg segA" style="flex:${v.jim}">${escHtml(v.nameA)}<b>${fmtMoney(v.jim)}</b></div>
        <div class="seg segB" style="flex:${v.mary}">${escHtml(v.nameB)}<b>${fmtMoney(v.mary)}</b></div>
      </div>
      <div class="gap-tot">${fmtMoney(v.combined)}<span>/mo</span></div>
    </div>
    <div class="gap-arrow">When one passes, the lesser check is lost — by federal law</div>
    <div class="gap-block">
      <div class="gap-lab">The survivor keeps</div>
      <div class="gap-bar">
        <div class="seg segKept" style="flex:${v.kept}">Kept<b>${fmtMoney(v.kept)}</b></div>
        <div class="seg segLost" style="flex:${v.lost}">Lost forever<b>${fmtMoney(v.lost)}</b></div>
      </div>
      <div class="gap-tot">${fmtMoney(v.kept)}<span>/mo</span></div>
    </div>
    <div class="gap-callout">
      <div class="gc-lab">The gap this program replaces</div>
      <div class="gc-big">${'\u2212'}${fmtMoney(v.lost)}<span>/month</span></div>
      <div class="gc-year">${'\u2212'}${fmtMoney(v.lostYr)} every year</div>
    </div>
  </div>`;
}
function gsbGraphic(tier){
  const v=senValues();
  const tiers=[
    {k:'bronze', name:'Bronze', months:3,  tag:'Recommended start', hue:'var(--bronze)'},
    {k:'silver', name:'Silver', months:6,  tag:'Most popular',       hue:'var(--silver)'},
    {k:'gold',   name:'Gold',   months:12, tag:'Hardest to qualify', hue:'var(--gold)'},
  ];
  const cards=tiers.map(t=>{
    const on = tier ? (tier===t.k) : false;
    const dim = tier && tier!==t.k;
    const ring = (!tier && t.k==='silver');   // intro slide circles Silver
    return `<div class="tier ${on?'on':''} ${dim?'dim':''} ${ring?'ring':''}" style="--hue:${t.hue}">
      <div class="tier-name">${t.name}</div>
      <div class="tier-mo"><b>${t.months}</b><span>months of<br>protection</span></div>
      <div class="tier-line">${fmtMoney(v.lost)}/mo replaced</div>
      <div class="tier-line">100% Freedom of Choice</div>
      <div class="tier-line">Paid in 24–48 hrs</div>
      ${ring?`<div class="tier-badge">Circle this one</div>`:(on?`<div class="tier-badge">This option</div>`:'')}
    </div>`;
  }).join('');
  return `<div class="sen-slide">
    <div class="sen-head"><span class="eyebrow">Good · Better · Best</span><h2>Gold · Silver · Bronze</h2></div>
    <div class="tier-row">${cards}</div>
    <div class="tier-foot">Guaranteed · permanent · builds cash value · locked in for life</div>
  </div>`;
}

/* ---------------- CONTROL (script on top) ---------------- */
let ctrlLoadedMode=null, ctrlLoadingMode=null;
function ensureCtrlScripts(){
  const mode=STATE.scriptMode||'HC';
  if(ctrlLoadedMode===mode || ctrlLoadingMode===mode) return;
  if(mode==='SEN'){ ctrlLoadedMode='SEN'; return; }   // fully embedded, no fetch
  ctrlLoadingMode=mode;
  loadScriptsFor(mode).then(()=>{ ctrlLoadingMode=null; ctrlLoadedMode=mode; if(MODE==='control') renderControl(); });
}
function renderControl(){
  document.body.style.background='var(--slate)';
  ensureCtrlScripts();
  const slides=activeSlides();
  const i=STATE.slideIndex, s=slides[i]||slides[0], total=slides.length;
  const mode=STATE.scriptMode||'HC';
  const sen = mode==='SEN';
  const inc=parseMoney(STATE.income), five=inc?inc*60:0;
  const v=senValues();

  const varsHtml = sen ? `
        <div class="vars">
          <div><label>Member</label><input id="cMain" type="text" placeholder="Jim" value="${escAttr(STATE.mainName)}"></div>
          <div><label>Spouse</label><input id="cSpouse" type="text" placeholder="Mary" value="${escAttr(STATE.spouseName)}"></div>
        </div>
        <div class="vars">
          <div><label>Member SS/mo</label><input id="cSsMain" type="text" inputmode="numeric" placeholder="2,000" value="${escAttr(STATE.ssMain)}"></div>
          <div><label>Spouse SS/mo</label><input id="cSsSpouse" type="text" inputmode="numeric" placeholder="1,400" value="${escAttr(STATE.ssSpouse)}"></div>
        </div>
        <div class="calc">
          <span class="chip">Combined <b id="chipComb">${fmtMoney(v.combined)}</b></span>
          <span class="chip">Gap/mo <b id="chipGapM">${'\u2212'}${fmtMoney(v.lost)}</b></span>
          <span class="chip">Gap/yr <b id="chipGapY">${'\u2212'}${fmtMoney(v.lostYr)}</b></span>
        </div>`
    : `
        <div class="vars">
          <div><label>Member</label><input id="cMain" type="text" placeholder="Jim" value="${escAttr(STATE.mainName)}"></div>
          <div><label>Spouse</label><input id="cSpouse" type="text" placeholder="Mary" value="${escAttr(STATE.spouseName)}"></div>
          <div><label>Income/mo</label><input id="cIncome" type="text" inputmode="numeric" placeholder="4,000" value="${escAttr(STATE.income)}"></div>
        </div>
        <div class="calc">
          <span class="chip">Income/mo <b id="chipInc">${inc?fmtMoney(inc):'—'}</b></span>
          <span class="chip">5-yr protection (×60) <b id="chipFive">${five?fmtMoney(five):'—'}</b></span>
        </div>`;

  root.innerHTML=`
    <div id="control">
      <div class="script" id="script">${scriptHtml(s.id, STATE)}</div>
      <div class="cfoot">
        <div class="pos">Slide ${i+1} of ${total} · ${escHtml((MODES[mode]||MODES.HC).label)}${s.eyebrow?` · ${escHtml(s.eyebrow)}`:''}</div>
        <div class="ctitle">${escHtml(s.title)}</div>
        <div class="segc" id="modeSegC">
          ${Object.keys(MODES).map(k=>`<button data-m="${k}" class="${k===mode?'on':''}">${escHtml(MODES[k].label)}</button>`).join('')}
        </div>
        <div class="nav">
          <button class="btn btn-ghost" id="prev" ${i===0?'disabled style="opacity:.4"':''}>← Prev</button>
          <button class="btn btn-red" id="next" ${i===total-1?'disabled style="opacity:.4"':''}>Next →</button>
        </div>
        <div class="jump"><select id="jump">
          ${slides.map((sl,idx)=>`<option value="${idx}" ${idx===i?'selected':''}>${String(idx+1).padStart(2,'0')} · ${escHtml(sl.title)}</option>`).join('')}
        </select></div>
        ${varsHtml}
      </div>
    </div>`;
  const $=id=>document.getElementById(id);
  $('prev').addEventListener('click',()=>go(-1));
  $('next').addEventListener('click',()=>go(1));
  $('jump').addEventListener('change',e=>commit({slideIndex:parseInt(e.target.value,10)||0}));
  // silent commits + targeted refresh so the caret never jumps while typing
  $('cMain').addEventListener('input',e=>{ commit({mainName:e.target.value}, true); refreshDerived(); });
  $('cSpouse').addEventListener('input',e=>{ commit({spouseName:e.target.value}, true); refreshDerived(); });
  if($('cIncome')) $('cIncome').addEventListener('input',e=>{ commit({income:e.target.value}, true); refreshDerived(); });
  if($('cSsMain')) $('cSsMain').addEventListener('input',e=>{ commit({ssMain:e.target.value}, true); refreshDerived(); });
  if($('cSsSpouse')) $('cSsSpouse').addEventListener('input',e=>{ commit({ssSpouse:e.target.value}, true); refreshDerived(); });
  const seg=document.getElementById('modeSegC');
  if(seg) seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>commit({scriptMode:b.dataset.m})));
}
function refreshDerived(){
  const slides=activeSlides();
  const s=slides[STATE.slideIndex]||slides[0];
  const sc=document.getElementById('script'); if(sc) sc.innerHTML=scriptHtml(s.id, STATE);
  // HC/REF chips
  const inc=parseMoney(STATE.income), five=inc?inc*60:0;
  const ci=document.getElementById('chipInc'), cf=document.getElementById('chipFive');
  if(ci) ci.textContent=inc?fmtMoney(inc):'—';
  if(cf) cf.textContent=five?fmtMoney(five):'—';
  // Senior chips
  const v=senValues();
  const cc=document.getElementById('chipComb'), gm=document.getElementById('chipGapM'), gy=document.getElementById('chipGapY');
  if(cc) cc.textContent=fmtMoney(v.combined);
  if(gm) gm.textContent='\u2212'+fmtMoney(v.lost);
  if(gy) gy.textContent='\u2212'+fmtMoney(v.lostYr);
}
function go(delta){ const n=Math.max(0,Math.min(activeSlides().length-1,STATE.slideIndex+delta)); if(n!==STATE.slideIndex) commit({slideIndex:n}); }

/* ============ script rendering ============ */
// Resolve script for current mode -> HTML (with load state + missing-file guidance).
function scriptHtml(id, st){
  const mode = st.scriptMode || 'HC';
  const txt = getScript(mode, id);
  if(txt != null) return renderScriptText(txt, st);
  const m = MODES[mode] || MODES.HC;
  if(ctrlLoadingMode === mode){
    return `<p class="cue">Loading ${escHtml(m.label)} scripts…</p>`;
  }
  return `<p class="cue">${escHtml(m.label)} script not loaded.</p>`
       + `<p style="color:var(--slate-muted)">Add <b>${escHtml(m.folder)}/${escHtml(slideFile(id))}${m.suffix}.txt</b> and open this page over http/https (GitHub Pages or a local server). On a plain file:// open, only the built-in Hard Card set is available.</p>`;
}
function renderScriptText(text, st){
  if(!text) return '';
  const inc=parseMoney(st.income);
  const sen = (st.scriptMode==='SEN');
  const v = sen ? senValues() : null;
  const hasSS = sen && (parseMoney(st.ssMain) || parseMoney(st.ssSpouse));
  return text.split(/\n\s*\n/).map(para=>{
    let safe=escHtml(para);
    if(st.mainName) safe=safe.replace(/\(Member\)/g, escHtml(st.mainName));
    if(inc){ safe=safe.replace(/\(client\u2019s monthly income\)/g,escHtml(fmtMoney(inc)))
                     .replace(/\(client's monthly income\)/g,escHtml(fmtMoney(inc)))
                     .replace(/\(clients monthly income\)/g,escHtml(fmtMoney(inc))); }
    // Senior: fill SS figures (only once real amounts are entered) and personalize Jim/Mary
    if(hasSS){
      safe=safe.replace(/\$?\(Jims income\)/gi,       fmtMoney(v.jim))
               .replace(/\$?\(Marys income\)/gi,      fmtMoney(v.mary))
               .replace(/\$?\(combined income\)/gi,   fmtMoney(v.combined))
               .replace(/\$?\(lost monthly income\)/gi,fmtMoney(v.lost))
               .replace(/\$?\(lost annual income\)/gi, fmtMoney(v.lostYr));
    }
    if(sen && st.mainName)   safe=safe.replace(/\bjim\b/gi,  escHtml(st.mainName));
    if(sen && st.spouseName) safe=safe.replace(/\bmary\b/gi, escHtml(st.spouseName));
    safe=safe.replace(/\([^)]*\)/g, m=>`<span class="cue">${m}</span>`);
    return `<p>${safe}</p>`;
  }).join('');
}

/* ============ helpers ============ */
function parseMoney(v){ const n=parseFloat(String(v||'').replace(/[^0-9.]/g,'')); return isFinite(n)?n:0; }
function fmtMoney(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
function escHtml(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ keyboard nav ============ */
if(MODE==='present'||MODE==='control'){
  window.addEventListener('keydown',e=>{
    const t=(e.target&&e.target.tagName||'').toLowerCase();
    if(t==='input'||t==='select'||t==='textarea') return;
    if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); go(1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); }
  });
}

/* ============ boot ============ */
(function boot(){
  const sh=readShared();
  if(sh){ STATE=Object.assign({}, DEFAULT_STATE, sh); localVersion=sh._v||0; }
  if(MODE==='index' && !STATE.apiUrl) STATE.apiUrl = HARDCODED_API_URL;   // default to the deployed backend
  if(MODE==='index') commit({apiUrl:STATE.apiUrl}, true);                  // seed/persist shared state
  render();
  window.addEventListener('storage', poll);      // live sync (Chrome/Edge fire this across file:// tabs)
  setInterval(poll, 180);                         // polling fallback, always reliable
  if(MODE==='index' && STATE.apiUrl){
    loadUnions().then(()=>{ if(STATE.union){ const u=findUnion(STATE.union); if(u) commit({logoUrl:u.logo, letterUrl:u.letter}); } });
  }
})();
