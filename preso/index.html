<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIL Presentation</title>
<style>
  :root{
    --navy:#0f2942; --navy-2:#173a5e; --red:#c8102e; --ink:#0f2942;
    --paper:#f4f6f9; --line:#dde3ea; --muted:#5b6b7d;
    --slate:#10151c; --slate-2:#19212c; --slate-line:#2a3542;
    --slate-text:#e7edf3; --slate-muted:#8ea0b3; --cue:#ffcf6b;
    --neon:#00ffa3; --neon-dim:#0b3a2c; --neon-line:#127a5c;
    --serif:Georgia,'Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  #root{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper)}

  .logo-box{background:#fff;border-radius:10px;padding:10px 14px;display:inline-flex;
    align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(15,41,66,.12);border:1px solid var(--line)}
  .logo-box img{display:block;width:auto;height:auto;max-width:240px;max-height:88px;object-fit:contain}
  .logo-box .no-logo{font-size:12px;color:var(--muted);padding:6px 10px;white-space:nowrap}

  /* ---------------- LAUNCHER ---------------- */
  #launcher{max-width:720px;margin:0 auto;padding:38px 26px 60px}
  #launcher h1{font-family:var(--serif);font-size:30px;margin:0 0 4px;letter-spacing:.3px}
  #launcher .sub{color:var(--muted);margin:0 0 26px;font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,41,66,.05)}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:0 0 16px;font-weight:700}
  .field{margin-bottom:14px}.field:last-child{margin-bottom:0}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:var(--sans);background:#fff;color:var(--ink)}
  textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(23,58,94,.12)}
  .row{display:flex;gap:12px}.row>*{flex:1}
  .btn{appearance:none;border:none;border-radius:9px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans)}
  .btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-2)}
  .btn-red{background:var(--red);color:#fff}.btn-red:hover{filter:brightness(1.06)}
  .btn-ghost{background:#eef2f6;color:var(--ink)}.btn-ghost:hover{background:#e3e9ef}
  .btn-wide{width:100%}
  .inline{display:flex;gap:10px;align-items:flex-end}.inline .field{flex:1;margin:0}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .status{font-size:12.5px;margin-top:10px;min-height:16px}.status.ok{color:#1a7f37}.status.err{color:var(--red)}
  .preview{margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .launch-row{display:flex;gap:12px}.launch-row .btn{flex:1}
  details{margin-top:14px}summary{cursor:pointer;font-size:12.5px;color:var(--navy-2);font-weight:600}
  .note{background:#fff8e6;border:1px solid #f2e0a8;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#6a5511;line-height:1.55}
  .note b{color:#5a4700}
  code.k{background:#eef2f6;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

  /* ---------------- PRESENTATION ---------------- */
  #present{height:100%;display:flex;flex-direction:column;background:var(--paper)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
  .topbar .brandmark{text-align:right}
  .topbar .brandmark .b1{font-family:var(--serif);font-size:18px;color:var(--navy);line-height:1}
  .topbar .brandmark .b2{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .stage{flex:1 1 auto;position:relative;overflow:hidden}
  .brand-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
  .brand-slide .watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .brand-slide .watermark img{max-width:60%;max-height:60%;opacity:.06;filter:grayscale(1)}
  .brand-slide .eyebrow{position:relative;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:18px}
  .brand-slide h2{position:relative;font-family:var(--serif);font-size:clamp(34px,5.4vw,66px);line-height:1.06;margin:0;max-width:16ch;color:var(--navy)}
  .brand-slide .rule{position:relative;width:64px;height:4px;background:var(--red);border-radius:3px;margin:26px 0 0}
  .pdf-slide{position:absolute;inset:0;display:flex;background:#525659}
  .pdf-slide iframe{border:0;flex:1;height:100%;width:100%;background:#525659}
  .pdf-slide .split{flex:1;height:100%;border-right:2px solid #2f3235}
  .pdf-slide .split:last-child{border-right:0}
  .letter-slide{position:absolute;inset:0;background:#525659}
  .letter-slide iframe{border:0;width:100%;height:100%}
  .letter-slide img{width:100%;height:100%;object-fit:contain;background:#525659}
  .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;text-align:center;padding:40px;background:var(--paper)}
  .placeholder .big{font-family:var(--serif);font-size:26px;color:var(--navy)}

  /* ---------------- stat slides (funeral trend / income / mortgage) ---------------- */
  .sen-head{text-align:center;margin-bottom:4px}
  .sen-head .eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:700}
  .sen-head h2{font-family:var(--serif);font-size:clamp(28px,4vw,48px);color:var(--navy);margin:6px 0 0}
  .stat-slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    gap:clamp(16px,3vh,30px);padding:clamp(24px,4vw,60px)}
  .stat-note{text-align:center;font-size:12px;color:var(--muted);line-height:1.5;max-width:70ch;margin:0 auto}
  /* funeral bar chart */
  .fx-chart{display:flex;align-items:stretch;justify-content:center;gap:clamp(14px,3.4vw,44px);
    height:clamp(250px,44vh,440px);padding:0 10px}
  .fx-col{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:clamp(58px,9vw,110px)}
  .fx-amt{font-family:var(--serif);font-size:clamp(14px,1.8vw,22px);color:var(--navy);font-weight:700;margin-bottom:8px;white-space:nowrap}
  .fx-track{flex:1;width:100%;display:flex;align-items:flex-end}
  .fx-bar{width:100%;background:linear-gradient(180deg,var(--navy-2),var(--navy));border-radius:10px 10px 0 0;
    box-shadow:0 2px 8px rgba(15,41,66,.18);transition:height .4s}
  .fx-bar.red{background:linear-gradient(180deg,#e0324c,var(--red))}
  .fx-bar.proj{background:repeating-linear-gradient(45deg,rgba(200,16,46,.85) 0 12px,rgba(200,16,46,.5) 12px 24px);
    border:2px dashed var(--red);box-shadow:none}
  .fx-yr{margin-top:10px;font-size:14px;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
  .fx-yr small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--red);font-weight:700}
  .fx-div{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:clamp(40px,6vw,80px)}
  .fx-div-amt{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
  .fx-div-track{flex:1;position:relative;width:100%}
  .fx-div-line{position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--muted)}
  .fx-div-lab{margin-top:10px;font-size:10px;color:var(--muted);text-align:center;line-height:1.2}
  /* income stats */
  .inc-hero{display:flex;align-items:center;gap:clamp(20px,4vw,44px);justify-content:center;max-width:60ch;margin:0 auto}
  .inc-ring{width:clamp(120px,16vw,190px);aspect-ratio:1;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(200,16,46,.16)}
  .inc-ring-in{width:72%;aspect-ratio:1;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .inc-ring-in span{font-family:var(--serif);font-size:clamp(30px,4.4vw,52px);color:var(--red);font-weight:800}
  .inc-hero-txt{font-size:clamp(17px,2.2vw,26px);line-height:1.35;color:var(--navy)}
  .inc-hero-txt b{color:var(--red)}
  .inc-cards{display:flex;gap:clamp(14px,2.4vw,26px);justify-content:center;max-width:70ch;margin:0 auto}
  .inc-card{flex:1;max-width:340px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--navy);
    border-radius:12px;padding:clamp(14px,2vh,20px);box-shadow:0 2px 10px rgba(15,41,66,.07);display:flex;gap:14px;align-items:flex-start}
  .inc-big{font-family:var(--serif);font-size:clamp(30px,4vw,46px);color:var(--navy);font-weight:800;line-height:1;flex:0 0 auto}
  .inc-txt{font-size:14px;line-height:1.45;color:var(--ink)}
  .inc-txt b{color:var(--navy)}
  /* mortgage */
  .mtg-row{display:flex;gap:clamp(16px,3vw,34px);justify-content:center;align-items:stretch;max-width:78ch;margin:0 auto}
  .mtg-card{flex:1;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:clamp(16px,2.4vh,26px);box-shadow:0 2px 12px rgba(15,41,66,.08);text-align:center;
    border-top:6px solid var(--navy);display:flex;flex-direction:column;gap:10px}
  .mtg-card.bad{border-top-color:var(--red)}
  .mtg-lab{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .mtg-head{font-family:var(--serif);font-size:clamp(20px,2.6vw,30px);color:var(--navy);line-height:1.15}
  .mtg-card.bad .mtg-head{color:var(--red)}
  .mtg-sub{font-size:14px;color:var(--ink);line-height:1.45}
  .mtg-vs{display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:2px;
    text-transform:uppercase;color:var(--muted);font-weight:700;flex:0 0 auto;padding:0 4px}

  /* ---------------- CONTROL (script on top) ---------------- */
  #control{height:100%;display:flex;flex-direction:column;background:var(--slate);color:var(--slate-text);position:relative}
  #control .script{flex:1 1 auto;overflow:auto;padding:16px 18px 22px;line-height:1.6;font-size:16px;order:0}
  #control .script .cue{color:var(--cue);font-style:italic}
  #control .script p{margin:0 0 13px;white-space:pre-wrap}
  #control .cfoot{flex:0 0 auto;border-top:1px solid var(--slate-line);background:var(--slate-2);padding:12px 16px}
  #control .pos{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--slate-muted)}
  #control .ctitle{font-family:var(--serif);font-size:17px;margin:2px 0 10px;line-height:1.15}
  #control .nav{display:flex;gap:8px}
  #control .nav .btn{flex:1;padding:11px}
  #control .nav .btn-ghost{background:#26313f;color:var(--slate-text)}#control .nav .btn-ghost:hover{background:#2e3b4c}
  #control .jump{margin-top:8px}
  #control select{background:#26313f;color:var(--slate-text);border-color:var(--slate-line)}
  #control select:focus{box-shadow:0 0 0 3px rgba(200,16,46,.25);border-color:var(--red)}
  #control .vars{margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  #control .vars label{color:var(--slate-muted);font-size:11px}
  #control .vars input{background:#26313f;color:var(--slate-text);border-color:var(--slate-line);padding:9px 10px}
  #control .calc{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  #control .chip{background:#22303f;border:1px solid var(--slate-line);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--slate-text)}
  #control .chip b{color:var(--cue)}

  /* ---------------- OBJECTIONS ---------------- */
  #control .objbar{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px;background:#0d1218;
    border-top:1px solid var(--slate-line);align-items:stretch}
  .objpill{flex:1;min-width:0;appearance:none;cursor:pointer;font-family:var(--sans);
    background:#14251f;color:var(--neon);border:1px solid var(--neon-line);border-radius:8px;
    padding:8px 8px 7px;font-size:11.5px;font-weight:700;line-height:1.25;text-align:left;
    display:flex;flex-direction:column;gap:3px;transition:background .12s,box-shadow .12s}
  .objpill:hover{background:#1a3129}
  .objpill.on{background:var(--neon);color:#04180f;border-color:var(--neon);
    box-shadow:0 0 14px rgba(0,255,163,.45)}
  .objpill .k{font-size:9px;letter-spacing:1.5px;opacity:.75;font-weight:800}
  .objpill .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .objpill.uni{flex:0 0 74px;background:#241c2e;color:#d9a6ff;border-color:#6b3f8f}
  .objpill.uni:hover{background:#2f2440}
  .objpill.uni.on{background:#d9a6ff;color:#1d0d29;border-color:#d9a6ff;box-shadow:0 0 14px rgba(217,166,255,.45)}

  #objdrawer{position:absolute;left:0;right:0;bottom:0;z-index:20;
    background:linear-gradient(180deg,#0a1a14,#08130f);
    border-top:2px solid var(--neon);box-shadow:0 -14px 40px rgba(0,0,0,.6);
    transform:translateY(101%);transition:transform .18s cubic-bezier(.2,.8,.3,1);
    max-height:72%;display:flex;flex-direction:column}
  #objdrawer.open{transform:translateY(0)}
  #objdrawer .odhead{flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;
    padding:12px 14px 10px;border-bottom:1px solid var(--neon-line)}
  #objdrawer .odlab{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--neon);opacity:.7;font-weight:800;margin-bottom:4px}
  #objdrawer .odtrig{font-family:var(--serif);font-size:19px;line-height:1.2;color:var(--neon);
    text-shadow:0 0 18px rgba(0,255,163,.35)}
  #objdrawer .odx{flex:0 0 auto;appearance:none;border:1px solid var(--neon-line);background:#12251d;
    color:var(--neon);border-radius:7px;width:30px;height:30px;font-size:15px;cursor:pointer;font-weight:700}
  #objdrawer .odx:hover{background:#1a3129}
  #objdrawer .odbody{flex:1 1 auto;overflow:auto;padding:14px 16px 18px;
    font-size:16.5px;line-height:1.55;color:#c9ffe8}
  #objdrawer .odbody p{margin:0 0 12px;white-space:pre-wrap}
  #objdrawer .odbody .cue{color:var(--cue);font-style:italic}
  #objdrawer .odbody em.todo{color:#6f8f82;font-style:italic}
  #objdrawer .odtabs{flex:0 0 auto;display:flex;gap:6px;padding:8px 12px 12px}
  #objdrawer .odtab{flex:1;appearance:none;cursor:pointer;font-family:var(--sans);font-size:11px;
    font-weight:700;padding:7px 6px;border-radius:7px;border:1px solid var(--neon-line);
    background:#12251d;color:var(--neon);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #objdrawer .odtab.on{background:var(--neon);color:#04180f}

  /* ---------------- LOGO-ONLY SLIDE ---------------- */
  .logo-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 6vw;background:var(--paper)}
  .logo-slide img{max-width:62%;max-height:70%;object-fit:contain}
  .logo-slide .no-logo{color:var(--muted);font-family:var(--serif);font-size:26px}

  /* ---------------- PITCH SHEET (presentation) ---------------- */
  :root{--ps-navy:#071f38;--ps-blue:#123d66;--ps-gold:#c49a45;--ps-gold2:#f1dfad;--ps-green:#0f6d46;--ps-line:#e4ebf2}
  .ps-slide{position:absolute;inset:0;overflow:auto;padding:20px 24px 30px;background:var(--paper)}
  .ps-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
  .ps-topL{display:flex;align-items:center;gap:14px}
  .ps-logo{background:#fff;border:1px solid var(--ps-line);border-radius:14px;padding:8px 12px}
  .ps-logo img{display:block;height:42px;width:auto;max-width:170px;object-fit:contain}
  .ps-ttl b{display:block;font-size:14px;letter-spacing:.13em;text-transform:uppercase;color:var(--ps-navy)}
  .ps-ttl span{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.04em}
  .ps-badge{border:1px solid rgba(196,154,69,.5);background:rgba(196,154,69,.13);color:#76571e;border-radius:999px;
    padding:8px 14px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
  .ps-people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
  .ps-card{background:#fff;border:1px solid var(--ps-line);border-radius:22px;overflow:hidden;box-shadow:0 14px 40px rgba(7,31,56,.09)}
  .ps-head{padding:16px 20px 13px;border-bottom:1px solid var(--ps-line);background:linear-gradient(180deg,#fff,#f9fbfd);
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .ps-head h3{margin:0;font-family:var(--serif);font-size:22px;letter-spacing:.09em;text-transform:uppercase;color:var(--ps-navy)}
  .ps-head .ps-sub{margin-top:3px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:900}
  .ps-price{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px 0}
  .ps-price>div{border:1px solid var(--ps-line);border-radius:14px;background:#f9fbfd;padding:10px;text-align:center}
  .ps-price b{display:block;font-size:9.5px;color:#6f8194;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
  .ps-price .pw span{font-size:29px;font-weight:900;letter-spacing:-.05em;color:var(--ps-green);line-height:.9}
  .ps-price .pm span{font-size:21px;font-weight:900;letter-spacing:-.04em;color:var(--ps-navy);line-height:1}
  .ps-rows{padding:16px 18px;display:grid;gap:11px}
  .ps-row{border:1px solid var(--ps-line);border-radius:16px;padding:13px 16px;background:#fff;
    display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
  .ps-row.funeral{border-color:rgba(196,154,69,.5);background:linear-gradient(180deg,#fff,#fffaf0)}
  .ps-row.income{border-color:#c9e3d4;background:linear-gradient(180deg,#fff,#f3fbf6)}
  .ps-row.college{border-color:#cfe0f2;background:linear-gradient(180deg,#fff,#f5f9ff)}
  .ps-row.mortgage{border-color:#d8d3e8;background:linear-gradient(180deg,#fff,#f8f6ff)}
  .ps-row.ghgp{border-color:#cde6d6;background:linear-gradient(180deg,#f5fbf7,#fff);grid-template-columns:1fr}
  .ps-kick{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:900;letter-spacing:.13em;margin-bottom:4px}
  .ps-desc{font-size:16px;font-weight:900;color:#172c43;line-height:1.2;text-transform:uppercase;letter-spacing:-.01em}
  .ps-desc small{display:block;margin-top:5px;font-size:11px;color:var(--muted);font-weight:800;line-height:1.35;text-transform:none;letter-spacing:0}
  .ps-amt{font-size:clamp(26px,3vw,40px);font-weight:900;letter-spacing:-.05em;color:var(--ps-navy);white-space:nowrap;text-align:right;line-height:.95}
  .ps-amt em{display:block;font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:900;margin-top:5px}
  .ps-a71tag{display:inline-block;margin-top:6px;background:rgba(196,154,69,.16);border:1px solid rgba(196,154,69,.5);
    color:#76571e;border-radius:999px;padding:4px 9px;font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
  .ps-ghead{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--ps-green);
    font-size:11.5px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;margin-bottom:10px}
  .ps-ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .ps-gitem{background:#fff;border:1px solid var(--ps-line);border-radius:13px;padding:10px;text-align:center}
  .ps-gitem b{display:block;font-size:19px;color:var(--ps-navy);letter-spacing:-.04em;margin-bottom:3px}

  .ben>.bhead{display:flex;align-items:center;gap:9px;padding:10px 11px;cursor:pointer}

  .bcalc{font-size:11.5px;color:var(--cue);font-weight:800}
  .bswitch{display:flex;gap:6px}
  .bswitch button{flex:1;appearance:none;cursor:pointer;font-family:var(--sans);font-weight:800;font-size:11.5px;
    padding:7px 6px;border-radius:7px;border:1px solid var(--slate-line);background:#26313f;color:var(--slate-muted)}

  .btot{display:flex;gap:7px;margin-top:2px}

  .btot .c span{font-size:17px;font-weight:900;color:var(--cue)}

    padding:8px;border-radius:7px;border:1px solid var(--slate-line);background:#1d2836;color:var(--slate-muted)}

<script>
/* ==========================================================================
   ONE script, ONE slide order. No modes.
   Each slide: id, title, eyebrow, visual (+pdf), script, objections[3].
   ========================================================================== */
const SLIDES = [
  {id:'intro', title:'Introduction', eyebrow:'Getting Started', visual:'brand',
   script:`Have you ever met with someone like me about your benefits or happen to hear about us at a union meeting? Ok, do you remember that little card we talked about on the phone, that you filled out? Perfect… well, you're probably going to get that every couple of years from now on, as long as you are still in the union or are retired from the union. The reason is because we know the union does the best job it can of providing you with benefits, but we both know they can't give you everything you need with the amount of money they have to work with. That's exactly why they give you a chance to work with us, and today's your lucky day… You get to work with me.`,
   objections:[
     {t:'I already have coverage through the union', r:``},
     {t:`I don't remember filling out any card`, r:``},
     {t:'How long is this going to take?', r:``},
   ]},

  {id:'company', title:'American Income Life', eyebrow:'Our Company', visual:'brand',
   script:`The name of our company is American Income and we have been serving unions for over 70 years and work with over 40,000 different unions, including all the big ones like the UAW, Teamsters, Police, Fire Fighters, Veterans, and yours. The reason we work with all these unions is because we are a 100% wall-to-wall union benefit company. In fact, I'm a union member just like you. My union is the OPEIU Local 277, and we are the largest unionized benefit company in the country.

My job is simple but extremely important. I'm going to walk you through setting up your pre-paid benefits and answer all your questions, but more importantly, we are going to go through the permanent plans that you may qualify for. These benefits are designed to pick up where your work program left off and fill in your gaps. So, as we go through this, if you say to yourself, "Yeah, that makes sense, I see why they did this," GREAT, I'll set that up for you today. If not, NO BIG DEAL. The union guys have ALL liked it because it's SO much more affordable than what they get from non-union companies, and you'll see it's a far better variety of benefits. That's why EVERYONE enrolls… All they need is a yes or no, and that decision needs to be made today because we have several hundred of you guys to do this with, and we have to see you ONE- FAMILY- AT- A- TIME. Is that fair?`,
   objections:[
     {t:'Never heard of American Income — are you legit?', r:``},
     {t:`So you're just an insurance salesman?`, r:``},
     {t:'Why does it have to be decided today?', r:``},
   ]},

  {id:'add', title:'Accidental Death & Dismemberment', eyebrow:'', visual:'pdf', pdf:['add.pdf'],
   script:`The first thing you're getting is the Accidental Death and Dismemberment benefit. This will pay $4,000 to (beneficiary) if you were to die in any accident. It is also dismemberment, so it will also pay you half of the amount if you were to lose one hand, one foot, or sight in one eye and the full amount for the combination of any two. NO one is getting rich off of this, but it is non-contributory, which it means you DON'T pay for it, and we both know every little bit helps, right?!?!?!

Now just in case you were to pass away in a common accident, we need to take down two emergency contacts for each of you. These should be people you associate with regularly and are typically between the ages of 18 and 60 years old. Who's first? (name, relationship, city, phone)`,
   objections:[
     {t:'Why do you need my emergency contacts?', r:``},
     {t:`$4,000 isn't much — what's the catch?`, r:``},
     {t:`I'd rather not give out other people's info`, r:``},
   ]},

  {id:'csk', title:'Child Safe Kit', eyebrow:'', visual:'pdf', pdf:['csk.pdf'],
   script:`The next benefit is outstanding. I'm sure you would agree that protecting kids is the most important thing we can do, right? We have close relationships with First-Responders, Police, Firefighters, & Teachers and we've been trying to find ways to keep kids safer and this is what they have come up with. (show the Child Safe Kit slide)

When I email you, there will be a QR code. Once you have the app downloaded and your account set up, you will be prompted to scan or upload the QR code. Once the QR code is uploaded you will put all your kid's information into the app. It's the same information that's on this printable kit. Important information, such as section
Section 1 is for personal information: name nickname, height, weight, allergies, medication... all of that.
Section 2 is for Identifying marks: scars, birthmarks, glasses, braces and then you can mark where on the body it is.
Section 3 is for DNA samples: Fingernail clippings work and so does hair. If you use hair, it does need to be plucked because you need the root at the end.
Section 4 is for fingerprints: If you don't have inkpads, markers work but also any police station would be happy to roll the fingerprints. Then you know it was done correctly and the kids usually enjoy it because they get to meet uniformed officers and it's not scary because no one is in trouble.

Then on the next page, you'll add a current picture, along with the age and date it was taken. These printed copies are great to keep in the diaper bag or glove box of the car but once the info is in the app, it does great stuff.

Most parents have had a moment where they turn around and their kid isn't right there. Either they ran into the next aisle at the grocery store or down the beach... some parents feel like they never take their eyes off their kids in public, but things happen, and they happen fast. In fact, just over the past couple years, our Child Safe Kits have been accredited for helping to find two children abducted in the US. One child in Chicago, that was later found but taken by a crazed relative. The other in Houston, who was found at the border where her abductors were trying to leave the country.

(Share a personal story)

I'm sure you can see how every family with kids needs this right?

Now we've made a commitment to the American Federation of Teachers and the police unions that we would get these out to every family with kids and we can't do that without your help…

Who do you know, that loves their kids`,
   objections:[
     {t:`I don't have kids`, r:``},
     {t:`I don't want to give you my friends' names`, r:``},
     {t:'Is my kids info going into a database?', r:``},
   ]},

  {id:'will', title:'Will Kit', eyebrow:'', visual:'pdf', pdf:['will.pdf'],
   script:`How does probate work. (wait for response)
Probate is basically the court deciding who gets your stuff, making sure debts are paid, and giving permission before your family can access or distribute your assets. It can take months, and in some cases over a year. During that time, accounts can be frozen, bills still have to be paid, and your loved ones are dealing with paperwork and legal costs while they're grieving.

One of the MOST important benefits we have for our members is a Will Kit. This is something that EVERYONE needs, especially if you have minor children, but people have not had the time or money to set this up. Rather than spending a couple thousand dollars meeting with an attorney to set up a Will, we are providing you one of our professionally organized Will Kits at absolutely no-cost. Everything you need to protect your assets, and your family, is listed in the Will Kit. Now do you either use a regular brick and mortar bank, credit union, or online bank? You can get this notarized at the bank/credit union. Once you have this completely filled out, you will want to make a copy for a couple of people that are the closest to you. We all know how difficult it is to lose a loved one, so this needs to be done ASAP to protect your family`,
   objections:[
     {t:'I already have a will', r:``},
     {t:'Is this actually legally valid?', r:``},
     {t:`I don't have enough assets to need one`, r:``},
   ]},

  {id:'faminfo', title:'Family Information Guide', eyebrow:'', visual:'pdf', pdf:['faminfo.pdf'],
   script:`Now the will is for the court, if you dont mind me asking, have you ever had to handle or manage a funeral. (DOWN TONE SAD)
IF YES: Im sorry to hear that, it goes without saying theres alot you have to figure out or
IF NO: ok, now im sure youve seen someone else handle a funeral right? im sorry to hear that, who was it? it goes without saying theres alot you have to figure out or

this is the family information guide, this is for the family. This benefit is extremely important as it serves as a road map for your family when something bad happens. It pretty much tells everyone what you want done. For example (then walk them through and briefly show the below areas)
This is where you put your information, when something happens to you every place will require all of these details.
Are you a veteran?
Spouse Information
People to notify.
This part is EXTREMELY important, when some thing happens you need to make sure your family knows, theres a will, where to find it, and who the executor is.
This is where your insurances go, for example like everyone else you have regular old life insurance through work. (downplay how cool this is)
ok perfect is that 50 or 100 thousand.
awesome, now im sure you also have regular life insurance, or a funeral benefit, outside of work just like all the other union/association members right (make it sound like "duh" you have something)

(if yes): perfect, what company is that through. and how much is it worth. ok perfect that's where that information goes.
(if no): (act like stupid confused like WTF?) wait, you dont have anything out side of work? whys that, never thought about it or... (MAKE THEM FEEL STUPID)
(let them respond all confused put them on the spot)
Yea no worries well help you out with that but thats for later, this next part this is where the bank accounts go

when something happens to you you want to make sure they have access to you bank accounts to use the funds for final expenses and close the accounts.
now this is where you fill in final requests, for example, are you getting buried or cremated (not a question demand for it)`,
   objections:[
     {t:`I'd rather not share my financial details`, r:``},
     {t:'My spouse handles all of this', r:``},
     {t:`I don't want to think about dying`, r:``},
   ]},

  {id:'ailplus', title:'AIL Plus Savings', eyebrow:'', visual:'pdf', pdf:['ailplus.pdf'],
   script:`The next benefit helps EVERYONE save money. It's called the AIL PLUS program and it's designed to help with health-related costs. This doesn't affect any medical coverages you already have in any way. It saves so much money, up to 85%, on so many areas like glasses, dental, lab testing, and even vet bills and pet prescriptions. You'll get a separate email to set up the app for the program in the next few days. Just take some time and go through it to determine what's best for you and you family.`,
   objections:[
     {t:'Does this replace my health insurance?', r:``},
     {t:'Is there a fee for this?', r:``},
     {t:`I don't use apps`, r:``},
   ]},

  {id:'refs', title:'Blanket of Protection', eyebrow:'Referrals', visual:'brand',
   script:`All right, (Member), this next part, you're going to absolutely love this. This is the union blanket of protection benefits, Everyone has been super excited. For years, members would always ask us how to get these benefits out to protect the rest of their family. We always had to tell them, no, can't do it. Right? These are exclusive benefits. They are private to union dues-paying members. But since so many people were asking for it, they finally did it.
So initially, it was a spouse, then it was the kids, and then it was the family, but it's 2026, (Member). Family doesn't always mean blood. You could have a best friend out there that you consider closer than a brother or a sister.
So they said, okay, the 10 people you care about the most are going to be covered underneath this blanket of protection.
So here's how it works. Let's say something were to happen to your (Brother/Sister/Friend/Family Member). They pass away in a car accident tomorrow. Right? A $2,000 policy, just like the one I set up for you here today, is going to pay out to them just because they named their beneficiary. So maybe it goes to their spouse or their kids.
Now, keep in mind, this is at no cost to you or to them. It is already included with your program. It's been incredibly popular, so I don't know how long they're going to be able to keep doing this. It costs money.
So if we don't use your full $20,000, the rest is just going to go to waste.
So, of course, we're going to get the first 2 set up for your beneficiaries that are closest to you. But you have $16000 left in this that we need to use.
So who's next?`,
   objections:[
     {t:`I'm not comfortable giving out names and numbers`, r:``},
     {t:'Are you going to call all these people?', r:``},
     {t:'I need to ask them first', r:``},
   ]},

  {id:'letter', title:'Mandatory Read-Off Letter', eyebrow:'', visual:'letter',
   script:`Now these next benefits are by far the most important and most popular with the members, but before I go over them, I'm going to read (and read it all) this mandatory read-off letter. Here it is (show computer screen). It basically says that my job is to show you the benefits, explain how they work, answer any questions you have, and get you enrolled. These benefits are permanent for life, unlike most of the group benefits, where 31 days after you quit, leave or retire, what happens? (Wait for a response) Right… They're gone! The program will greatly enhance your current protection, but more importantly, it is permanent and portable. Even if you quit, leave or retire… they go with you ALWAYS! Does that make sense?`,
   objections:[
     {t:`So this part isn't free?`, r:``},
     {t:'I thought this was all union-provided', r:``},
     {t:`I'm not interested in buying anything`, r:``},
   ]},

  {id:'needs', title:'Needs Analysis', eyebrow:'Qualifying', visual:'brand',
   script:`The reason we go over these benefits with individual families, rather than meet with everyone at the same time, is simple… every family has different needs/wants with their benefits, depending on where they're at in life. (give examples: last guy was 18 living at home with parents, next member is 64 and retired) So, because of that, they have created a personalized needs analysis survey, which is designed to tailor fit these benefits exclusively to your family. (Begin to fill out family information).

Now like I mentioned earlier, these are the benefits you have to qualify for and there are three stipulations to qualify: First, you must be a union member in good standing, retired from the union, or referred by a union member which you are, or we wouldn't be meeting; Second, you have to qualify, which is BY FAR the hardest part. It's all based on your age, health, habits, and personal situation. And third, as I told you, you're going to know if this makes sense for you or it doesn't. But whatever decision you make, it needs to be made today. I cannot circle back because we meet each family one at a time to be able to tailor these programs specifically to your family. Fair enough? So, now I am going to ask some preliminary medical questions to see if it's even possible that you might qualify. (Go through health questions)`,
   objections:[
     {t:'Why do you need my medical history?', r:``},
     {t:`I have health issues — I won't qualify`, r:``},
     {t:`Can't you just email me the info?`, r:``},
   ]},

  {id:'hourpower', title:'The Hour Power Principle', eyebrow:'The Concept', visual:'brand',
   script:`How many hours are you working a week? Have you heard of the hour power principle before? It's the old union term that states you always need to set aside one hour of your wages, per week, to protect your family and their future. I see a lot of families and I don't know if you are like most of them, but most people waste half their money on things they don't even need. People are not setting aside even close to enough for their family and for their own future. So, what union members do is set aside just one hour of their wages each week for their permanent benefit package. EVERYONE can agree that just one hour never changes your lifestyle, right? Exactly! Because when you work just one less hour a week, you don't know the difference in your pay, do you? You are just going to spend it on something you don't even need. So, from this point forward, if you qualify, 39 hours a week you can spend on whatever you want… and just one hour will go towards your permanent benefits to protect your family's future. Does that make sense? Most members want to do more, but as long as you're doing at least one hour you will be okay. That makes sense, right? Perfect!`,
   objections:[
     {t:`Money's tight — I can't spare anything`, r:``},
     {t:'My hours change week to week', r:``},
     {t:'So how much is this actually going to cost me?', r:``},
   ]},

  {id:'fex', title:'The Cost of a Funeral Today', eyebrow:'Final Expense', visual:'fexchart',
   script:`IF TAKEN CARE OF FUNERAL: now obviously youve managed a funeral, if you dont mind me asking, how did you take care of it?

IF SOMEONE ELSE TOOK CARE OF FUNERAL: now obviously you've seen someone manage a funeral, if you don't mind me asking, how did they take care of it?

IF WITH LIFE INSURANCE: ok now how long ago was it?
IF BEFORE 2020: oh wow that exactly how it used to work. how fortunate.
IF AFTER 2020: Oh wow really, the life insurance payed for the funeral, you guy where really lucky.
IF OUT OF POCKET: Oh im so sorry to hear that, how did that affect the family?

Do you have any idea of what a funeral cost these days? That's right, about $15,000.
One of the things that most people don't realize is that life insurance typically isn't handling the costs of funerals like they used to. The way it used to work was, if something were to happen, and let's say Jim, you pass on, Jane would take your policy to the funeral home, give it to the funeral director and it would serve as collateral until the insurance check showed up. It rarely works like that anymore.

Years ago, before covid insurance companies had to pay on the policy within 24 days. but when the big public life insurance companies saw all those people where gonna die, well what do big companies do in the united states? (answer yourself), the throw some money at the government

so now, they have up to 6 months, in some cases, to hang onto your insurance money! Guess who earns the interest off the money while they hold it in their accounts? Of course, they are. That's why the insurance money takes so long to arrive! You've been seeing those GoFundMe's ALOT more right?! Thats why you see so many people getting burdened with funeral costs.`,
   objections:[
     {t:'I already have a burial policy', r:``},
     {t:'My kids will handle it', r:``},
     {t:`I'm being cremated, it's cheap`, r:``},
   ]},

  {id:'foc', title:'Freedom of Choice', eyebrow:'', visual:'pdf2', pdf:['foc.pdf','foc2.pdf'],
   script:`So, this IS different, this is what they call that's why THEY call the Freedom of Choice funeral benefit in. What this does is, if you die, and it doesn't matter when or how you die, you could die tomorrow in an auto accident, have a heart attack in ten years, or die of cancer at age 80... it doesn't matter. But, when it does happen, your funeral is covered! The way this works is… you would take this certificate to ANY funeral home, cemetery, or crematorium in the United States. In fact, funeral directors love this because they know it is union backed and they don't have to worry about it being paid. You have to get everything taken care of- flowers, casket, service, grave site – let's say the whole thing ends up totaling $15,000. You take the certificate, turn it over, write in $15,000 here (show them on the FOC), sign it here, hand it to the funeral director and the total costs of the funeral are completely taken care of. You DO NOT have to pay a dime out of pocket, as long as you can keep the total under however much we set this up r

Now, once we set this up say we set it up for $30,000, remember $30,000 its a real important number.

As you can see theses no designated Dollar amount for this certificate because if there was a 30k stamp on there,

The funeral director will call the 800 number on the front (highlight it) to verify the plan is in effect, and then, he will ask the one question that all funeral directors ask, "how much money does Jane have to work with?" If we told them and (BENEFICIARY) had $30,000 to work with, what do you think they would try to charge you? That's right, $30,000. So, we never reveal to them how much you have to work with. If you can get the costs for everything for, shoot, we dont care $5000, then we pay them the $5,000 and we cut you a check for the difference of $25000. This is the cleanest, easiest, most compassionate way to take care of what is going to happen to all us. Have you ever heard of a pre-arranged funeral? They are a great concept because everything is paid for prior to a death so the family doesn't have to deal with it. This is the same concept except even better because you're not limited to one geographical area and it's much less expensive.

Tie Down- Now, Mary and Jim I'm sure you can see how absolutely critical it would be to have this in place for your family when you die right?

Now, (Member), why is this so important to you, you die tomorrow, this pays out in 3 days to (wife)/and the kids`,
   objections:[
     {t:`What if the funeral home won't accept it?`, r:``},
     {t:'What if I die in the first two years?', r:``},
     {t:'Can the rates go up later?', r:``},
   ]},

  {id:'income', title:'Income Protection', eyebrow:'Protecting the Paycheck', visual:'incomestats',
   script:`The next concern, of course, deals with Income Protection. Now Mary, if Jim were to get hurt and be off from work for three months, with no paycheck coming in, how would that effect the family? Exactly, I'm sure it would be tough, but you would get by. Now, if Jim is killed on the way home from work tomorrow, his ability to earn an income stops forever. What is the first thing you are going to miss? Well hopefully him, however very quickly thereafter it will be his paycheck. That is exactly why the unions saw this as such a concern. So, what this program is designed to do, is when Jim dies, his income of (client's monthly income) per month will continue to come into the household each and every month, tax free/probate free, for the next five years or 60 months. This will allow you time to grieve and to adjust to losing Jim's income.

Tie Down- Jim, if you had the choice of protecting your income for your family, or NOT protecting your income for your family, which would you choose? Exactly. That's what everyone says.`,
   objections:[
     {t:`My spouse works, we'd be fine`, r:``},
     {t:'Social Security survivor benefits cover this', r:``},
     {t:'Why only 5 years?', r:``},

/* ============ Drive helpers ============ */
function driveId(url){ if(!url) return null;
  let m = url.match(/\/file\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/) || url.match(/\/d\/([^/]+)/);
  return m ? m[1] : null; }
function isImageUrl(u){ return /\.(png|jpe?g|gif|webp|svg)(\?|#|$)/i.test(u||''); }
function isPdfUrl(u){ return /\.pdf(\?|#|$)/i.test(u||''); }
function logoSrc(url){ if(!url) return ''; const id=driveId(url);
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url; }
function letterEmbed(url){ if(!url) return null; const id=driveId(url);
  if(id) return {type:'iframe', src:`https://drive.google.com/file/d/${id}/preview`};
  if(isImageUrl(url)) return {type:'img', src:url};
  if(isPdfUrl(url)) return {type:'iframe', src:url+'#toolbar=0&navpanes=0&view=FitH'};
  return {type:'iframe', src:url}; }

function blankCov(){

function cov(o){ const c=blankCov(); return Object.assign(c, o, {

function blankPS(){

const DEFAULT_STATE = { apiUrl:'', mainName:'', spouseName:'', income:'', union:'', logoUrl:'', letterUrl:'', slideIndex:0, ps:blankPS(), _v:0 };
let STATE = Object.assign({}, DEFAULT_STATE);
let localVersion = -1;

function readShared(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw) return hydrate(JSON.parse(raw)); }catch(e){} return null; }
// fill in any pitch-sheet keys a previously-saved state predates
function hydrate(s){
  if(!s) return s;
  const d=blankPS();
  const ps=Object.assign({}, d, s.ps||{});
  ps.main=Object.assign({}, d.main, ps.main||{});
  ps.spouse=Object.assign({}, d.spouse, ps.spouse||{});
  ps.cov=Object.assign({}, d.cov, ps.cov||{});
  Object.keys(d.cov).forEach(k=>{
    const b=d.cov[k], c=ps.cov[k]||{};
    ps.cov[k]={ fun:Object.assign({},b.fun,c.fun), inc:Object.assign({},b.inc,c.inc),
                col:Object.assign({},b.col,c.col), mtg:Object.assign({},b.mtg,c.mtg),
                ghgp:Object.assign({},b.ghgp,c.ghgp) };
  });
  s.ps=ps; return s;
}
// deep-ish commit for the nested ps object (shallow Object.assign would clobber it)
function psCommit(fn, silent){
  const cur = readShared() || Object.assign({}, DEFAULT_STATE, {ps:blankPS()});
  const ps = JSON.parse(JSON.stringify(cur.ps || blankPS()));
  fn(ps);
  commit({ps}, silent);
}
function commit(patch, silent){
  const cur = readShared() || Object.assign({}, DEFAULT_STATE);      // re-read so we don't clobber other fields
  const next = Object.assign({}, cur, patch);
  const maxI = SLIDES.length - 1;
  if(next.slideIndex > maxI) next.slideIndex = maxI;
  if(next.slideIndex < 0) next.slideIndex = 0;
  next._v = (cur._v||0) + 1;
  STATE = next; localVersion = next._v;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(next)); }catch(e){}
  if(!silent) render();
}
function poll(){
  const sh = readShared();
  if(sh && (sh._v||0) !== localVersion){
    localVersion = sh._v||0;
    STATE = Object.assign({}, DEFAULT_STATE, sh);
    render();
  }
}

function findUnion(g){ return UNIONS.find(u=>u.group===g); }
function pick(obj, keys){ for(const k of keys){ if(obj[k]!=null && String(obj[k]).trim()!=='') return String(obj[k]).trim(); } return ''; }
function mapRows(rows){
  const seen={};
  return (Array.isArray(rows)?rows:[]).map(row=>({
    group:   pick(row,['GROUP','Group','group']) || pick(row,['DISPLAY NAME','Display Name','DisplayName','display']),
    display: pick(row,['DISPLAY NAME','Display Name','DisplayName','display']) || pick(row,['GROUP','Group']),
    aliases: pick(row,['ALIASES','Aliases','aliases']),
    logo:    pick(row,['LOGO LINK','Logo Link','LOGO','logo','LogoLink']),
    letter:  pick(row,['LETTER LINK','Letter Link','LETTER','letter','LetterLink']),
  })).filter(u=>{
    if(!u.group) return false;
    if(seen[u.group]) return false;
    seen[u.group]=1; return true;
  }).sort((a,b)=>(a.display||'').localeCompare(b.display||''));
}
function parseCSV(text){
  const rows=[]; let row=[],f='',i=0,q=false;
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=c;i++; }
    else{ if(c==='"'){q=true;i++;} else if(c===','){row.push(f);f='';i++;}
      else if(c==='\r'){i++;} else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;}
      else{f+=c;i++;} } }
  row.push(f); rows.push(row);
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function csvToObjects(text){ const r=parseCSV(text); if(!r.length) return []; const h=r[0].map(x=>x.trim());
  return r.slice(1).map(rw=>{const o={};h.forEach((k,idx)=>o[k]=rw[idx]||'');return o;}); }

async function loadUnions(){
  const url=(document.getElementById('apiUrl').value||'').trim() || HARDCODED_API_URL;

  commit({apiUrl:url}, true); setStatus('apiStatus','Loading…','');
  try{
    const sep=url.includes('?')?'&':'?';
    const res=await fetch(url+sep+'format=json',{redirect:'follow'});
    const data=await res.json();
    UNIONS=mapRows(data);
    setStatus('apiStatus',`Loaded ${UNIONS.length} union${UNIONS.length===1?'':'s'}.`,'ok');
    render();
  }catch(err){
    setStatus('apiStatus','Fetch failed (often CORS from file://). Open your /exec?format=json in a browser tab, copy it, and use "Paste the data instead" above. '+(err&&err.message?('('+err.message+')'):''),'err');
  }
}

// whole-life band by face amount; 60+ always uses the senior graded book
function autoFuneralProduct(face,age){ age=nnum(age); face=nnum(face);
  if(age>=60) return 'wlsenior';
  if(face<=34999) return 'wl';
  if(face<=59999) return 'pr';
  if(face<=119999) return 'ex';
  return 'sl'; }
function funeralMonthly(p,face){ face=nnum(face); if(!face) return 0; const r=lookupRate(autoFuneralProduct(face,p.age),p); return r?face*r:0; }
function tenrcMonthly(p,face){ face=nnum(face); if(!face) return 0; const r=lookupRate('tenrc',p); return r?face*r:0; }
function adbRate(age){ const row=rowFor('adb',age); return row?nnum(row.Individual):null; }
function adbMonthly(p,face){ face=nnum(face); if(!face) return 0; const r=adbRate(p.age); return r==null?0:face*r; }
function a71Individual(age){ const row=rowFor('a71',age); if(row&&nnum(row.Individual)>0) return nnum(row.Individual); return isSenior(age)?A71.senior:A71.adult; }
// couple pricing when both people carry the program
function a71PremiumMap(people){
  const on=people.filter(x=>x.ghgp);
  const out=new Map(people.map(x=>[x.key,0]));
  if(!on.length) return out;
  if(on.length===1){ out.set(on[0].key, a71Individual(on[0].age)); return out; }
  const seniors=on.filter(p=>isSenior(p.age)).length;
  if(seniors===2){ on.forEach(p=>out.set(p.key,A71.seniorCouple/2)); return out; }
  if(seniors===0){ on.forEach(p=>out.set(p.key,A71.adultCouple/2)); return out; }
  on.forEach(p=>out.set(p.key,a71Individual(p.age)));
  return out;
}

/* ---- pitch sheet model ---- */
function psGet(){ return (STATE.ps)||blankPS(); }
function covKey(opt,who){ return String(opt)+who; }
function psCov(opt,who){ const ps=psGet(); return (ps.cov&&ps.cov[covKey(opt,who)])||blankCov(); }
function psPerson(who){
  const ps=psGet(), b=ps[who]||{};
  const nm = who==='main' ? (STATE.mainName||'Main') : (STATE.spouseName||'Spouse');
  return {key:who, label:nm, age:nnum(b.age), sex:b.sex||'M', tobacco:b.tobacco||'NTU', income:nnum(b.income)};
}
function psActiveWho(){ const ps=psGet(); return ps.spouseEnabled ? ['main','spouse'] : ['main']; }
// income protection face = months x that person's own monthly income
function incFace(p,c){ return nnum(c.inc.months) * p.income; }
// where the A71 $100k accidental is parked for this person, if anywhere
function a71Home(c){
  if(!c.ghgp.on) return null;
  if(c.col.on && c.col.a71) return 'college';
  if(c.mtg.on && c.mtg.basis==='adb' && c.mtg.a71) return 'mortgage';
  return 'standalone';
}
function psPersonRows(opt,who){
  const p=psPerson(who), c=psCov(opt,who);
  return {p, c, incFace:incFace(p,c), home:a71Home(c)};
}
function psPersonMonthly(opt,who,premiums){
  const {p,c}=psPersonRows(opt,who);
  let m=0;
  if(c.fun.on) m+=funeralMonthly(p,c.fun.amt);
  if(c.inc.on) m+=tenrcMonthly(p,incFace(p,c));
  if(c.col.on) m+=adbMonthly(p,c.col.amt);                                  // college is always ADB
  if(c.mtg.on) m+= c.mtg.basis==='adb' ? adbMonthly(p,c.mtg.amt) : tenrcMonthly(p,c.mtg.amt);
  m += (premiums && premiums.get(who)) || 0;
  return m;
}
function psPremiums(opt){
  return a71PremiumMap(psActiveWho().map(w=>({key:w, age:psPerson(w).age, ghgp:psCov(opt,w).ghgp.on})));
}
function psOptionMonthly(opt){
  const pm=psPremiums(opt);
  return psActiveWho().reduce((s,w)=>s+psPersonMonthly(opt,w,pm),0);
}
function money(n){ return '$'+Math.round(nnum(n)).toLocaleString('en-US'); }
function money2(n){ return '$'+nnum(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ---------------- PITCH SHEET (presentation side) ---------------- */
function psCardHtml(opt,who,premiums){
  const {p,c,incFace,home}=psPersonRows(opt,who);
  const rows=[];

  if(c.fun.on){
    rows.push(`<div class="ps-row funeral">
      <div><div class="ps-kick">Paid in 24–48 hours</div>
        <div class="ps-desc">Funeral Benefit<small>Freedom of Choice — any funeral home, cemetery or crematorium in the country. Anything left over is paid to the family.</small></div></div>
      <div class="ps-amt">${money(c.fun.amt)}</div></div>`);
  }
  if(c.inc.on){
    const mo=nnum(c.inc.months);
    rows.push(`<div class="ps-row income">
      <div><div class="ps-kick">Tax free · probate free</div>
        <div class="ps-desc">Income Protection<small>${money(p.income)} per month continues to the household for ${mo} month${mo===1?'':'s'}.</small></div></div>
      <div class="ps-amt">${money(incFace)}<em>${mo} months</em></div></div>`);
  }
  if(c.col.on){
    const parked = home==='college';
    const shown = nnum(c.col.amt) + (parked ? A71.car : 0);
    rows.push(`<div class="ps-row college">
      <div><div class="ps-kick">For the kids</div>
        <div class="ps-desc">College Education Benefit<small>College, trade school, or starting a business.${parked?` Includes the ${money(A71.car)} accidental benefit <b>(car accident)</b>.`:''}</small></div></div>
      <div class="ps-amt">${money(shown)}</div></div>`);
  }
  if(c.mtg.on){
    const parked = home==='mortgage';
    const shown = nnum(c.mtg.amt) + (parked ? A71.car : 0);
    rows.push(`<div class="ps-row mortgage">
      <div><div class="ps-kick">Keep the home</div>
        <div class="ps-desc">Mortgage Protection<small>Pays the home off free and clear.${parked?` Includes the ${money(A71.car)} accidental benefit <b>(car accident)</b>.`:''}</small></div></div>
      <div class="ps-amt">${money(shown)}</div></div>`);
  }
  if(c.ghgp.on){
    rows.push(`<div class="ps-row ghgp">
      <div class="ps-ghead"><span>Get Hurt, Get Paid Program</span><span>${isSenior(p.age)?'Senior rate':'Adult rate'}</span></div>
      <div class="ps-ggrid">
        <div class="ps-gitem"><b>${money(A71.er)}</b><span>ER / urgent care visit</span></div>
        <div class="ps-gitem"><b>${money(A71.hospital)}</b><span>Hospital night</span></div>
        <div class="ps-gitem"><b>${money(A71.icu)}</b><span>ICU night, up to 2 weeks</span></div>
      </div>
      ${home==='standalone'?`<div class="ps-acc">
        <div class="l">Accidental Benefit<small>(car accident)</small></div>
        <div class="v">${money(A71.car)}</div></div>`:''}
    </div>`);
  }

  if(!rows.length) rows.push(`<div class="ps-empty">No benefits selected yet.</div>`);

  const ps=psGet();
  const monthly = psPersonMonthly(opt,who,premiums);
  const weekly  = monthly*12/52;
  const priceBlock = ps.showPrices ? `<div class="ps-price">
      <div class="pw"><b>Weekly</b><span>${money2(weekly)}</span></div>
      <div class="pm"><b>Total Monthly</b><span>${money2(monthly)}</span></div>
    </div>` : '';

  return `<section class="ps-card">
    <div class="ps-head">
      <div><h3>${escHtml(p.label)}</h3><div class="ps-sub">${p.age?('Age '+p.age):'Permanent &amp; portable'}</div></div>
      ${c.ghgp.on?'<span class="ps-badge">Program Included</span>':''}
    </div>
    ${priceBlock}
    <div class="ps-rows">${rows.join('')}</div>
  </section>`;
}

function pitchSheetGraphic(logo){
  const ps=psGet(), opt=ps.option||1;
  const premiums=psPremiums(opt);
  const cards=psActiveWho().map(w=>psCardHtml(opt,w,premiums)).join('');
  const total=psOptionMonthly(opt);
  return `<div class="ps-slide">
    <div class="ps-top">
      <div class="ps-topL">
        ${logo?`<div class="ps-logo"><img src="${escAttr(logo)}" alt="union logo"></div>`:''}
        <div class="ps-ttl"><b>Your Benefit Package</b><span>American Income Life · Union Benefits</span></div>

let OBJ_OPEN = null;   // null | {scope:'slide', i:0-2} | {scope:'uni', i:n}
let ctrlPane = null;   // null (auto) | 'script' | 'build'
let bScroll = 0;       // builder scroll offset, preserved across re-renders

function renderControl(){

            <span class="k">${idx+1}</span><span class="t">${escHtml(o.t)}</span>
          </button>`).join('')}
        <button class="objpill uni" data-scope="uni" data-i="0" title="Universal objections">

        </button>
      </div>

      <div class="cfoot">
        <div class="pos">Slide ${i+1} of ${total}${s.eyebrow?` · ${escHtml(s.eyebrow)}`:''}</div>
        <div class="ctitle">${escHtml(s.title)}</div>
        <div class="nav">
          <button class="btn btn-ghost" id="prev" ${i===0?'disabled style="opacity:.4"':''}>← Prev</button>
          <button class="btn btn-red" id="next" ${i===total-1?'disabled style="opacity:.4"':''}>Next →</button>
        </div>
        <div class="jump"><select id="jump">
          ${SLIDES.map((sl,idx)=>`<option value="${idx}" ${idx===i?'selected':''}>${String(idx+1).padStart(2,'0')} · ${escHtml(sl.title)}</option>`).join('')}
        </select></div>
        <div class="vars">
          <div><label>Member</label><input id="cMain" type="text" placeholder="Jim" value="${escAttr(STATE.mainName)}"></div>
          <div><label>Spouse</label><input id="cSpouse" type="text" placeholder="Mary" value="${escAttr(STATE.spouseName)}"></div>
          <div><label>Income/mo</label><input id="cIncome" type="text" inputmode="numeric" placeholder="4,000" value="${escAttr(STATE.income)}"></div>
        </div>
        <div class="calc">
          <span class="chip">Income/mo <b id="chipInc">${inc?fmtMoney(inc):'—'}</b></span>
          <span class="chip">5-yr protection (×60) <b id="chipFive">${five?fmtMoney(five):'—'}</b></span>
        </div>
      </div>

      <div id="objdrawer"></div>
    </div>`;

  const $=id=>document.getElementById(id);
  document.getElementById('paneSeg').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{ ctrlPane=b.dataset.p; renderControl(); });
  });
  if(ctrlPane==='build') bindBuilder();
  $('prev').addEventListener('click',()=>go(-1));
  $('next').addEventListener('click',()=>go(1));
  $('jump').addEventListener('change',e=>commit({slideIndex:parseInt(e.target.value,10)||0}));
  // silent commits + targeted refresh so the caret never jumps while typing
  $('cMain').addEventListener('input',e=>{ commit({mainName:e.target.value}, true); refreshDerived(); });
  $('cSpouse').addEventListener('input',e=>{ commit({spouseName:e.target.value}, true); refreshDerived(); });
  $('cIncome').addEventListener('input',e=>{ commit({income:e.target.value}, true); refreshDerived(); });
  document.getElementById('objbar').querySelectorAll('.objpill').forEach(b=>{
    b.addEventListener('click',()=>toggleObj(b.dataset.scope, parseInt(b.dataset.i,10)));
  });
  paintObj();
}

function refreshDerived(){
  const s=SLIDES[STATE.slideIndex]||SLIDES[0];
  const sc=document.getElementById('script'); if(sc) sc.innerHTML=renderScriptText(s.script, STATE);
  const inc=parseMoney(STATE.income), five=inc?inc*60:0;
  const ci=document.getElementById('chipInc'), cf=document.getElementById('chipFive');
  if(ci) ci.textContent=inc?fmtMoney(inc):'—';
  if(cf) cf.textContent=five?fmtMoney(five):'—';
  if(OBJ_OPEN) paintObj();   // rebuttals substitute names/income too
}
function go(delta){
  const n=Math.max(0,Math.min(SLIDES.length-1,STATE.slideIndex+delta));
  if(n!==STATE.slideIndex){ OBJ_OPEN=null; commit({slideIndex:n}); }
}

      <button data-b="10rc" class="${!mtgAdb?'on':''}">10RC</button>
      <button data-b="adb" class="${mtgAdb?'on':''}">ADB</button>
    </div>
    ${mtgA71}`;

  const ghgpBody = `<div class="bnote">Pays ${money(A71.er)} ER/urgent care · ${money(A71.hospital)} hospital night · ${money(A71.icu)} ICU night.
      Comes with ${money(A71.car)} accidental <b>(car accident)</b>.</div>
    <div class="bcalc">${home==='standalone'?`Accidental shows on its own line`:home?`Accidental parked on ${home}`:''}</div>`;

  const totals = ps.showPrices ? `<div class="btot">
      <div class="c"><b>${escHtml(p.label)} / mo</b><span id="btPerson">${money2(psPersonMonthly(opt,who,premiums))}</span></div>
      <div class="c"><b>Option ${opt} total</b><span id="btTotal">${money2(psOptionMonthly(opt))}</span></div>
    </div>` : `<div class="bnote">Prices hidden — flip the switch above to price it.</div>`;

  return `<div class="bwrap" id="bwrap">
    <div class="bopts" id="bOpt">
      <button data-o="1" class="${opt===1?'on':''}">Option 1</button>
      <button data-o="2" class="${opt===2?'on':''}">Option 2</button>
    </div>

    <div class="bsec">
      <h4>Family Basics</h4>
      <label class="btoggle" style="margin-bottom:9px"><input type="checkbox" id="bSpouse" ${ps.spouseEnabled?'checked':''}> Include spouse?</label>
      <div class="bwho" id="bWho">
        <button data-w="main" class="${who==='main'?'on':''}">${escHtml(STATE.mainName||'Main')}</button>
        ${ps.spouseEnabled?`<button data-w="spouse" class="${who==='spouse'?'on':''}">${escHtml(STATE.spouseName||'Spouse')}</button>`:''}
      </div>
      <div class="bgrid g3">
        <div><label>Age</label><input type="text" inputmode="numeric" id="bAge" value="${escAttr(b.age||'')}" placeholder="42"></div>
        <div><label>Sex</label><select id="bSex">
          <option value="M" ${b.sex!=='F'?'selected':''}>Male</option>
          <option value="F" ${b.sex==='F'?'selected':''}>Female</option></select></div>
        <div><label>Tobacco</label><select id="bTob">
          <option value="NTU" ${b.tobacco!=='TU'?'selected':''}>No</option>
          <option value="TU" ${b.tobacco==='TU'?'selected':''}>Yes</option></select></div>
      </div>
      <div class="bfield" style="margin-top:7px"><label>Monthly income</label>
        <input type="text" inputmode="numeric" id="bInc" value="${escAttr(b.income||'')}" placeholder="4,000"></div>
      <div class="bnote" style="margin-top:7px">Sex and tobacco price the life products (funeral &amp; 10RC). ADB and the program price off age only.</div>
    </div>

    <div class="bsec">
      <h4>Coverage — Option ${opt} · ${escHtml(p.label)}</h4>
      ${benBlock('fun','Funeral Benefit',c.fun.on,funBody)}
      ${benBlock('inc','Income Protection',c.inc.on,incBody)}
      ${benBlock('col','College Education Benefit',c.col.on,colBody)}
      ${benBlock('mtg','Mortgage Protection Benefit',c.mtg.on,mtgBody)}
      ${benBlock('ghgp','Get Hurt, Get Paid Program',c.ghgp.on,ghgpBody)}
    </div>

    <div class="bsec">
      <h4>Pricing</h4>
      <label class="btoggle"><input type="checkbox" id="bPrices" ${ps.showPrices?'checked':''}> Show prices on the sheet</label>
      <div style="margin-top:9px">${totals}</div>
    </div>
  </div>`;
}

function bindBuilder(){
  const $=id=>document.getElementById(id);
  const ps=psGet(), opt=ps.option||1, who=ps.who||'main';
  const key=covKey(opt,who);
  // restore where the agent was, and keep tracking it — every commit re-renders this pane
  const wrap=$('bwrap');
  if(wrap){ wrap.scrollTop=bScroll; wrap.addEventListener('scroll',()=>{ bScroll=wrap.scrollTop; }); }

  $('bOpt').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    psCommit(s=>{ s.option=parseInt(b.dataset.o,10); }); }));
  const bw=$('bWho'); if(bw) bw.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    psCommit(s=>{ s.who=b.dataset.w; }); }));
  $('bSpouse').addEventListener('change',e=>psCommit(s=>{
    s.spouseEnabled=e.target.checked; if(!e.target.checked) s.who='main'; }));
  $('bPrices').addEventListener('change',e=>psCommit(s=>{ s.showPrices=e.target.checked; }));

  // person fields — silent commit so the caret holds, then redraw the derived math
  const person=(field,el,cast)=>{ if(!el) return;
    el.addEventListener('input',e=>{ psCommit(s=>{ s[who][field]=cast?cast(e.target.value):e.target.value; }, true); redrawSoft(); });
    el.addEventListener('change',e=>{ psCommit(s=>{ s[who][field]=cast?cast(e.target.value):e.target.value; }); }); };
  person('age',$('bAge'));
  person('income',$('bInc'));
  $('bSex').addEventListener('change',e=>psCommit(s=>{ s[who].sex=e.target.value; }));
  $('bTob').addEventListener('change',e=>psCommit(s=>{ s[who].tobacco=e.target.value; }));

  // benefit on/off
  document.querySelectorAll('.bchk').forEach(cb=>cb.addEventListener('change',()=>{
    const id=cb.dataset.ben;
    psCommit(s=>{
      const cc=s.cov[key]; cc[id].on=cb.checked;
      if(id==='ghgp' && !cb.checked){ cc.col.a71=false; cc.mtg.a71=false; }   // no program, nowhere to park
      if(id==='col' && !cb.checked) cc.col.a71=false;
      if(id==='mtg' && !cb.checked) cc.mtg.a71=false;
    });
  }));

  const amt=(el,path)=>{ if(!el) return;
    el.addEventListener('input',e=>{ const v=parseLoose(e.target.value); psCommit(s=>{ setPath(s.cov[key],path,v); }, true); redrawSoft(); });
    el.addEventListener('change',()=>{}); };
  amt($('bFunAmt'),'fun.amt');
  amt($('bIncMo'),'inc.months');
  amt($('bColAmt'),'col.amt');
  amt($('bMtgAmt'),'mtg.amt');

  // A71 exclusivity — parking it in one place clears the other
  const ca=$('bColA71'); if(ca) ca.addEventListener('change',e=>psCommit(s=>{
    const cc=s.cov[key]; cc.col.a71=e.target.checked; if(e.target.checked) cc.mtg.a71=false; }));
  const ma=$('bMtgA71'); if(ma) ma.addEventListener('change',e=>psCommit(s=>{
    const cc=s.cov[key]; cc.mtg.a71=e.target.checked; if(e.target.checked) cc.col.a71=false; }));

  const mb=$('bMtgBasis'); if(mb) mb.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    psCommit(s=>{ const cc=s.cov[key]; cc.mtg.basis=b.dataset.b; if(b.dataset.b!=='adb') cc.mtg.a71=false; }); }));
}
// light refresh: recompute the builder's derived numbers without stealing focus
function redrawSoft(){
  const ps=psGet(), opt=ps.option||1, who=ps.who||'main';
  const p=psPerson(who), c=psCov(opt,who);
  const calc=document.getElementById('bIncCalc');
  if(calc) calc.textContent=`${money(p.income)}/mo × ${nnum(c.inc.months)} = ${money(incFace(p,c))} of 10RC term`;
  if(ps.showPrices){
    const prem=psPremiums(opt);
    const a=document.getElementById('btPerson'), b=document.getElementById('btTotal');
    if(a) a.textContent=money2(psPersonMonthly(opt,who,prem));
    if(b) b.textContent=money2(psOptionMonthly(opt));
  }
}
function parseLoose(v){ const s=String(v==null?'':v).replace(/[^0-9.]/g,''); if(s===''||s==='.') return 0;
  const parts=s.split('.'); return Math.max(0, Number(parts.length>1?parts.shift()+'.'+parts.join(''):s)||0); }
function setPath(obj,path,val){ const k=path.split('.'); let o=obj; for(let i=0;i<k.length-1;i++) o=o[k[i]]; o[k[k.length-1]]=val; }

/* ---------------- objections ---------------- */
function objList(scope){
  if(scope==='uni') return UNIVERSAL;
  const s=SLIDES[STATE.slideIndex]||SLIDES[0];
  return s.objections||[];
}
function toggleObj(scope, i){
  if(OBJ_OPEN && OBJ_OPEN.scope===scope && OBJ_OPEN.i===i) OBJ_OPEN=null;
  else OBJ_OPEN={scope, i};
  paintObj();
}
function closeObj(){ if(OBJ_OPEN){ OBJ_OPEN=null; paintObj(); } }
function paintObj(){
  const drawer=document.getElementById('objdrawer');
  const bar=document.getElementById('objbar');
  if(!drawer||!bar) return;
  bar.querySelectorAll('.objpill').forEach(b=>{
    const on = !!OBJ_OPEN && OBJ_OPEN.scope===b.dataset.scope
            && (b.dataset.scope==='uni' || OBJ_OPEN.i===parseInt(b.dataset.i,10));
    b.classList.toggle('on', on);
  });
  if(!OBJ_OPEN){ drawer.classList.remove('open'); return; }
  const list=objList(OBJ_OPEN.scope);
  const o=list[OBJ_OPEN.i]||list[0];
  if(!o){ drawer.classList.remove('open'); return; }
  const body = (o.r && o.r.trim())
    ? renderScriptText(o.r, STATE)
    : `<p><em class="todo">No rebuttal written yet — add it to this objection's <code>r</code> field.</em></p>`;
  const tabs = OBJ_OPEN.scope==='uni'
    ? `<div class="odtabs">${list.map((u,idx)=>`<button class="odtab ${idx===OBJ_OPEN.i?'on':''}" data-i="${idx}" title="${escAttr(u.t)}">${escHtml(u.t)}</button>`).join('')}</div>`
    : '';
  drawer.innerHTML=`
    <div class="odhead">
      <div style="flex:1;min-width:0">
        <div class="odlab">${OBJ_OPEN.scope==='uni'?'Universal objection':'Objection'}</div>
        <div class="odtrig">${escHtml(o.t)}</div>
      </div>
      <button class="odx" id="odx" title="Close (Esc)">×</button>
    </div>
    <div class="odbody">${body}</div>
    ${tabs}`;
  drawer.classList.add('open');
  document.getElementById('odx').addEventListener('click', closeObj);
  drawer.querySelectorAll('.odtab').forEach(b=>{
    b.addEventListener('click',()=>{ OBJ_OPEN={scope:'uni', i:parseInt(b.dataset.i,10)}; paintObj(); });
  });
}

/* ============ script rendering ============ */
function renderScriptText(text, st){
  if(!text) return '';
  const inc=parseMoney(st.income);
  return text.split(/\n\s*\n/).map(para=>{
    let safe=escHtml(para);
    if(st.mainName) safe=safe.replace(/\(Member\)/g, escHtml(st.mainName));
    if(inc){ safe=safe.replace(/\(client\u2019s monthly income\)/g,escHtml(fmtMoney(inc)))
                     .replace(/\(client's monthly income\)/g,escHtml(fmtMoney(inc)))
                     .replace(/\(clients monthly income\)/g,escHtml(fmtMoney(inc))); }
    safe=safe.replace(/\([^)]*\)/g, m=>`<span class="cue">${m}</span>`);
    return `<p>${safe}</p>`;
  }).join('');
}

/* ============ helpers ============ */
function parseMoney(v){ const n=parseFloat(String(v||'').replace(/[^0-9.]/g,'')); return isFinite(n)?n:0; }
function fmtMoney(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
function escHtml(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ keyboard ============ */
if(MODE==='present'||MODE==='control'){
  window.addEventListener('keydown',e=>{
    const t=(e.target&&e.target.tagName||'').toLowerCase();
    if(t==='input'||t==='select'||t==='textarea') return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); go(1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(-1); }
    else if(e.key==='Home'){ e.preventDefault(); OBJ_OPEN=null; commit({slideIndex:0}); }
    else if(e.key==='End'){ e.preventDefault(); OBJ_OPEN=null; commit({slideIndex:SLIDES.length-1}); }
    if(MODE!=='control') return;
    if(e.key==='1'||e.key==='2'||e.key==='3'){ e.preventDefault(); toggleObj('slide', parseInt(e.key,10)-1); }
    else if(e.key==='u'||e.key==='U'||e.key==='4'){ e.preventDefault(); toggleObj('uni', OBJ_OPEN&&OBJ_OPEN.scope==='uni'?OBJ_OPEN.i:0); }
    else if(e.key==='Escape'||e.key==='0'){ e.preventDefault(); closeObj(); }
  });
}

/* ============ boot ============ */
// Opening the launcher starts a new family: nothing from the last sit carries over
// except the GAS URL. The present/control windows read whatever the launcher set.
function freshState(keep){
  const s=JSON.parse(JSON.stringify(DEFAULT_STATE));
  s.ps=blankPS();
  s.apiUrl=(keep&&keep.apiUrl)||HARDCODED_API_URL;
  s._v=((keep&&keep._v)||0)+1;
  return s;
}
(function boot(){
  const sh=readShared();
  if(MODE==='index'){
    STATE=freshState(sh);
    try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){}
    localVersion=STATE._v;
  }else if(sh){
    STATE=Object.assign({}, DEFAULT_STATE, sh); localVersion=sh._v||0;
  }
  if(!STATE.apiUrl && HARDCODED_API_URL) STATE.apiUrl=HARDCODED_API_URL;
  render();
  if(MODE==='index' && STATE.apiUrl){ loadUnions(); }
  window.addEventListener('storage', poll);      // live sync (Chrome/Edge fire this across file:// tabs)
  setInterval(poll, 400);                        // belt & suspenders
})();
</script>
