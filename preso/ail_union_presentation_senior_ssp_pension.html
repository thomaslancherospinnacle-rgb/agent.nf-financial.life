const STANDARD_SECTIONS = [{"id": "introduction", "title": "INTRODUCTION", "text": "Have you ever met with someone like me about your benefits or happen to hear about us at a union meeting? Ok, do you remember that little card we talked about on the phone, that you filled out? Perfect… well, you’re probably going to get that every couple of years from now on, as long as you are still in the union or are retired from the union. The reason is because we know the union does the best job it can of providing you with benefits, but we both know they can’t give you everything you need with the amount of money they have to work with. That’s exactly why they give you a chance to work with us, and today’s your lucky day… You get to work with me. \n\nThe name of our company is American Income and we have been serving unions for over 70 years and work with over 40,000 different unions, including all the big ones like the UAW, Teamsters, Police, Fire Fighters, Veterans, and yours. The reason we work with all these unions is because we are a 100% wall-to-wall union benefit company. In fact, I’m a union member just like you. My union is the OPEIU Local 277, and we are the largest unionized benefit company in the country. \n\nMy job is simple but extremely important. I’m going to walk you through setting up your pre-paid benefits and answer all your questions, but more importantly, we are going to go through the permanent plans that you may qualify for. These benefits are designed to pick up where your work program left off and fill in your gaps. So, as we go through this, if you say to yourself, “Yeah, that makes sense, I see why they did this,” GREAT, I’ll set that up for you today. If not, NO BIG DEAL. Understand this isn’t a big sales pitch. The union guys have ALL liked it because it’s SO much cheaper than what they get from non-union companies, and you’ll see it’s a far better variety of benefits. That’s why EVERYONE enrolls… All they need is a yes or no, and that decision needs to be made today because we have several hundred of you guys to do this with, and we have to see you ONE- FAMILY- AT- A- TIME. Is that fair? "}, {"id": "accidental-death-dismemberment", "title": "ACCIDENTAL DEATH & DISMEMBERMENT", "text": "The first thing you’re getting is the Accidental Death and Dismemberment benefit. This will pay $4,000 to (beneficiary) if you were to die in any accident. It is also dismemberment, so it will also pay you half of the amount if you were to lose one hand, one foot, or sight in one eye and the full amount for the combination of any two. NO one is getting rich off of this, but it is non-contributory, which it means you DON’T pay for it, and we both know every little bit helps, right?!?!?!\n\nNow just in case you were to pass away in a common accident, we need to take down two emergency contacts for each of you. These should be people you associate with regularly and are typically between the ages of 18 and 60 years old. Who’s first? (name, relationship, city, phone)"}, {"id": "referrals", "title": "REFERRALS", "text": "The next benefit that I have set up for you is AWESOME and you’re going to love this, it’s the friends and family program.\nWe only used to be available to union members, and for a long-time members would ask how they could get a benefit like the one you just received from people that they care about.\nNow with the help of your union, you can do just that!\nEach member that filled out their card is getting up to 10 of these certificates, like the one you got, to give out to their friends and family.\nThey will be valued at $2,000 each and how this works, for example, is that if something were to happen to (name of emergency contacts) and he were in a car accident, a $2,000 program will pay out to their family no matter what other benefits they have.\nThis is at no extra cost to you or to him, but it is very important to make sure you take advantage of this because I don’t know how long they will let you extend this, and if you don’t use all 10 the rest goes to waste. Keep in mind that this is at no cost to you or them.\nThe first benefits typically go to your emergency contacts because they are the ones who are closest to you, so we will make sure they are included… You have 8 left… who’s next?"}, {"id": "child-safe-kits", "title": "CHILD SAFE KITS", "text": "The next benefit is outstanding. I'm sure you would agree that protecting kids is the most important thing we can do, right? We have close relationships with First-Responders, Police, Firefighters, & Teachers and we’ve been trying to find ways to keep kids safer and this is what they have come up with. (show the Child Safe Kit slide)\n\nWhen I email you, there will be a QR code. Once you have the app downloaded and your account set up, you will be prompted to scan or upload the QR code. Once the QR code is uploaded you will put all your kid's information into the app. It’s the same information that’s on this printable kit. Important information, such as section \nSection 1 is for personal information: name nickname, height, weight, allergies, medication... all of that.\nSection 2 is for Identifying marks: scars, birthmarks, glasses, braces and then you can mark where on the body it is.\nSection 3 is for DNA samples: Fingernail clippings work and so does hair. If you use hair, it does need to be plucked because you need the root at the end.\nSection 4 is for fingerprints: If you don’t have inkpads, markers work but also any police station would be happy to roll the fingerprints.  Then you know it was done correctly and the kids usually enjoy it because they get to meet uniformed officers and it's not scary because no one is in trouble. \n\nThen on the next page, you’ll add a current picture, along with the age and date it was taken. These printed copies are great to keep in the diaper bag or glove box of the car but once the info is in the app, it does great stuff.   \n\nMost parents have had a moment where they turn around and their kid isn't right there. Either they ran into the next aisle at the grocery store or down the beach... some parents feel like they never take their eyes off their kids in public, but things happen, and they happen fast. In fact, just over the past couple years, our Child Safe Kits have been accredited for helping to find two children abducted in the US. One child in Chicago, that was later found but taken by a crazed relative. The other in Houston, who was found at the border where her abductors were trying to leave the country.\n(Share a personal story)\nEveryone with kids needs these don't they?\n\n we made a commitment to the police officers and american federation of teachers to get\nThese out to every family in the area thats got kids, only way we can do that is with your help, \n\n(just like x did for you) Who do you know with kids who would really appreciate these."}, {"id": "ail-plus", "title": "AIL PLUS", "text": "The next benefit helps EVERYONE save money. It’s called the AIL PLUS program and it’s designed to help with health-related costs. This doesn’t affect any medical benefits you already have in any way. It saves so much money, up to 85%, on so many areas like glasses, dental, lab testing, and even vet bills and pet prescriptions. You’ll get a separate email to set up the app for the program in the next few days. Just take some time and go through it to determine what’s best for you and you family. "}, {"id": "family-info-guide", "title": "FAMILY INFO GUIDE", "text": "This benefit is extremely important as it serves as a road map for your family when something bad happens. It pretty much tells everyone what you want done. For example (then walk them through and briefly show the below areas) \nTypical Information\nAre you a veteran?\nSpouse Information\nPeople to notify.\nDo you have a Will? That’s exactly why we’re here!\nList of all benefit programs. What policies do you have in place now?\nBank information… Do you have a credit union or just a traditional bank account?\nInformation specific to your passing, like cremation or earth burial."}, {"id": "living-will", "title": "LIVING WILL", "text": "One of the MOST important benefits we have for our members is a Will Kit. This is something that EVERYONE needs, especially if you have minor children, but people have not had the time or money to set this up. Rather than spending a couple thousand dollars meeting with an attorney to set up a Will, we are providing you one of our professionally organized Will Kits at absolutely no-cost. Everything you need to protect your assets, and your family, is listed in the Will Kit. There is also a place for it to be notarized at your bank or credit union. Once you have this completely filled out, you will want to make a copy for a couple of people that are the closest to you. We all know how difficult it is to lose a loved one, so this needs to be done ASAP to protect your family. "}, {"id": "sponsorship-program", "title": "SPONSORSHIP PROGRAM", "text": "Most importantly {{sponsor}} has given you ONE TIME exclusive access into all the benefits the {{assoc}} uses to protect their families\n\nTHANKS TO {{sponsor}} WHILE IM HERE I AM GOING TO TREAT YOU AS IF YOU ARE A MEMBER OF THE {{assoc}} EVERYTHING HE GETS OYU GET\n\nIm gonna give you a peak behind the curtain\n\nYour getting benefits that are vetted negotiated, and approved\n\nIf you dont do right by the union, you dont have the best stuff, you think their gona find someone who will? (WELL DUH)\n\nWe can proudly say weve been srervicing the unions for over 75"}, {"id": "read-off-letter", "title": "READ OFF LETTER", "text": "Now these next benefits are by far the most important and most popular with the members, but before I go over them, I’m going to read (and read it all) this mandatory read-off letter. Here it is (show computer screen). It basically says that my job is to show you the benefits, explain how they work, answer any questions you have, and get you enrolled. These benefits are permanent for life, unlike most of the group benefits, where 31 days after you quit, leave or retire, what happens? (Wait for a response) Right… They’re gone! The program will greatly enhance your current protection, but more importantly, it is permanent and portable. Even if you quit, leave or retire… they go with you ALWAYS! Does that make sense?"}, {"id": "transition-needs-analysis", "title": "TRANSITION- NEEDS ANALYSIS", "text": "The reason we go over these benefits with individual families, rather than meet with everyone at the same time, is simple… every family has different needs/wants with their benefits, depending on where they’re at in life. (give examples: last guy was 18 living at home with parents, next member is 64 and retired) So, because of that, they have created a personalized needs analysis survey, which is designed to tailor fit these benefits exclusively to your family. (Begin to fill out family information). \nNow like I mentioned earlier, these are the benefits you have to qualify for and there are three stipulations to qualify: First, you must be a union member in good standing, retired from the union, or referred by a union member which you are, or we wouldn’t be meeting; Second, you have to qualify, which is BY FAR the hardest part. It’s all based on your age, health, habits, and personal situation. And third, as I told you, you’re going to know if this makes sense for you or it doesn’t. But whatever decision you make, it needs to be made today. I cannot circle back because we meet each family one at a time to be able to tailor these programs specifically to your family. Fair enough? So, now I am going to ask some preliminary medical questions to see if it’s even possible that you might qualify. (Go through health questions)"}, {"id": "hour-power", "title": "HOUR POWER", "text": "How many hours are you working a week? Have you heard of the hour power principle before? It's the old union term that states you always need to set aside one hour of your wages, per week, to protect your family and their future. I see a lot of families and I don’t know if you are like most of them, but most people waste half their money on things they don’t even need. People are not setting aside even close to enough for their family and for their own future. So, what union members do is set aside just one hour of their wages each week for their permanent benefit package. EVERYONE can agree that just one hour never changes your lifestyle, right? Exactly! Because when you work just one less hour a week, you don’t know the difference in your pay, do you? You are just going to spend it on something you don’t even need. So, from this point forward, if you qualify, 39 hours a week you can spend on whatever you want… and just one hour will go towards your permanent benefits to protect your family’s future. Does that make sense? Most members want to do more, but as long as you’re doing at least one hour you will be okay. That makes sense, right? Perfect!"}, {"id": "funeral-final-expenses", "title": "FUNERAL & FINAL EXPENSES", "text": "Let me ask you a question. Have either of you ever had to handle the financial arrangements of a funeral? Has someone close to you passed away and you had to handle the financial side of it? (If they say yes, it’s important to find out how long ago and how much was spent. Also confirm the fact they probably had to put money down upfront.) Do you have any idea of what a funeral cost these days? That’s right, about $15,000.\nOne of the things that most people don’t realize is that benefit programs typically isn’t handling the costs of funerals like they used to. The way it used to work was, if something were to happen, and let’s say Jim, you pass on, Jane would take your program to the funeral home, give it to the funeral director and it would serve as collateral until the insurance check showed up. It rarely works like that anymore. \nYears ago, insurance companies had to pay on the program within 24 days. But now, they have up to 6 months, in some cases, to hang onto your money! Guess who gains the interest off the money while they’re holding it in their bank? Of course, they are. That’s why the insurance money takes so long to arrive and you see so many people getting burdened with funeral costs. \nSo, that’s why EVERYONE sets up of the Freedom of Choice funeral benefit in this package. \n\n(THIS IS A BIT DIFFERENT THIS IS WHAT THEY CALL A FUNERAL BENEFIT PLAN)\n\nWhat this does is, if you die, and it doesn’t matter when or how you die, you could die tomorrow in an auto accident, have a heart attack in ten years, or die of cancer at age 80... it doesn’t matter. But, when it does happen, your funeral is covered! The way this works is… you would take this certificate to ANY funeral home, cemetery, or crematorium in the United States. In fact, funeral directors love this because they know it is union backed and they don’t have to worry about it being paid because this pays out within 24 to 72 hours. You have to get everything taken care of- flowers, casket, service, grave site – let’s say the whole thing ends up totaling $15,000. You take the certificate, turn it over, write in $15,000 here (show them on the FOC), sign it here, hand it to the funeral director and the total costs of the funeral are completely taken care of. You DO NOT have to pay a dime out of pocket, as long as you can keep the total under $30,000. \nNow, that $30,000 is a real important number. The funeral director will call the 800 number to verify the plan is in effect, he will ask the one question that all funeral directors ask, “how much money does Jane have to work with?” If we told them and you had $30,000 to work with, what do you think they would try to charge you? That’s right, $30,000. So, we never reveal to them how much you have to work with. If you can get the costs for everything for $15,000 then we pay them the $15,000 and we cut you a check for the difference. This is the cleanest, easiest, most compassionate way to take care of what is going to happen to all us. Have you ever heard of a pre-arranged funeral? They are a great concept because everything is paid for prior to a death so the family doesn’t have to deal with it. This is the same concept except even better because you’re not limited to one geographical area and it’s much less expensive. Tie Down- Now, Mary and Jim I’m sure you can see how absolutely critical it would be to have this in place for your family when you die right?"}, {"id": "income-protection-paycheck-continuation-10rc", "title": "INCOME PROTECTION – Paycheck continuation 10rc", "text": "The next concern, of course, deals with Income Protection.  Now Mary, if Jim were to get hurt and be off from work for three months, with no paycheck coming in, how would that effect the family? Exactly, I’m sure it would be tough, but you would get by. Now, if Jim is killed on the way home from work tomorrow, his ability to earn an income stops forever.   What is the first thing you are going to miss? Well hopefully him, however very quickly thereafter it will be his paycheck.   That is exactly why the unions saw this as such a concern.  So, what this program is designed to do, is when Jim dies, his income of (family’s monthly income) per month will continue to come into the household each and every month, tax free/probate free, for the next \n(SAY 5 FOR BIG POLICIES)\n\nfive years or 60 months.   This will allow you time to grieve and to adjust to losing Jim’s income. Tie Down- Jim, if you had the choice of protecting your income for your family, or NOT protecting your income for your family, which would you choose?  Exactly.  That’s what everyone says. So with that being said, why do you think income protection is so important"}, {"id": "mortgage-protection", "title": "MORTGAGE PROTECTION", "text": "This next concern deals with your mortgage. What would you say is your biggest asset? (Let them answer) But in reality, who actually owns the home? Right, the bank, which actually make the house your biggest liability! Mary, do you know what would happen to the house if Joe died and you can’t make the mortgage payments? (Let her answer) Exactly… we don’t want to see that happen to your family. That is why this benefit is is designed to pay off the home. This way they get to keep the home free and clear and avoid losing the home you all built all those years of memories in. Makes sense? Tie Down- Mary, wouldn’t it give you peace of mind to know that your mortgage would be taken care of if Joe dies? "}, {"id": "child-education", "title": "CHILD EDUCATION", "text": "I am sure it goes without saying that we all want our kids to have better opportunities than we did, right? Well, that’s exactly what this next benefit is designed to protect. If anything were to happen to you, say in an accident, there will be up to $100,000 for each child to pay for college, trade school, or even start a business. The point is there, you may not be around anymore, but you are still there helping support their dreams. Tie Down- Doesn’t it make sense to have this in place to protect our kid’s future? Exactly!"}, {"id": "child-rider", "title": "CHILD RIDER", "text": "Oh, I almost forgot, this program also includes a child rider, and what this does is cover all your kids, under 18, for a $10,000 Freedom of Choice until they are 21. They also have the option to increase to $50,000 as well… no questions asked!!!"}, {"id": "get-hurt-get-paid", "title": "GET HURT GET PAID", "text": "Workers comp is ¼ of pay"}, {"id": "close", "title": "CLOSE", "text": "So, the best part is they set your benefits up like a payroll deduction, but just once a month through your own checking account. That’s important because when you change jobs or retire, you don’t have to worry about losing your benefits because they are under your control and not your employers. Pretty cool, huh? Everyone dies, we do not have a choice. But you do have a simple choice here… you take care of this when you are young, when you’re healthy, and when it is affordable, because if you don’t, your family is going to be in trouble. \n\nBut, probably the most important question I need to ask you is, something happens to both of you, say...in a bad car wreck, there will be a little over (TELL THEM THE TOTAL AMOUNT OF PROTECTION). Who do you want that money to go to? (CONFIRM BENEFICIARY INFORMATION, AND/OR CONTINGENT) \n\nMost families do the program I showed them, which is around that one hour, or ______($) a week. But because this makes so much sense, most families ask if they can do more, and want to do around two hours, or ______($) a week. That doubles your benefits (DOUBLE THEIR PAYCHECK OR FUNERAL BENEFIT and explain), but some people ask “can I just start with the program you showed me and add to it later,” well, you can do that too. But let’s make sure you qualify (go directly to page 2 of the application and complete all the health questions).\n(Get really excited when they qualify… Then show the pitch sheet… very assumptive.)"}, {"id": "before-walk-out-show-program", "title": "BEFORE WALK OUT SHOW PROGRAM", "text": "Now u got that down?\nIll let you guys look over that real quick, i gotta go ___ real quick"}, {"id": "couple", "title": "COUPLE", "text": "Let them talk, \nI know you have questions for me, so what kind of questions do you have for me.\n\nCOUPLE\nLet them talk, \nI know you have questions for me, so what kind of questions do you have for me."}, {"id": "single", "title": "SINGLE", "text": "What kind of questions do u have for me, which one of these 2 are going to start you with today.\n\nSINGLE\nWhat kind of questions do u have for me, which one of these 2 are going to start you with today.\n\nFor stubborn people, Hey they love feedback from folks like you who alr have this stuff figured and set, they want to know how it stacks up against "}, {"id": "art-notes", "title": "ART NOTES:", "text": "HAVE EAPP READY, \nGET THE WHOLE FAMILY ON NEEDS ANALYSIS\nAFTER FILLIN IN FAMIL TALK ABOUT 3 STIPULATIONS\nNSTEAD OF EXCLUDE ASK MEDICATION\n\n\nThese next questions are to tailor fit the benefits to your family\n\n“Do you know” ← YOU SAY THAT TOO MUCH\n\nMAKE THEM SAY A NAME INTO THE UNIVERS\n\nQ:name, you die tommorow, WHO IS GONNA TAKE CARE OF YOUT FUNERAL\n\nYour gonna be happy with either one,\n\nMost importantly john has given you ONE TIME exclusive access into all the benefits the MI PRO FIRE uses to protect their families\n\nTHANKS TO JOHN WHILE IM HERE I AM GOING TO TREAT YOU AS IF YOU ARE A MEMBER OF THE MI PRO FIRE EVERYTHING HE GETS OYU GET\n\nIm gonna give you a peak behind the curtain\n\nYour getting benefits that are vetted negotiated, and approved\n\nIf you dont do right by the union, you dont have the best stuff, you think their gona find someone who will? (WELL DUH)\n\nWe can proudly say weve been srervicing the unions for over 75\n\n\nYea theft think of every thing dont they,\n\nLets be real youre not dying of old age tommorow,if you die tommorwo it would be unexpected, statisically its due to an accident, if you do theres an extra 400k for the kids\n\nX why would it be so important , you die tmw your paycheck keeps coming in xyz\n\nIf stay at home.\n\nwife, why would it be so important , husband dies tmw his paycheck keeps coming for you (and the kids.)"}];

    "text": "Jim, you are receiving $(Jims income) a month in Social Security, and Mary, you are receiving $(Marys income) a month in Social Security. Together, that is $(combined income) coming into the household every month.\n\nThe important part is this: when one spouse passes away, the household does not keep both Social Security checks. The surviving spouse keeps the larger check, and the smaller check stops.\n\nSo the real loss is $(lost monthly income) every month. Over a full year, that is $(lost annual income) of income that is no longer coming into the home.\n\nThat is the only thing we are looking at here. No price pitch, no tier menu, and no package options. Just the lost Social Security income and whether the surviving spouse would need that monthly income protected while they adjust."

const INVESTMENT_SECTIONS = [
  {id:'investment-protection', title:'INVESTMENT PROTECTION', text:`When someone says, “I already have a million dollars of term,” the first thing I want to do is separate the big number from the actual monthly plan.

The common idea is that the family takes the death benefit, puts it into a high-yield savings account, and lives off the interest. So if the program is {{termProgram}}, at {{returnRate}}%, that is about {{annualReturn}} a year, or {{monthlyReturn}} a month before taxes, inflation, emergencies, and anything they have to spend immediately.

Now we have to subtract the real-world pressure points: burial costs, four to six months of income, and anything the family may lose if they have to borrow against inheritance or wait on an estate.

The point is simple: a big term program can still leave a short-term liquidity problem and a long-term income problem. We want to protect the part that has to work immediately.`},
  {id:'term-program-breakdown', title:'TERM AMOUNT BREAKDOWN', text:`Use the math on screen.

Principal amount: {{termProgram}}
Estimated return at {{returnRate}}%: {{annualReturn}} per year
Monthly income from interest: {{monthlyReturn}} per month
Burial/final expenses: {{burialCost}}
Four months of household income: {{income4}}
Six months of household income: {{income6}}
Potential 10% to 40% advance cost range: {{griefLow}} to {{griefHigh}}

After burial and six months of income pressure, the remaining principal is {{remaining6}}. That remaining principal is what associations look to protect, because once the principal gets eaten up, the interest strategy collapses.

So the question is not “is {{termProgram}} a big number?” Of course it is. The question is whether the plan creates immediate cash, replaces monthly income, and avoids forcing the family to spend principal before they even get stable.`}
];

function safeStorageGet(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'null')}catch(e){return null}}
function getState(){return Object.assign({}, defaultState, safeStorageGet()||{})}
function setState(partial, broadcast=true){
  const next = Object.assign({}, getState(), partial);
  localStorage.setItem(STORE_KEY, JSON.stringify(next));
  if(broadcast && bc) bc.postMessage({type:'state', state:next});
  return next;
}
function money(v){ const n = Number(String(v||'').replace(/[^0-9.-]/g,'')); return isFinite(n)&&n>0 ? '$'+Math.round(n).toLocaleString() : '$0'; }
function num(v){ const n = Number(String(v||'').replace(/[^0-9.-]/g,'')); return isFinite(n)?n:0; }
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function safeWording(html){
  return String(html||'')
    .replace(/client/gi, m=>m[0]===m[0].toUpperCase()?'Family':'family')
    .replace(/life insurance/gi, m=>m[0]===m[0].toUpperCase()?'Benefit program':'benefit program')
    .replace(/insurance/gi, m=>m[0]===m[0].toUpperCase()?'Benefit program':'benefit program')
    .replace(/policies/gi, m=>m[0]===m[0].toUpperCase()?'Plans':'plans')
    .replace(/policy/gi, m=>m[0]===m[0].toUpperCase()?'Plan':'plan')
    .replace(/coverage/gi, m=>m[0]===m[0].toUpperCase()?'Protection':'protection');
}

function currentSections(st=getState()){
  let sections;
  if(st.presoType==='senior'){
    sections = SENIOR_SECTIONS.slice();
    if(st.pensionEnabled) sections.splice(1, 0, ...SENIOR_PENSION_SECTIONS);
  } else {
    sections = STANDARD_SECTIONS.slice();
  }
  if(st.a71Enabled) sections = sections.concat(A71_SECTIONS);
  if(st.investmentEnabled) sections = sections.concat(INVESTMENT_SECTIONS);
  return sections;
}
function calc(st=getState()){
  const jimSS=num(st.jimSS), marySS=num(st.marySS), combined=jimSS+marySS, lost=Math.min(jimSS||0,marySS||0)||Math.max(jimSS,marySS);
  const pension=num(st.jimPension), survivor=Math.round(pension*.75), pLoss=Math.round(pension-survivor);
  const combinedMonthlyLoss = lost + pLoss;
  const combinedAnnualLoss = combinedMonthlyLoss * 12;
  return {jimSS,marySS,combined,lost,lostAnnual:lost*12,pension,survivor,pLoss,pAnnual:pLoss*12,p3:pLoss*3,p6:pLoss*6,p12:pLoss*12,combinedMonthlyLoss,combinedAnnualLoss};
}
function investmentCalc(st=getState()){
  const program = num(st.termPolicyAmount)||1000000;
  const rate = num(st.returnRate)||5;
  const monthlyIncome = num(st.monthlyIncome)||0;
  const burial = num(st.burialCost)||15000;
  const annualReturn = Math.round(program * rate / 100);
  const monthlyReturn = Math.round(annualReturn / 12);
  const income4 = Math.round(monthlyIncome * 4);
  const income6 = Math.round(monthlyIncome * 6);
  const griefLow = Math.round(program * .10);
  const griefHigh = Math.round(program * .40);
  const immediate4 = burial + income4;
  const immediate6 = burial + income6;
  const remaining4 = Math.max(0, program - immediate4);
  const remaining6 = Math.max(0, program - immediate6);
  const remainingAfterGriefLow = Math.max(0, program - griefLow);
  const remainingAfterGriefHigh = Math.max(0, program - griefHigh);
  return {program, rate, annualReturn, monthlyReturn, monthlyIncome, burial, income4, income6, griefLow, griefHigh, immediate4, immediate6, remaining4, remaining6, remainingAfterGriefLow, remainingAfterGriefHigh};
}
function renderTokens(text, st=getState()){
  const c=calc(st); const inv=investmentCalc(st);
  return String(text||'')
    .replaceAll('{{assoc}}', st.assoc || 'the union/association')
    .replaceAll('{{sponsor}}', st.sponsor || 'the sponsor')
    .replaceAll('{{termProgram}}', money(inv.program))
    .replaceAll('{{returnRate}}', String(inv.rate))
    .replaceAll('{{annualReturn}}', money(inv.annualReturn))
    .replaceAll('{{monthlyReturn}}', money(inv.monthlyReturn))
    .replaceAll('{{burialCost}}', money(inv.burial))
    .replaceAll('{{income4}}', money(inv.income4))
    .replaceAll('{{income6}}', money(inv.income6))
    .replaceAll('{{remaining4}}', money(inv.remaining4))
    .replaceAll('{{remaining6}}', money(inv.remaining6))
    .replaceAll('{{remainingAfterGriefLow}}', money(inv.remainingAfterGriefLow))
    .replaceAll('{{remainingAfterGriefHigh}}', money(inv.remainingAfterGriefHigh))
    .replaceAll('{{griefLow}}', money(inv.griefLow))
    .replaceAll('{{griefHigh}}', money(inv.griefHigh))
    .replaceAll('(family’s monthly income)', money(st.monthlyIncome))
    .replaceAll('$(Jims income)', money(st.jimSS))
    .replaceAll('$(Marys income)', money(st.marySS))
    .replaceAll('$(combined income)', money(c.combined))
    .replaceAll('$(lost monthly income)', money(c.lost))
    .replaceAll('$(lost annual income)', money(c.lostAnnual))
    .replaceAll('$(Jims pension)', money(st.jimPension))
    .replaceAll('$(Marys survivor pension)', money(c.survivor))
    .replaceAll('$(monthly pension loss)', money(c.pLoss))
    .replaceAll('$(annual pension loss)', money(c.pAnnual))
    .replaceAll('$(combined monthly loss)', money(c.combinedMonthlyLoss))
    .replaceAll('$(combined annual loss)', money(c.combinedAnnualLoss))
    .replaceAll('$(three-month pension loss)', money(c.p3))
    .replaceAll('$(six-month pension loss)', money(c.p6));
}

function scriptIndexForSlide(st=getState()){
  const deck=slideDeck(st), slide=deck[Math.max(0,Math.min(st.slideIndex,deck.length-1))];
  const sections=currentSections(st);
  const idx=sections.findIndex(s=>s.title===slide.script);
  return idx>=0?idx:Math.max(0,Math.min(st.scriptIndex,sections.length-1));
}
function gotoSlide(delta){ const st=getState(); const deck=slideDeck(st); setState({slideIndex: Math.max(0, Math.min(deck.length-1, st.slideIndex+delta))}); renderAll(); }
function setSlideIndex(i){ const st=getState(); const deck=slideDeck(st); setState({slideIndex: Math.max(0, Math.min(deck.length-1, Number(i)||0))}); renderAll(); }

function groupOptions(selected=''){
  const opts=['<option value="">Manual / AIL Default</option>'];
  groupRows.forEach((r,i)=>{ const key=rowKey(r,i); opts.push(`<option value="${esc(key)}" ${key===selected?'selected':''}>${esc(rowDisplay(r))}</option>`); });

function applyGroup(key){
  const row = groupRows.find((r,i)=>rowKey(r,i)===key);

function bindScriptControls(){
  const bind=(id,fn,ev='input')=>{const el=document.getElementById(id); if(el) el.addEventListener(ev,fn);};
  const fieldVal=(id,fallback='')=>{const el=document.getElementById(id); return el?el.value:fallback;};
  bind('sType',()=>{setState({presoType:document.getElementById('sType').value, slideIndex:0, scriptIndex:0}); renderAll();},'change');
  bind('sSlide',()=>setSlideIndex(document.getElementById('sSlide').value),'change');
  bind('sGroup',()=>{const v=document.getElementById('sGroup').value; applyGroup(v); renderAll();},'change');
  bind('objectionSel',()=>{setState({objectionId:document.getElementById('objectionSel').value}); renderAll();},'change');
  bind('togglePensionBtn',()=>{const st=getState(); const turnOn=!st.pensionEnabled; setState({pensionEnabled:turnOn}); renderAll(); if(turnOn){ const deck=slideDeck(getState()); const i=deck.findIndex(sl=>sl.id==='pension'); setSlideIndex(i>=0?i:getState().slideIndex); }},'click');
  bind('toggleInvestmentBtn',()=>{const st=getState(); const turnOn=!st.investmentEnabled; setState({investmentEnabled:turnOn}); renderAll(); if(turnOn){ const deck=slideDeck(getState()); const i=deck.findIndex(sl=>String(sl.id).startsWith('investment')); setSlideIndex(i>=0?i:0); window.open('https://agent.nf-financial.life/pitchsheet','_blank'); }},'click');
  bind('toggleA71Btn',()=>{const st=getState(); const turnOn=!st.a71Enabled; setState({a71Enabled:turnOn}); renderAll(); if(turnOn){ const deck=slideDeck(getState()); const i=deck.findIndex(sl=>String(sl.id).startsWith('a71')); setSlideIndex(i>=0?i:getState().slideIndex); }},'click');
  bind('jumpInvestmentBtn',()=>{let st=getState(); if(!st.investmentEnabled){setState({investmentEnabled:true}); st=getState(); window.open('https://agent.nf-financial.life/pitchsheet','_blank');} const deck=slideDeck(st); const i=deck.findIndex(sl=>String(sl.id).startsWith('investment')); setSlideIndex(i>=0?i:0);},'click');
  const update=()=>{const st=getState(); setState({assoc:fieldVal('sAssoc', st.assoc), logoUrl:fieldVal('sLogo', st.logoUrl)||DEFAULT_LOGO, letterLink:fieldVal('sLetter', st.letterLink), leadType:fieldVal('sLead', st.leadType), sponsor:fieldVal('sSponsor', st.sponsor), clientName:fieldVal('sFamily', st.clientName), monthlyIncome:fieldVal('sIncome', st.monthlyIncome), jimSS:fieldVal('sJimSS', st.jimSS), marySS:fieldVal('sMarySS', st.marySS), jimPension:fieldVal('sPension', st.jimPension), termPolicyAmount:fieldVal('sTerm', st.termPolicyAmount)||'1000000', returnRate:fieldVal('sRate', st.returnRate)||'5', burialCost:fieldVal('sBurial', st.burialCost)||'15000'});};

}

function welcomeSlide(st){return `<div class="twoCol"><div><div class="kicker">${esc(st.leadType||'Union Member')} Benefits</div><h1 class="bigTitle">Your Benefit Overview</h1><p class="subline">A simple walkthrough of the no-cost benefits, permanent programs, and family protection options available through the program.</p></div><div class="sponsorBigLogo">${logoImg(st)}</div></div><div class="cleanFooter">American Income Life</div>`;}
function sponsorSlide(st){return `<div class="sponsorSlide"><div><div class="sponsorBadge">Sponsored Access</div><h1 class="bigTitle">Sponsorship Program</h1><p class="subline">Covered by ${esc(st.assoc||'the union / association')}. The family gets access to the same benefit overview while we are here.</p><div class="bulletCards"><div class="bulletCard">Vetted benefit access</div><div class="bulletCard">Negotiated group relationship</div><div class="bulletCard">One-family-at-a-time review</div></div></div><div class="sponsorCard"><div class="sponsorBigLogo">${logoImg(st)}</div></div></div>`;}
function permanentSlide(){return `<div class="twoCol"><div class="leftPhoto"><div class="photoWords">Permanent<br>Portable<br>Personal</div></div><div><h1 style="font-size:52px;line-height:1.35;margin:0 0 18px;font-weight:1000;letter-spacing:-.04em">Permanent Benefit<br>Programs</h1><div class="benefitList"><div class="benefitItem"><div class="circle"></div><div><h3>Lifelong Protection</h3><p>Programs are permanent and portable, even if you leave your job.</p></div></div><div class="benefitItem"><div class="circle"></div><div><h3>Enhanced Benefits</h3><p>These programs enhance and extend beyond current work benefits.</p></div></div><div class="benefitItem" style="grid-column:1 / -1"><div class="circle"></div><div><h3>Personalized Approach</h3><p>We tailor benefits to your family’s specific needs and situation.</p></div></div></div></div></div>`;}
function hourPowerSlide(){return `<div class="hourSlide"><h1 class="hourTitle">The Hour Power Concept</h1><div class="hourFlow"><div class="hourItem"><div class="hourNum">1</div><div class="hourCopy"><h3>One Hour’s Wages</h3><p>Set aside one hour of weekly wages for family protection.</p></div></div><div class="hourItem"><div class="hourNum">2</div><div class="hourCopy"><h3>Embrace Simplicity</h3><p>One hour does not change your lifestyle or daily living.</p></div></div><div class="hourItem"><div class="hourNum">3</div><div class="hourCopy"><h3>Long-term Security</h3><p>A small weekly commitment can help protect the family’s future.</p></div></div></div></div>`;}
function pdfSlide(title, src){return `<div class="kicker">Member Benefit</div><h1 class="bigTitle" style="font-size:56px">${esc(title)}</h1><iframe class="docFrame" src="${esc(src)}#toolbar=0&view=FitH"></iframe>`;}
function letterSlide(st){ if(st.letterLink) return `<div class="kicker">Mandatory Read-Off Letter</div><h1 class="bigTitle" style="font-size:52px">Read-Off Letter</h1><iframe class="docFrame" src="${esc(st.letterLink)}"></iframe>`; return `<div class="docFallback"><div><h1 class="bigTitle" style="font-size:56px">Read-Off Letter</h1><p class="subline">No letter link was found for this association. Pick a union/association or paste the letter link in the script control panel.</p></div></div>`;}
function focSlide(){return `<div class="kicker">Final Expenses</div><h1 class="bigTitle" style="font-size:54px">Freedom of Choice</h1><div class="docGrid"><iframe src="${PDFS.foc}#toolbar=0&view=FitH"></iframe><iframe src="${PDFS.foc2}#toolbar=0&view=FitH"></iframe></div>`;}
function incomeSlide(){return `<div><div class="kicker">Permanent Program</div><h1 class="bigTitle">Income Protection</h1><p class="subline">Designed to help the household continue financially if income suddenly stops.</p><div class="metricGrid"><div class="metric"><b>Purpose</b><span>Paycheck</span></div><div class="metric"><b>Use</b><span>Monthly Bills</span></div><div class="metric"><b>Focus</b><span>Stability</span></div><div class="metric"><b>Family</b><span>Protected</span></div></div></div>`;}
function simpleBenefitSlide(title, text){return `<div><div class="kicker">Permanent Program</div><h1 class="bigTitle">${esc(title)}</h1><p class="subline">${esc(text)}</p></div>`;}
function mortgageProtectionSlide(){return `<div class="mortgageHero"><div class="kicker">Permanent Program</div><h1 class="bigTitle" style="font-size:64px">Mortgage Protection</h1><p class="subline">Protecting the home is not just about the balance. It is about time, liquidity, and keeping the family from being forced into a rushed decision.</p><div class="calloutStrip"><div class="callout"><b>Reverse Mortgage Pressure</b><span>30-day response window</span><p>CFPB states that after heirs receive a due-and-payable notice on a HECM reverse mortgage, they have 30 days to buy, sell, or turn over the home.</p></div><div class="callout"><b>Family Stability</b><span>Keep • Sell • Refinance</span><p>Mortgage protection gives the family breathing room instead of making the house decision under financial pressure.</p></div></div><div class="sourceNote">Source: Consumer Financial Protection Bureau, Ask CFPB reverse mortgage heirs guidance.</div></div>`;}
function childEducationSlide(){return `<div class="educationHero"><div class="kicker">Permanent Program</div><h1 class="bigTitle" style="font-size:64px">Child Education</h1><p class="subline">The goal is to keep future options open if the income meant to help with school suddenly disappears.</p><div class="factGrid"><div class="factCard"><strong>70%</strong><h3>Parents worried</h3><p>A national Discover Student Loans survey reported that 70% of parents with college-bound children were worried about having enough money to pay for college.</p></div><div class="factCard"><strong>Plan</strong><h3>Education continuity</h3><p>Protection can help protect college, trade school, or other future opportunities.</p></div><div class="factCard"><strong>Choice</strong><h3>More than loans</h3><p>The point is keeping the child’s path from being decided by a financial emergency.</p></div></div><div class="sourceNote">Source: Discover Student Loans national survey, published via Business Wire.</div></div>`;}

function a71ErSlide(){return `<div class="a71Slide"><div class="kicker">Get Hurt Get Paid</div><h1 class="bigTitle" style="font-size:66px">ER / Urgent Care Benefit</h1><p class="subline">When an accident sends someone for immediate treatment, the family gets cash help for the first hit.</p><div class="a71Cards"><div class="a71Card green"><b>Emergency Room</b><span>$250</span><p>Paid when treatment goes through the ER.</p></div><div class="a71Card blue"><b>Urgent Care</b><span>$250</span><p>Paid when the injury is handled through urgent care.</p></div><div class="a71Card gold"><b>First Shock</b><span>Cash</span><p>The point is helping with out-of-pocket pressure right away.</p></div></div></div>`;}
function a71HospitalSlide(){return `<div class="a71Slide"><div class="kicker">Get Hurt Get Paid</div><h1 class="bigTitle" style="font-size:66px">Hospital + ICU Benefit</h1><p class="subline">If the accident becomes serious, the cash help increases during the hospital stay.</p><div class="a71Cards"><div class="a71Card blue"><b>Hospital Night</b><span>$500</span><p>Per hospital night.</p></div><div class="a71Card gold"><b>ICU Night</b><span>$1,000</span><p>Per ICU night.</p></div><div class="a71Card green"><b>Benefit Period</b><span>14 Days</span><p>Built for the first critical stretch of the emergency.</p></div></div></div>`;}

function investmentHundredSlide(st){ const inv=investmentCalc(st); return `<div class="investmentSlide"><div class="kicker">Investment Protection</div><h1 class="bigTitle" style="font-size:62px">The $100 Bill Test</h1><p class="subline">A large term amount sounds simple until the family has to turn the big number into monthly income, immediate cash, and long-term stability.</p><div class="hundredGrid"><div class="billStack"><b>${money(inv.program)}</b></div><div class="mathBoard"><div class="mathCell"><b>Principal amount</b><span>${money(inv.program)}</span></div><div class="mathCell"><b>Common assumption</b><span>HYSA</span></div><div class="mathCell"><b>Rate used</b><span>${inv.rate}%</span></div><div class="mathCell"><b>Before pressure</b><span>Looks big</span></div></div></div></div>`;}
function investmentReturnSlide(st){ const inv=investmentCalc(st); const monthlyPct=Math.min(100, Math.max(4, inv.monthlyReturn/(inv.monthlyIncome||inv.monthlyReturn||1)*100)); return `<div class="investmentSlide"><div class="kicker">Investment Protection</div><h1 class="bigTitle" style="font-size:62px">HYSA Income Math</h1><p class="subline">Hypothetical: ${money(inv.program)} at ${inv.rate}% produces ${money(inv.annualReturn)} a year, or about ${money(inv.monthlyReturn)} a month before taxes, inflation, and emergencies.</p><div class="barChart"><div class="barRow"><div class="barLabel">Principal Amount</div><div class="barTrack"><div class="barFill" style="width:100%"></div></div><div class="barVal">${money(inv.program)}</div></div><div class="barRow"><div class="barLabel">Annual Interest</div><div class="barTrack"><div class="barFill" style="width:${Math.min(100, Math.max(6, inv.annualReturn/inv.program*100*4))}%"></div></div><div class="barVal">${money(inv.annualReturn)}</div></div><div class="barRow"><div class="barLabel">Monthly Interest</div><div class="barTrack"><div class="barFill" style="width:${monthlyPct}%"></div></div><div class="barVal">${money(inv.monthlyReturn)}</div></div></div><div class="sourceNote">Hypothetical 5% return assumption. Not guaranteed.</div></div>`;}
function investmentGapSlide(st){ const inv=investmentCalc(st); return `<div class="investmentSlide"><div class="kicker">Investment Protection</div><h1 class="bigTitle" style="font-size:62px">The Immediate Gap</h1><p class="subline">Before the family can live off interest, the first bills show up.</p><div class="shockGrid"><div class="shockCard"><b>Burial / Final Expense</b><span>${money(inv.burial)}</span><p>Immediate funeral-related pressure before the long-term plan starts.</p></div><div class="shockCard"><b>4 Months Income</b><span>${money(inv.income4)}</span><p>Four months of household income subtracted from the plan.</p></div><div class="shockCard"><b>6 Months Income</b><span>${money(inv.income6)}</span><p>Six months of household income subtracted from the plan.</p></div><div class="shockCard"><b>Advance Fee Range</b><span>10–40%</span><p>Inheritance/probate advance pricing is often structured as a flat discount, not a normal bank loan.</p></div></div><div class="sourceNote">Sources: Catalina Structured Funding / probate advance pricing examples; estate advance industry pricing pages.</div></div>`;}
function investmentProtectionSlide(st){ const inv=investmentCalc(st); return `<div class="investmentSlide"><div class="kicker">Investment Protection</div><h1 class="bigTitle" style="font-size:62px">Protect the Principal</h1><p class="subline">The problem is not the big number. The problem is forcing the family to spend principal or borrow against future money during the first few months.</p><div class="factGrid"><div class="factCard"><strong>${money(inv.immediate4)}</strong><h3>4-month pressure</h3><p>Burial plus four months of income creates an immediate liquidity need.</p></div><div class="factCard"><strong>${money(inv.immediate6)}</strong><h3>6-month pressure</h3><p>Six months of income plus final expenses can eat into the interest strategy fast.</p></div><div class="factCard"><strong>${money(inv.griefLow)}–${money(inv.griefHigh)}</strong><h3>Potential grief tax</h3><p>At 10%–40%, a cash advance against inheritance can take a major bite out of what was meant for the family.</p></div></div><div class="remainingPrincipal"><div><b>Original Principal</b><span>${money(inv.program)}</span></div><div><b>Less 6-Month Pressure</b><span>− ${money(inv.immediate6)}</span></div><div class="remainingFocus"><b>Remaining Principal</b><span>${money(inv.remaining6)}</span></div></div><div class="associationProtect">This is what associations look to protect.</div></div>`;}
function investmentRemainingSlide(st){ const inv=investmentCalc(st); const totalShock=inv.immediate6+inv.griefHigh; const remaining=Math.max(0, inv.program-totalShock); const newInterest=Math.round(remaining*inv.rate/100); return `<div class="scarySlide"><div class="kicker">Investment Protection</div><h1 class="bigTitle" style="font-size:62px">What Remains After the First Shock?</h1><p class="subline">If the family has to eat final expenses, six months of household income, and a potential 40% advance hit, the big number can shrink fast.</p><div class="dangerHero"><div class="dangerBox"><b>Potential 40% Grief Tax</b><span>− ${money(inv.griefHigh)}</span><p>That is money taken away from the principal that was supposed to keep producing income for the family.</p></div><div class="dangerMath"><div class="dangerRow"><strong>Original Principal</strong><span>${money(inv.program)}</span></div><div class="dangerRow red"><strong>Final expenses + 6 months</strong><span>− ${money(inv.immediate6)}</span></div><div class="dangerRow red"><strong>Potential 40% advance hit</strong><span>− ${money(inv.griefHigh)}</span></div><div class="dangerRow green"><strong>Remaining after pressure</strong><span>${money(remaining)}</span></div><div class="dangerRow"><strong>New yearly interest @ ${inv.rate}%</strong><span>${money(newInterest)}</span></div></div></div><div class="associationProtect">This is what associations look to protect: the principal that is supposed to keep producing income for the family.</div></div>`;}
function socialSecuritySlide(st){
  const c=calc(st);
  return `<div><div class="kicker">Senior Presentation</div><h1 class="bigTitle" style="font-size:64px">Social Security Protection</h1><p class="subline">The surviving spouse keeps the greater Social Security check. The smaller check stops. This slide only shows the lost income math.</p><div class="metricGrid noPitchNumbers"><div class="metric"><b>Current Household SSI</b><span>${money(c.combined)}</span><small>Combined monthly Social Security today.</small></div><div class="metric"><b>Monthly SSI Loss</b><span>${money(c.lost)}</span><small>The check that stops after one spouse passes.</small></div><div class="metric"><b>Yearly Income Cost</b><span>${money(c.lostAnnual)}</span><small>The annual household income gap.</small></div><div class="metric"><b>Conversation</b><span>No Pitch Tiers</span><small>No tier menu. No price pitch.</small></div></div></div>`;
}
function tiersSlide(st){
  return socialSecuritySlide(st);
}
function pensionSlide(st){
  const c=calc(st);
  return `<div><div class="kicker">Senior Presentation</div><h1 class="bigTitle" style="font-size:64px">Pension Loss</h1><p class="subline">If the survivor receives 75% of the pension, the remaining 25% becomes a monthly income gap.</p><div class="metricGrid noPitchNumbers"><div class="metric"><b>Full Pension</b><span>${money(c.pension)}</span><small>Monthly pension before survivor reduction.</small></div><div class="metric"><b>75% Survivor</b><span>${money(c.survivor)}</span><small>Estimated monthly survivor pension.</small></div><div class="metric"><b>Monthly Pension Loss</b><span>${money(c.pLoss)}</span><small>The monthly pension income gap.</small></div><div class="metric"><b>Yearly Income Cost</b><span>${money(c.pAnnual)}</span><small>The annual pension income gap.</small></div></div></div>`;
}
function combinedSeniorSlide(st){
  const c=calc(st);
  return `<div><div class="kicker">Senior Presentation</div><h1 class="bigTitle" style="font-size:58px">SSP + Pension Protection</h1><p class="subline">This combines the Social Security loss and the pension loss into one clear monthly income gap.</p><div class="metricGrid noPitchNumbers"><div class="metric"><b>SSI Loss</b><span>${money(c.lost)}</span><small>Monthly Social Security income no longer coming in.</small></div><div class="metric"><b>Pension Loss</b><span>${money(c.pLoss)}</span><small>Monthly pension income no longer coming in.</small></div><div class="metric"><b>Total Monthly Loss</b><span>${money(c.combinedMonthlyLoss)}</span><small>The real monthly income gap.</small></div><div class="metric"><b>Yearly Income Cost</b><span>${money(c.combinedAnnualLoss)}</span><small>Total annual household income lost.</small></div></div></div>`;
}
function closeSlide(title,text){return `<div style="height:100%;display:grid;place-items:center;text-align:center"><div><div class="kicker">Close</div><h1 class="bigTitle">${esc(title)}</h1><p class="subline" style="margin:auto">${esc(text)}</p></div></div>`;}

bindSync();
renderAll();
loadGroups();
</script>
</body>
</html>
