<script>
(function(){
'use strict';
const CALENDLY_DEFAULT='https://calendly.com/thomaslancheros-ail/30min';
const LS='impact_clone_sheet_tabs_calendly_v2';
const STATUS_OPTIONS=['All','New','Dialed','No Answer','Voicemail','Callback','Not Interested','Bad Number','Calendly Opened','Booked','Deleted'];
let state=loadState();
const app=document.getElementById('app');
const toast=document.getElementById('toast');
function defaultState(){return {config:{agentName:'THOMAS LANCHEROS',sheetUrl:'',calendlyUrl:CALENDLY_DEFAULT,autoLogCalendly:true},view:'setup',showMenu:false,leads:[],tabs:[],events:[],activeTab:'All',activity:'All',search:'',sort:'Newest Sheet First',page:1,pageLen:25,currentKey:'',loadedAt:'',loading:false,sheetError:'',modal:null};}
function loadState(){try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(LS)||'{}'));}catch(e){return defaultState();}}
function saveAll(){localStorage.setItem(LS,JSON.stringify(state));}
function clean(v){return String(v==null?'':v).replace(/\s+/g,' ').trim();}
function h(s){return clean(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function nowIso(){return new Date().toISOString();}
function dateHuman(iso){try{return new Date(iso).toLocaleString();}catch(e){return iso||'';}}
function dateStamp(){return new Date().toISOString().slice(0,10);}
function flash(msg,kind){toast.textContent=msg;toast.style.background=kind==='err'?'#8f0000':(kind==='ok'?'#114e1e':'#111');toast.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>toast.style.display='none',2800);}
function hashKey(s){let n=2166136261; s=String(s||''); for(let i=0;i<s.length;i++){n^=s.charCodeAt(i); n=Math.imul(n,16777619);} return (n>>>0).toString(36);}
function phoneDigits(v){let d=String(v||'').replace(/\D+/g,''); if(d.length===11&&d[0]==='1')d=d.slice(1); return d;}
function phoneFmt(v){const d=phoneDigits(v); return d.length===10?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):clean(v);}
function first(){for(let i=0;i<arguments.length;i++){const s=clean(arguments[i]);if(s)return s;}return '';}
function tabBaseName(t){return clean(t).replace(/\s*\([^)]+\)\s*$/,'');}
function sheetReady(){return state.config&&/^https:\/\/script\.google\.com\/macros\/s\//i.test(clean(state.config.sheetUrl));}
function isSpecialTab(name){return /^(TRACKER|NUMBERS)$/i.test(clean(name));}
function validSheetTab(name){return clean(name)&&!isSpecialTab(name);}
function leadKey(l){return l.key||[l.tab||'',l.rowIdx||'',l.leadId||'',l.phone||'',l.email||'',l.name||''].join('|');}
function leadByKey(key){return (state.leads||[]).find(l=>leadKey(l)===key)||null;}
function sheetTabs(){return (state.tabs||[]).filter(t=>t&&validSheetTab(t.name));}
function tabLeadCount(tabName){return (state.leads||[]).filter(l=>l.tab===tabName).length;}
function rowToObject(headers,row,tab,rowIdx){const o={__tab:tab,__rowIdx:rowIdx,__source:'sheet'};(headers||[]).forEach((hdr,i)=>{if(clean(hdr))o[clean(hdr)]=row[i]??'';});return o;}
function val(o){for(let i=1;i<arguments.length;i++){const k=arguments[i]; if(o[k]!=null&&clean(o[k]))return o[k]; const found=Object.keys(o).find(x=>x.toLowerCase()===String(k).toLowerCase()); if(found&&clean(o[found]))return o[found];}return '';}
function normalizeLead(o){
  const tab=val(o,'__tab')||o.tab||'';
  const rowIdx=Number(val(o,'__rowIdx')||o.rowIdx||0)||'';
  const firstName=first(val(o,'Referral First Name','First Name','firstName'));
  const middle=first(val(o,'Referral Middle','Middle Name','middleName'));
  const lastName=first(val(o,'Referral Last Name','Last Name','lastName'));
  const referralFull=[firstName,middle,lastName].filter(Boolean).join(' ');
  const phone=first(val(o,'Phone','Home Phone','phone'),val(o,'Referral Phone','referralPhone'),val(o,'Cell','Cell Phone','cellPhone','Mobile Phone'));
  const cell=first(val(o,'Cell','Cell Phone','cellPhone','Mobile Phone'),val(o,'Referral Phone','referralPhone'));
  const email=first(val(o,'Email','email','Referral Email','referralEmail','EmailAddress'));
  const l={
    key:'',
    leadId:first(val(o,'Lead ID','leadId','LeadId'), tab&&rowIdx?tab+':'+rowIdx:''),
    name:first(val(o,'Name','Lead Name','name'), referralFull),
    referralFirstName:firstName,
    referralMiddle:middle,
    referralLastName:lastName,
    referralPhone:first(val(o,'Referral Phone','referralPhone','Phone2','phone2')),
    referralEmail:first(val(o,'Referral Email','referralEmail')),
    phone,cell,email,
    address:first(val(o,'Address','address')),
    city:first(val(o,'City','city')),
    state:first(val(o,'State','state')),
    zip:first(val(o,'Zip','ZIP','zip')),
    dob:first(val(o,'DOB','Date of Birth','dob')),
    group:first(val(o,'Group','Lead Bank','group'),tabBaseName(tab)),
    notes:first(val(o,'Notes','Comment','comments','notes')),
    sponsor:first(val(o,'Sponsor','sponsor','Sponser','sponser')),
    referredBy:first(val(o,'Referred By','referredBy','Referral Source','referralSource')),
    organization:first(val(o,'Organization','organization')),
    relationship:first(val(o,'Relationship','Relation','relationship')),
    spouse:first(val(o,'Spouse','spouse')),
    occupation:first(val(o,'Occupation','occupation')),
    children:first(val(o,'Children','numChildren')),
    language:first(val(o,'Language','language'),'English'),
    allReferralDataJson:first(val(o,'All Referral Data JSON','allReferralDataJson','rawReferralData')),
    pageLink:first(val(o,'Page Link','link','pageLink')),
    imageLink:first(val(o,'Image Link','imageUrl','imageLink')),
    driveImage:first(val(o,'Drive Image','driveImage')),
    scrapedAt:first(val(o,'Scraped At','savedAt')),
    tab,rowIdx,source:'sheet',status:'New',lastActivity:'',lastActivityAt:''
  };
  l.key=[l.tab,l.rowIdx,l.leadId,l.phone,l.email,l.name].join('|');
  return l;
}
function parseSheetDate(text){const s=clean(text); if(!s)return nowIso(); const d=new Date(s); if(!isNaN(d))return d.toISOString(); const m=s.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/); if(m){const d2=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]); if(!isNaN(d2))return d2.toISOString();} return nowIso();}
function addSheetOutcomeEvent(lead,tab,rowIdx,cell,colIdx){const txt=clean(cell); if(!txt)return; const m=txt.match(/^(.+?)\s*@\s*(.+)$/); const status=m?clean(m[1]):txt; if(!status)return; const ev={eventId:'sheet:'+tab+':'+rowIdx+':'+colIdx+':'+hashKey(txt),timestamp:parseSheetDate(m?m[2]:''),agentName:state.config.agentName||'',leadId:lead.leadId,leadName:lead.name,phone:lead.phone,email:lead.email,city:lead.city,state:lead.state,zip:lead.zip,group:lead.group,tab,rowIdx,action:status,status,notes:'Loaded from Google Sheet',source:'google-sheet',syncedAt:nowIso(),syncError:''}; if(!state.events.some(e=>e.eventId===ev.eventId))state.events.push(ev); lead.status=status; lead.lastActivity=status; lead.lastActivityAt=ev.timestamp;}
function sheetRowsToLeads(tab,headers,rows){const leads=[];(rows||[]).forEach((row,i)=>{const rowIdx=i+2; const obj=rowToObject(headers,row,tab,rowIdx); const lead=normalizeLead(obj); if(!(lead.name||lead.phone||lead.email||lead.address||lead.leadId))return; for(let c=(headers||[]).length;c<row.length;c++)addSheetOutcomeEvent(lead,tab,rowIdx,row[c],c+1); leads.push(lead);}); return leads;}
function mergeLocalEventsIntoLeads(){const latest={}; for(const ev of state.events||[]){const k=[ev.tab||'',ev.rowIdx||'',ev.leadId||''].join('|'); if(!k.replace(/\|/g,''))continue; if(!latest[k]||String(ev.timestamp)>String(latest[k].timestamp))latest[k]=ev;} (state.leads||[]).forEach(l=>{const ev=latest[[l.tab||'',l.rowIdx||'',l.leadId||''].join('|')]; if(ev){l.status=ev.status||ev.action||l.status;l.lastActivity=l.status;l.lastActivityAt=ev.timestamp;}});}
function jsonp(action,params){return new Promise((resolve,reject)=>{if(!sheetReady())return reject(new Error('Missing Apps Script /exec deployment link.')); const cb='__impact_jsonp_'+Date.now()+'_'+Math.random().toString(36).slice(2); const u=new URL(state.config.sheetUrl); u.searchParams.set('action',action); u.searchParams.set('callback',cb); Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,String(v==null?'':v))); const s=document.createElement('script'); let done=false; const timer=setTimeout(()=>fail(new Error('Timed out reading Apps Script. Install the JSONP v5.8 backend in this bundle, deploy it, then paste the new /exec URL.')),20000); function cleanup(){clearTimeout(timer); delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s);} function fail(err){if(done)return; done=true; cleanup(); reject(err);} window[cb]=(data)=>{if(done)return; done=true; cleanup(); if(!data||data.ok===false)reject(new Error(data&&data.error?data.error:'Backend error')); else resolve(data);}; s.onerror=()=>fail(new Error('Could not load Apps Script. Check /exec URL and deployment access.')); s.src=u.toString(); document.head.appendChild(s);});}
async function postNoCors(payload){if(!sheetReady())throw new Error('No deployment link'); await fetch(state.config.sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); return {ok:true,opaque:true};}
async function loadAllFromBackend(){
  if(!sheetReady()){flash('Paste your Apps Script /exec link first.','err'); state.view='setup'; render(); return;}
  state.loading=true; state.sheetError=''; saveAll(); render(); flash('Loading tabs from Sheets...');
  try{
    const listed=await jsonp('listTabs',{});
    const tabs=(listed.tabs||[]).map(t=>typeof t==='string'?{name:t,count:0}:t).filter(t=>t&&validSheetTab(t.name));
    const all=[];
    for(const t of tabs){
      try{const res=await jsonp('loadTab',{tab:t.name}); const headers=(res.headers||[]).map(clean); const rows=res.rows||[]; sheetRowsToLeads(t.name,headers,rows).forEach(l=>all.push(l));}
      catch(e){console.warn('Tab failed',t.name,e);}
    }
    state.tabs=tabs; state.leads=all; state.loadedAt=nowIso(); state.sheetError=''; mergeLocalEventsIntoLeads(); state.view='home';
    flash('Loaded '+all.length+' leads across '+tabs.length+' tabs.','ok');
  }catch(err){state.sheetError=String(err&&err.message?err.message:err); flash(state.sheetError,'err');}
  finally{state.loading=false; saveAll(); render();}
}
function filteredLeads(){let a=(state.leads||[]).slice(); if(state.activeTab&&state.activeTab!=='All')a=a.filter(l=>l.tab===state.activeTab); if(state.activity&&state.activity!=='All')a=a.filter(l=>(l.status||'New')===state.activity); const q=clean(state.search).toLowerCase(); if(q)a=a.filter(l=>[l.name,l.phone,l.cell,l.email,l.address,l.city,l.state,l.zip,l.group,l.notes,l.sponsor,l.referredBy,l.referralFirstName,l.referralLastName,l.referralPhone,l.referralEmail].join(' ').toLowerCase().includes(q)); if(state.sort==='Name A-Z')a.sort((x,y)=>clean(x.name).localeCompare(clean(y.name))); else if(state.sort==='Status')a.sort((x,y)=>clean(x.status).localeCompare(clean(y.status))); else if(state.sort==='Oldest Sheet First')a.sort((x,y)=>(Number(x.rowIdx)||0)-(Number(y.rowIdx)||0)); else a.sort((x,y)=>String(y.tab).localeCompare(String(x.tab))||((Number(y.rowIdx)||0)-(Number(x.rowIdx)||0))); return a;}
function statusHTML(){const bits=[]; if(state.loading)bits.push('<b>Loading from Sheets...</b>'); else if(state.loadedAt)bits.push('Last sheet load: <b>'+h(dateHuman(state.loadedAt))+'</b>'); if(sheetTabs().length)bits.push('Tabs: <b>'+sheetTabs().length+'</b>'); if(state.sheetError)bits.push('<span style="color:#a00000">'+h(state.sheetError)+'</span>'); return bits.length?'<div class="status '+(state.sheetError?'err':'ok')+'">'+bits.join(' &nbsp; | &nbsp; ')+'</div>':'';}

function calendlyDOB(v){const s=clean(v); if(!s)return ''; const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[2]+'/'+m[3]+'/'+m[1]; const d=new Date(s); if(!isNaN(d)){const mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return mm+'/'+dd+'/'+d.getFullYear();} return s;}
function calendlyUrl(lead){
  const base=clean(state.config.calendlyUrl)||CALENDLY_DEFAULT;
  const params=new URLSearchParams();
  const email=first(lead.email,lead.referralEmail);
  const phone=calendlyPhone(first(lead.phone,lead.cell,lead.referralPhone));
  const stateAnswer=clean(lead.state);
  const dobAnswer=calendlyDOB(lead.dob);

  // Calendly form shown in this setup:
  // name/email = built-in Calendly fields
  // a1 = State/Estado
  // a2 = Age or DOB/Edad o fecha de nacimiento
  // a3 = Number
  // The SMS reminder field is intentionally left alone because Calendly will not reliably prefill it.
  if(lead.name)params.set('name',lead.name);
  if(email)params.set('email',email);
  if(stateAnswer)params.set('a1',stateAnswer);
  if(dobAnswer)params.set('a2',dobAnswer);
  if(phone)params.set('a3',phone);
  return base+(base.includes('?')?'&':'?')+params.toString();
}

function rowsToCSV(rows){return rows.map(r=>r.map(csvEscape).join(',')).join('\n');}
function eventsCSV(){const headers=['Timestamp','Agent Name','Lead ID','Lead Name','Phone','Email','City','State','Group','Tab','Row','Status','Notes','Synced','Sync Error']; const rows=[headers]; (state.events||[]).forEach(e=>rows.push([e.timestamp,e.agentName,e.leadId,e.leadName,e.phone,e.email,e.city,e.state,e.group,e.tab,e.rowIdx,e.status||e.action,e.notes,e.syncedAt,e.syncError])); return rowsToCSV(rows);}
function leadsCSV(){const headers=['Lead ID','Name','Phone','Email','Address','City','State','Zip','DOB','Group','Tab','Sponsor','Referred By','Referral First','Referral Last','Referral Phone','Referral Email','Language','Status','Notes','Row','Page Link','Image Link']; const rows=[headers]; (state.leads||[]).forEach(l=>rows.push([l.leadId,l.name,l.phone,l.email,l.address,l.city,l.state,l.zip,l.dob,l.group,l.tab,l.sponsor,l.referredBy,l.referralFirstName,l.referralLastName,l.referralPhone,l.referralEmail,l.language,l.status,l.notes,l.rowIdx,l.pageLink,l.imageLink||l.driveImage])); return rowsToCSV(rows);}
function downloadCSV(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
if(!state.config||!state.config.agentName)state.view='setup'; else if(state.view==='setup'&&!state.config.sheetUrl)state.view='setup'; else if(state.view==='setup')state.view='home'; render();
})();
