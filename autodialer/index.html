<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEX Dialer</title>
<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.10.0/dist/twilio.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
:root {
  --bg: #0d0f12; --sf: #141720; --s2: #1c2030; --s3: #232840;
  --b: #2a3050; --b2: #3a4570;
  --tx: #e8eaf0; --t2: #8892b0; --t3: #4a5580;
  --green: #00e676; --gdim: #00a651;
  --red: #ff4d6d; --amber: #ffab00; --blue: #4fc3f7; --purple: #b39ddb;
  --fn: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--tx); font-family: var(--fn); font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

.card { background: var(--sf); border: 1px solid var(--b); border-radius: 14px; width: 100%; max-width: 480px; overflow: hidden; }

/* STATUS STRIP */
.strip { padding: 10px 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--b); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--t3); flex-shrink: 0; }
.dot.live  { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
.dot.ring  { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: pulse .7s infinite; }
.dot.talk  { background: var(--green); box-shadow: 0 0 6px var(--green); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.strip-txt { font-family: var(--mono); font-size: 11px; color: var(--t2); }
.strip-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

/* LEAD DISPLAY */
.lead-block { padding: 28px 24px 20px; text-align: center; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.lead-attempt { font-size: 10px; font-family: var(--mono); color: var(--t3); margin-bottom: 8px; letter-spacing: .1em; min-height: 14px; }
.lead-name { font-size: 28px; font-weight: 300; color: var(--tx); margin-bottom: 6px; }
.lead-phone { font-family: var(--mono); font-size: 16px; color: var(--blue); margin-bottom: 4px; }
.lead-loc { font-size: 12px; color: var(--t2); margin-bottom: 14px; }
.lead-from { font-size: 10px; font-family: var(--mono); color: var(--gdim); }

/* TIMER */
.timer { font-family: var(--mono); font-size: 42px; font-weight: 500; color: var(--green); padding: 10px 0; }
.timer.idle { color: var(--t3); font-size: 28px; }

/* STATUS MSG */
.status-msg { font-family: var(--mono); font-size: 12px; color: var(--t2); min-height: 18px; margin-bottom: 8px; }

/* BIG BUTTONS */
.btn-row { padding: 0 24px 24px; display: flex; gap: 10px; }
.big-btn { flex: 1; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; border: none; font-family: var(--fn); transition: all .15s; }
.big-btn:disabled { opacity: .3; cursor: not-allowed; }
.btn-start { background: var(--gdim); color: #000; }
.btn-start:hover:not(:disabled) { background: #00c853; }
.btn-stop  { background: none; border: 1px solid var(--red); color: var(--red); }
.btn-stop:hover:not(:disabled)  { background: rgba(255,77,109,.1); }
.btn-next  { background: var(--blue); color: #000; }
.btn-next:hover:not(:disabled)  { background: #81d4fa; }
.btn-hang  { background: var(--red); color: #fff; }
.btn-hang:hover:not(:disabled)  { background: #c62828; }

/* OUTCOME BUTTONS */
.outcomes { display: none; padding: 0 24px 20px; }
.outcomes.show { display: block; }
.out-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--t3); margin-bottom: 8px; }
.out-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.out-btn { padding: 11px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; font-family: var(--fn); transition: all .15s; text-align: left; }
.out-btn:hover { filter: brightness(1.2); }
.o-appt { background: #0a2a1a; border-color: var(--gdim); color: var(--green); }
.o-cb   { background: #2a2010; border-color: #664400; color: var(--amber); }
.o-na   { background: #151530; border-color: #3a3a70; color: var(--purple); }
.o-bad  { background: #200a10; border-color: #601020; color: var(--red); }

/* QUEUE BAR */
.queue-bar { border-top: 1px solid var(--b); padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
.q-label { font-size: 11px; color: var(--t3); font-family: var(--mono); }
.q-pill { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 4px; }
.q-done  { background: #0a2a1a; color: var(--green); }
.q-left  { background: var(--s3); color: var(--t2); }
.q-vm    { background: #1a0828; color: #c084fc; }

/* IMPORT */
.import-row { border-top: 1px solid var(--b); padding: 12px 24px; display: flex; gap: 8px; align-items: center; }
.sm-btn { padding: 6px 12px; border-radius: 5px; font-size: 11px; cursor: pointer; font-family: var(--fn); font-weight: 500; border: none; }
.sm-g { background: var(--gdim); color: #000; }
.sm-o { background: none; border: 1px solid var(--b); color: var(--t2); }
.sm-o:hover { border-color: var(--b2); color: var(--tx); }

/* SETTINGS */
.settings-row { border-top: 1px solid var(--b); padding: 10px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.s-lbl { font-size: 10px; color: var(--t3); font-family: var(--mono); }
.s-sel { background: var(--s3); border: 1px solid var(--b); color: var(--tx); padding: 4px 7px; border-radius: 4px; font-size: 11px; cursor: pointer; }
.mic-status { margin-left: auto; font-size: 10px; font-family: var(--mono); color: var(--t3); }

/* MODAL */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50; align-items: center; justify-content: center; }
.overlay.open { display: flex; }
.modal { background: var(--sf); border: 1px solid var(--b2); border-radius: 10px; width: 440px; max-width: 95vw; }
.mh { padding: 14px 18px; border-bottom: 1px solid var(--b); display: flex; justify-content: space-between; align-items: center; }
.mh h3 { font-size: 13px; font-weight: 500; }
.mc { padding: 18px; }
.mf { padding: 10px 18px; border-top: 1px solid var(--b); display: flex; justify-content: flex-end; gap: 8px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--t3); margin-bottom: 5px; }
.field input { width: 100%; background: var(--s2); border: 1px solid var(--b); color: var(--tx); padding: 7px 10px; border-radius: 5px; font-size: 12px; font-family: var(--fn); outline: none; }
.field input:focus { border-color: var(--b2); }
.hint { font-size: 10px; color: var(--t3); margin-top: 3px; }
</style>
</head>
<body>

<div class="card">

  <!-- STATUS -->
  <div class="strip">
    <span class="dot" id="dev-dot"></span>
    <span class="strip-txt" id="dev-lbl">Mic not connected</span>
    <div class="strip-right">
      <button class="sm-btn sm-o" onclick="initDevice()" id="mic-btn" style="font-size:10px;padding:4px 10px;">Connect Mic</button>
      <button class="sm-btn sm-o" onclick="openCfg()" style="font-size:10px;padding:4px 10px;">⚙</button>
    </div>
  </div>

  <!-- LEAD DISPLAY -->
  <div class="lead-block">
    <div class="lead-attempt" id="l-attempt"></div>
    <div class="lead-name"  id="l-name">Load leads to begin</div>
    <div class="lead-phone" id="l-phone"></div>
    <div class="lead-loc"   id="l-loc"></div>
    <div class="timer idle" id="l-timer">—</div>
    <div class="status-msg" id="l-status"></div>
    <div class="lead-from"  id="l-from"></div>
  </div>

  <!-- MAIN BUTTONS -->
  <div class="btn-row" id="main-btns">
    <button class="big-btn btn-start" id="btn-start" onclick="startDialer()">▶ Start Dialing</button>
  </div>

  <!-- OUTCOME BUTTONS (shown when someone picks up) -->
  <div class="outcomes" id="outcomes">
    <div class="out-label">How did it go?</div>
    <div class="out-grid">
      <button class="out-btn o-appt" onclick="logOutcome('Appointment set')">✓ Appointment Set</button>
      <button class="out-btn o-cb"   onclick="logOutcome('Callback')">↩ Call Back Later</button>
      <button class="out-btn o-na"   onclick="logOutcome('Not interested')">— Not Interested</button>
      <button class="out-btn o-bad"  onclick="logOutcome('Bad number')">✕ Bad Number</button>
    </div>
  </div>

  <!-- QUEUE BAR -->
  <div class="queue-bar">
    <span class="q-label">Queue</span>
    <span class="q-pill q-done" id="q-done">0 done</span>
    <span class="q-pill q-left" id="q-left">0 left</span>
    <span class="q-pill q-vm"   id="q-vm"  >0 VM</span>
  </div>

  <!-- IMPORT -->
  <div class="import-row">
    <label class="sm-btn sm-g" style="cursor:pointer;">
      ↑ Import CSV
      <input type="file" id="csv-in" accept=".csv" style="display:none" onchange="importCSV(this)">
    </label>
    <button class="sm-btn sm-o" onclick="loadSheets()">⊞ Sheets</button>
    <button class="sm-btn sm-o" onclick="clearLeads()" style="margin-left:auto;">Clear</button>
  </div>

  <!-- SETTINGS -->
  <div class="settings-row">
    <span class="s-lbl">Dials/lead</span>
    <select class="s-sel" id="max-att" onchange="MAX_ATT=+this.value;localStorage.setItem('maxAtt',this.value)">
      <option value="1">1×</option>
      <option value="2" selected>2×</option>
      <option value="3">3×</option>
    </select>
    <span class="s-lbl">Delay</span>
    <select class="s-sel" id="delay-sel">
      <option value="2">2s</option>
      <option value="3" selected>3s</option>
      <option value="5">5s</option>
    </select>
    <span class="mic-status" id="sync-lbl"></span>
  </div>

</div><!-- /card -->

<!-- CONFIG MODAL -->
<div class="overlay" id="cfg-modal">
  <div class="modal">
    <div class="mh"><h3>Settings</h3><button onclick="closeCfg()" style="background:none;border:none;color:var(--t2);cursor:pointer;font-size:18px;">✕</button></div>
    <div class="mc">
      <div class="field">
        <label>Cloudflare Worker URL</label>
        <input id="cfg-worker" placeholder="https://raspy-math-9a25.thomaslancheros06.workers.dev">
      </div>
      <div class="field">
        <label>Google Sheets ID (optional)</label>
        <input id="cfg-sheet" placeholder="Sheet ID from the URL">
        <div class="hint">Share the sheet publicly (File → Share → Anyone with link can view)</div>
      </div>
      <div class="field">
        <label>Apps Script URL (outcome log, optional)</label>
        <input id="cfg-apps" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
    </div>
    <div class="mf">
      <button class="sm-btn sm-o" onclick="closeCfg()">Cancel</button>
      <button class="sm-btn sm-g" onclick="saveCfg()">Save</button>
    </div>
  </div>
</div>

<script>
// ── NUMBERS ──────────────────────────────────────
const NUMBERS = [
  {n:'+15862215707',lbl:'(586) Mount Clemens',lat:42.5973,lng:-82.8779},
  {n:'+18108193812',lbl:'(810) Brighton',      lat:42.5295,lng:-83.7799},
  {n:'+12314442706',lbl:'(231) Cadillac',       lat:44.2519,lng:-85.4013},
  {n:'+13136266971',lbl:'(313) Detroit',        lat:42.3314,lng:-83.0458},
  {n:'+17349844400',lbl:'(734) Flat Rock',      lat:42.1000,lng:-83.2747},
  {n:'+15176189305',lbl:'(517) Howell',         lat:42.6075,lng:-83.9297},
];
const AC = {
  '231':{lat:44.76,lng:-85.62},'248':{lat:42.58,lng:-83.25},'269':{lat:42.29,lng:-85.59},
  '313':{lat:42.33,lng:-83.05},'517':{lat:42.73,lng:-84.56},'586':{lat:42.58,lng:-82.91},
  '616':{lat:42.96,lng:-85.67},'734':{lat:42.28,lng:-83.74},'810':{lat:43.01,lng:-83.69},
  '906':{lat:46.48,lng:-84.99},'419':{lat:41.66,lng:-83.56},'440':{lat:41.50,lng:-81.69},
  '219':{lat:41.68,lng:-86.25},'260':{lat:41.08,lng:-85.14},'default':{lat:43.33,lng:-84.54},
};
function closest(phone) {
  const ac = phone.replace(/\D/g,'').slice(-10).slice(0,3);
  const c  = AC[ac] || AC.default;
  let best = NUMBERS[0], bestD = Infinity;
  for (const n of NUMBERS) {
    const dLat=(n.lat-c.lat)*Math.PI/180, dLng=(n.lng-c.lng)*Math.PI/180;
    const a=Math.sin(dLat/2)**2+Math.cos(c.lat*Math.PI/180)*Math.cos(n.lat*Math.PI/180)*Math.sin(dLng/2)**2;
    const d=3958.8*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    if(d<bestD){bestD=d;best=n;}
  }
  return best;
}

// ── STATE ─────────────────────────────────────────
let leads=[], idx=0, attempt=0, vmCount=0, doneCount=0;
let running=false, conn=null, naTimer=null, timerInt=null, secs=0, callStart=null;
let MAX_ATT = parseInt(localStorage.getItem('maxAtt')||'2');
const cfg = {
  workerUrl: localStorage.getItem('workerUrl')||'https://raspy-math-9a25.thomaslancheros06.workers.dev',
  sheetId:   localStorage.getItem('sheetId')||'',
  appsUrl:   localStorage.getItem('appsUrl')||'',
};
let device = null;

// ── DEVICE ────────────────────────────────────────
async function initDevice() {
  if (!cfg.workerUrl) { openCfg(); return; }
  setDev('Connecting…','ring');
  document.getElementById('mic-btn').disabled = true;
  try {
    const r = await fetch(cfg.workerUrl+'/token');
    const d = await r.json();
    if (!d.token) throw new Error('No token');
    device = new Twilio.Device(d.token, {codecPreferences:['opus','pcmu'],enableRingingState:true});
    device.on('registered',   ()=>{ setDev('Ready ✓','live'); document.getElementById('mic-btn').textContent='Reconnect'; });
    device.on('unregistered', ()=>setDev('Disconnected',''));
    device.on('error',        e=>setDev('Error: '+e.message,'err'));
    await device.register();
    document.getElementById('mic-btn').disabled = false;
  } catch(e) {
    setDev('Failed — check Worker URL','err');
    document.getElementById('mic-btn').disabled = false;
  }
}
function setDev(msg, state) {
  const dot=document.getElementById('dev-dot'), lbl=document.getElementById('dev-lbl');
  lbl.textContent = msg;
  dot.className = 'dot' + (state==='live'?' live':state==='ring'?' ring':state==='err'?' err':'');
}

// ── IMPORT ────────────────────────────────────────
function importCSV(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(l=>l.trim());
    const headers = lines[0].split(',').map(h=>h.replace(/"/g,'').trim().toLowerCase());
    const pi = headers.findIndex(h=>/phone|cell|mobile/.test(h));
    const ni = headers.findIndex(h=>/^(name|first)/.test(h));
    const ci = headers.findIndex(h=>/^city/.test(h));
    const si = headers.findIndex(h=>/^(state|st)$/.test(h));
    if (pi<0) { toast('No phone column found','err'); return; }
    const imported = [];
    for (let i=1; i<lines.length; i++) {
      const cols = splitCSV(lines[i]);
      const phone = cleanPhone(cols[pi]||'');
      if (!phone) continue;
      imported.push({
        name:  (ni>=0 ? cols[ni] : 'Lead '+i).replace(/"/g,'').trim(),
        phone,
        loc:   [cols[ci]||'', cols[si]||''].map(s=>s.replace(/"/g,'').trim()).filter(Boolean).join(', '),
        done:  false, attempt: 0,
      });
    }
    leads = [...leads, ...imported];
    idx = 0; attempt = 0;
    updateDisplay();
    toast('Imported '+imported.length+' leads');
    input.value='';
  };
  reader.readAsText(file);
}
function splitCSV(row) {
  const r=[]; let c='',q=false;
  for (const ch of row) { if(ch==='"'){q=!q;}else if(ch===','&&!q){r.push(c);c='';}else{c+=ch;} }
  r.push(c); return r;
}
function cleanPhone(p) {
  const d=p.replace(/\D/g,'');
  if(d.length===10) return '+1'+d;
  if(d.length===11&&d[0]==='1') return '+'+d;
  return d.length>=10?'+1'+d.slice(-10):'';
}
async function loadSheets() {
  if (!cfg.sheetId) { openCfg(); return; }
  setStatus('Loading from Sheets…');
  try {
    const r = await fetch('https://docs.google.com/spreadsheets/d/'+cfg.sheetId+'/gviz/tq?tqx=out:json');
    const t = await r.text();
    const j = JSON.parse(t.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/)[1]);
    const cols = j.table.cols.map(c=>c.label.toLowerCase());
    const pi=cols.findIndex(h=>/phone|cell|mobile/.test(h));
    const ni=cols.findIndex(h=>/name|first/.test(h));
    const imported = j.table.rows.map((row,i)=>{
      const v=row.c.map(c=>c?String(c.v||''):'');
      const phone=cleanPhone(v[pi]||'');
      if(!phone)return null;
      return{name:ni>=0?(v[ni]||'Lead '+i):'Lead '+i,phone,loc:'',done:false,attempt:0};
    }).filter(Boolean);
    leads=[...leads,...imported]; idx=0; attempt=0;
    updateDisplay();
    toast('Loaded '+imported.length+' leads');
  } catch(e) { setStatus('Sheets error — check Sheet ID'); }
}
function clearLeads() {
  if (!confirm('Clear all leads?')) return;
  leads=[]; idx=0; attempt=0; vmCount=0; doneCount=0;
  running=false; showIdleUI();
  updateQueueBar(); updateDisplay();
}

// ── DIALER ENGINE ─────────────────────────────────
function startDialer() {
  if (!device)  { toast('Connect mic first','err'); return; }
  if (!leads.length) { toast('Import leads first','err'); return; }
  running = true;
  idx = leads.findIndex(l=>!l.done);
  if (idx<0) { toast('All leads done'); return; }
  attempt = 0;
  document.getElementById('main-btns').innerHTML =
    `<button class="big-btn btn-stop" onclick="stopDialer()">⬛ Stop</button>`;
  dial();
}

function stopDialer() {
  running = false;
  clearNAT();
  if (conn) { try{conn.disconnect();}catch(e){} conn=null; }
  stopTimer();
  showIdleUI();
  setStatus('Stopped');
}

async function dial() {
  if (!running) return;
  // find next undone lead
  while (idx < leads.length && leads[idx].done) idx++;
  if (idx >= leads.length) {
    // second pass?
    const retry = leads.findIndex(l=>!l.done);
    if (retry < 0) { toast('All leads dialed ✓'); stopDialer(); return; }
    idx = retry; attempt = 0;
  }

  const lead = leads[idx];
  attempt++;
  lead.attempt = attempt;

  const from = closest(lead.phone);
  document.getElementById('l-name').textContent    = lead.name;
  document.getElementById('l-phone').textContent   = fmt(lead.phone);
  document.getElementById('l-loc').textContent     = lead.loc||'';
  document.getElementById('l-from').textContent    = '▲ from '+from.lbl;
  document.getElementById('l-attempt').textContent = attempt > 1 ? 'Attempt '+attempt+' of '+MAX_ATT : '';
  document.getElementById('l-timer').textContent   = '…';
  document.getElementById('l-timer').className     = 'timer idle';
  setStatus('Dialing…');

  try {
    conn = await device.connect({ params:{ To:lead.phone, callerId:from.n, leadName:lead.name } });
    bindEvents(conn, lead, from.n);
  } catch(e) {
    conn=null; setStatus('Error — skipping');
    setTimeout(nextLead, 2000);
  }
}

function bindEvents(c, lead) {
  c.on('ringing', ()=>{
    setStatus('Ringing…');
    // hang up after 25s if no answer
    clearNAT();
    naTimer = setTimeout(()=>{
      setStatus('No answer — moving on');
      if(conn){try{conn.disconnect();}catch(e){}conn=null;}
      handleNoAnswer(lead);
    }, 25000);
  });

  c.on('accept', ()=>{
    clearNAT();
    callStart = Date.now();
    startTimer();
    setStatus('Connected ✓ — speak now');
    // show hang up + outcomes
    document.getElementById('main-btns').innerHTML =
      `<button class="big-btn btn-hang" onclick="manualHang()">⬛ Hang Up</button>`;
    document.getElementById('outcomes').classList.remove('show');
  });

  c.on('disconnect', ()=>{
    clearNAT();
    const dur = callStart ? Math.round((Date.now()-callStart)/1000) : 0;
    callStart = null;
    stopTimer();
    conn = null;

    if (dur >= 8) {
      // Real conversation — show outcome buttons
      setStatus('Call ended — how did it go?');
      document.getElementById('main-btns').innerHTML = '';
      document.getElementById('outcomes').classList.add('show');
    } else if (dur > 0 && dur < 5) {
      // Brief connect = VM auto-pickup
      setStatus('Voicemail detected — skipping');
      vmCount++;
      handleNoAnswer(lead);
    } else {
      // No answer / ringing timeout
      handleNoAnswer(lead);
    }
  });

  c.on('cancel', ()=>{ clearNAT(); conn=null; handleNoAnswer(lead); });
  c.on('reject', ()=>{ clearNAT(); conn=null; handleNoAnswer(lead); });
  c.on('error',  ()=>{ clearNAT(); conn=null; nextLead(); });
}

function handleNoAnswer(lead) {
  if (attempt >= MAX_ATT) {
    lead.done = true;
    doneCount++;
    updateQueueBar();
    idx++;
    attempt = 0;
    scheduleNext();
  } else {
    // retry same lead
    setStatus('Retrying in a moment…');
    scheduleNext(true);
  }
}

function scheduleNext(same=false) {
  if (!running) return;
  const delay = parseInt(document.getElementById('delay-sel').value)*1000;
  updateQueueBar();
  setTimeout(()=>{ if(!same)idx=leads.findIndex((l,i)=>!l.done&&i>=idx)||idx; dial(); }, delay);
}

function nextLead() { idx++; attempt=0; scheduleNext(); }

function manualHang() {
  if(conn){try{conn.disconnect();}catch(e){}conn=null;}
  stopTimer(); clearNAT();
  setStatus('Hung up — how did it go?');
  document.getElementById('main-btns').innerHTML = '';
  document.getElementById('outcomes').classList.add('show');
}

// ── OUTCOMES ─────────────────────────────────────
function logOutcome(outcome) {
  document.getElementById('outcomes').classList.remove('show');
  const lead = leads[idx];
  if (lead) { lead.done=true; lead.outcome=outcome; }
  doneCount++;
  updateQueueBar();
  if (cfg.appsUrl && lead) pushSheets(lead, outcome);
  idx++; attempt=0;
  if (running) {
    document.getElementById('main-btns').innerHTML =
      `<button class="big-btn btn-stop" onclick="stopDialer()">⬛ Stop</button>`;
    scheduleNext();
  } else {
    showIdleUI();
  }
}

async function pushSheets(lead, outcome) {
  try {
    await fetch(cfg.appsUrl,{method:'POST',body:JSON.stringify({
      name:lead.name,phone:lead.phone,outcome,time:new Date().toISOString()
    })});
  } catch(e) {}
}

// ── UI HELPERS ────────────────────────────────────
function showIdleUI() {
  document.getElementById('main-btns').innerHTML =
    `<button class="big-btn btn-start" onclick="startDialer()">▶ Start Dialing</button>`;
  document.getElementById('outcomes').classList.remove('show');
}

function updateDisplay() {
  if (!leads.length) {
    document.getElementById('l-name').textContent  = 'Load leads to begin';
    document.getElementById('l-phone').textContent = '';
    document.getElementById('l-loc').textContent   = '';
    document.getElementById('l-from').textContent  = '';
  }
  updateQueueBar();
}

function updateQueueBar() {
  const left = leads.filter(l=>!l.done).length;
  document.getElementById('q-done').textContent = doneCount+' done';
  document.getElementById('q-left').textContent = left+' left';
  document.getElementById('q-vm').textContent   = vmCount+' VM';
}

function setStatus(msg) { document.getElementById('l-status').textContent = msg; }

function fmt(p) {
  const d=p.replace(/\D/g,'');
  if(d.length===11) return`(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
  if(d.length===10) return`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  return p;
}

// ── TIMER ─────────────────────────────────────────
function startTimer() {
  secs=0;
  document.getElementById('l-timer').className='timer';
  timerInt=setInterval(()=>{
    secs++;
    const m=Math.floor(secs/60), s=secs%60;
    document.getElementById('l-timer').textContent=m+':'+(s+'').padStart(2,'0');
  },1000);
}
function stopTimer() {
  clearInterval(timerInt); timerInt=null;
  document.getElementById('l-timer').className='timer idle';
  document.getElementById('l-timer').textContent='—';
}
function clearNAT() { if(naTimer){clearTimeout(naTimer);naTimer=null;} }

// ── CONFIG ────────────────────────────────────────
function openCfg() {
  document.getElementById('cfg-worker').value=cfg.workerUrl;
  document.getElementById('cfg-sheet').value=cfg.sheetId;
  document.getElementById('cfg-apps').value=cfg.appsUrl;
  document.getElementById('cfg-modal').classList.add('open');
}
function closeCfg() { document.getElementById('cfg-modal').classList.remove('open'); }
function saveCfg() {
  cfg.workerUrl = document.getElementById('cfg-worker').value.trim();
  cfg.sheetId   = document.getElementById('cfg-sheet').value.trim();
  cfg.appsUrl   = document.getElementById('cfg-apps').value.trim();
  localStorage.setItem('workerUrl',cfg.workerUrl);
  localStorage.setItem('sheetId',cfg.sheetId);
  localStorage.setItem('appsUrl',cfg.appsUrl);
  document.getElementById('sync-lbl').textContent = cfg.workerUrl ? '● Worker set' : '';
  document.getElementById('sync-lbl').style.color = 'var(--green)';
  closeCfg(); toast('Saved');
}

// ── INIT ──────────────────────────────────────────
document.getElementById('max-att').value = localStorage.getItem('maxAtt')||'2';
MAX_ATT = parseInt(document.getElementById('max-att').value);
if (cfg.workerUrl) {
  document.getElementById('sync-lbl').textContent='● Worker set';
  document.getElementById('sync-lbl').style.color='var(--green)';
}
if (!cfg.workerUrl) setTimeout(openCfg, 400);

// drag+drop
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();
  const f=e.dataTransfer.files[0];
  if(f&&f.name.endsWith('.csv'))importCSV({files:[f],value:''});
});

// ── TOAST ─────────────────────────────────────────
function toast(msg,type='ok'){
  const t=document.createElement('div');
  t.style.cssText=`position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:${type==='err'?'#3a1020':'#0a2a0a'};
    border:1px solid ${type==='err'?'var(--red)':'var(--gdim)'};
    color:${type==='err'?'var(--red)':'var(--green)'};
    padding:8px 18px;border-radius:6px;font-size:12px;font-family:var(--mono);
    z-index:999;white-space:nowrap;pointer-events:none;`;
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}
</script>
</body>
