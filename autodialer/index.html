<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSV Auto Dialer</title>
<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.10.0/dist/twilio.min.js"></script>
<style>
:root{--bg:#0d0f12;--sf:#141720;--s2:#1c2030;--s3:#232840;--b:#2a3050;--b2:#3a4570;--tx:#e8eaf0;--t2:#8892b0;--t3:#4a5580;--green:#00e676;--gdim:#00a651;--red:#ff4d6d;--amber:#ffab00;--blue:#4fc3f7;--purple:#b39ddb;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Inter',sans-serif}
body{background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh;padding:18px;display:grid;grid-template-columns:1fr 260px 340px;gap:16px}
h1{font-size:13px;letter-spacing:.12em;color:var(--green);font-weight:500;margin-bottom:14px;font-family:'SF Mono',monospace}
.panel{background:var(--sf);border:1px solid var(--b);border-radius:10px;padding:18px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
label{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;font-family:'SF Mono',monospace}
input,select{background:var(--s3);border:1px solid var(--b);color:var(--tx);padding:7px 10px;border-radius:5px;font-size:12px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--b2)}
input[type=number]{width:70px}
button{padding:8px 14px;border-radius:6px;border:1px solid var(--b);background:var(--s3);color:var(--tx);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
button:hover:not(:disabled){border-color:var(--b2)}
button:disabled{opacity:.35;cursor:not-allowed}
.btn-go{background:var(--gdim);color:#000;border-color:var(--gdim)}
.btn-go:hover:not(:disabled){background:#00c853}
.btn-stop{background:none;border-color:var(--red);color:var(--red)}
.btn-stop:hover:not(:disabled){background:rgba(255,77,109,.1)}
.btn-skip{background:none;border-color:var(--amber);color:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:14px;font-family:'SF Mono',monospace;font-size:10px;letter-spacing:.06em;background:var(--s3);color:var(--t2)}
.pill.live{background:#0a2a1a;color:var(--green)}
.pill.ring{background:#2a2010;color:var(--amber)}
.pill.vm{background:#1a0828;color:#c084fc}
.pill.err{background:#200a10;color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.live .dot,.ring .dot{box-shadow:0 0 6px currentColor;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.bigname{font-size:32px;font-weight:300;margin:18px 0 4px;min-height:40px}
.bigphone{font-family:'SF Mono',monospace;font-size:18px;color:var(--blue);margin-bottom:14px}
.timer{font-family:'SF Mono',monospace;font-size:42px;color:var(--green);margin:10px 0}
.timer.idle{color:var(--t3)}
.info{background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:14px;margin:14px 0;max-height:240px;overflow:auto}
.info-row{display:flex;padding:5px 0;border-bottom:1px solid var(--b);font-size:12px}
.info-row:last-child{border-bottom:none}
.info-k{color:var(--t2);min-width:130px;font-family:'SF Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.info-v{color:var(--tx);flex:1;word-break:break-word}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1;padding:13px}
.q{margin-top:14px;max-height:280px;overflow:auto}
.q-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--b);font-size:12px}
.q-item.cur{background:#0a2a1a}
.q-item.done{opacity:.4}
.q-num{font-family:'SF Mono',monospace;color:var(--t3);font-size:10px;width:24px}
.q-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-st{font-family:'SF Mono',monospace;font-size:10px;padding:2px 7px;border-radius:8px;background:var(--s3);color:var(--t2)}
.q-st.done{background:#0a2a1a;color:var(--green)}
.q-st.vm{background:#1a0828;color:#c084fc}
.q-st.fail{background:#200a10;color:var(--red)}
.log{background:#000;border:1px solid var(--b);border-radius:6px;padding:10px;height:140px;overflow:auto;font-family:'SF Mono',monospace;font-size:10px;color:var(--t2);margin-top:12px}
.log div{padding:1px 0}
.log .ok{color:var(--green)}.log .warn{color:var(--amber)}.log .err{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--s2);border:1px solid var(--b);border-radius:6px;padding:10px;text-align:center}
.stat-v{font-family:'SF Mono',monospace;font-size:20px;color:var(--tx)}
.stat-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.kp-display{background:#000;border:1px solid var(--b);border-radius:8px;padding:14px;font-family:'SF Mono',monospace;font-size:22px;color:var(--blue);text-align:center;margin-bottom:10px;min-height:52px;letter-spacing:.04em;word-break:break-all}
.kp-display.empty{color:var(--t3);font-size:13px}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kp-key{background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:14px 0;font-family:'SF Mono',monospace;font-size:20px;color:var(--tx);cursor:pointer;transition:all .1s;user-select:none;font-weight:500}
.kp-key:hover{background:var(--s3);border-color:var(--b2)}
.kp-key:active{background:var(--gdim);color:#000;transform:scale(.96)}
.kp-key small{display:block;font-size:8px;color:var(--t3);margin-top:2px;letter-spacing:.1em}
.kp-actions{display:flex;gap:8px}
.kp-actions button{flex:1;padding:12px}
.kp-call{background:var(--gdim);color:#000;border-color:var(--gdim);font-weight:600}
.kp-call:hover:not(:disabled){background:#00c853}
.kp-end{background:var(--red);color:#fff;border-color:var(--red)}
.kp-bs{background:var(--s2)}
@media(max-width:1180px){body{grid-template-columns:1fr 300px}}
@media(max-width:880px){body{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="panel">
  <h1>◆ CSV AUTO DIALER</h1>

  <div class="row">
    <label>Worker URL</label>
    <input id="worker" style="flex:1;min-width:240px" placeholder="https://your-worker.workers.dev">
    <button id="mic">Connect Mic</button>
    <span class="pill" id="devpill"><span class="dot"></span>OFFLINE</span>
  </div>

  <div class="row">
    <label>CSV</label>
    <input type="file" id="csv" accept=".csv">
    <label>Max Attempts</label>
    <input type="number" id="maxAtt" value="3" min="1" max="10">
    <label>Gap (s)</label>
    <input type="number" id="gap" value="3" min="0" max="60">
    <label><input type="checkbox" id="amd" checked style="width:auto"> Skip Voicemail</label>
  </div>

  <div class="row" style="margin-bottom:0">
    <button id="start" class="btn-go" disabled>▶ START</button>
    <button id="stop" class="btn-stop" disabled>■ STOP</button>
    <button id="skip" class="btn-skip" disabled>⏭ SKIP</button>
    <span class="pill" id="state" style="margin-left:auto"><span class="dot"></span>IDLE</span>
  </div>

  <div class="bigname" id="name">—</div>
  <div class="bigphone" id="phone">—</div>
  <div class="timer idle" id="timer">00:00</div>
  <div style="font-family:'SF Mono',monospace;font-size:11px;color:var(--t3)" id="att"></div>

  <div class="info" id="info"><div style="color:var(--t3);text-align:center;padding:20px">Load a CSV to begin</div></div>

  <div class="stats">
    <div class="stat"><div class="stat-v" id="s-total">0</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-v" id="s-conn">0</div><div class="stat-l">Connected</div></div>
    <div class="stat"><div class="stat-v" id="s-vm">0</div><div class="stat-l">Voicemail</div></div>
    <div class="stat"><div class="stat-v" id="s-fail">0</div><div class="stat-l">No Answer</div></div>
  </div>

  <div class="log" id="log"></div>
</div>

<div class="panel">
  <h1>◆ KEYPAD</h1>
  <div style="margin-bottom:10px">
    <label style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;font-family:'SF Mono',monospace;display:block;margin-bottom:4px">Dial From</label>
    <select id="kp-from" style="width:100%;background:var(--s3);border:1px solid var(--b);color:var(--tx);padding:7px 10px;border-radius:5px;font-size:11px;font-family:'SF Mono',monospace;cursor:pointer">
      <option value="auto">Auto (closest match)</option>
    </select>
  </div>
  <div class="kp-display empty" id="kp-disp">Type or click to dial</div>
  <div class="kp-grid">
    <button class="kp-key" data-k="1">1<small>&nbsp;</small></button>
    <button class="kp-key" data-k="2">2<small>ABC</small></button>
    <button class="kp-key" data-k="3">3<small>DEF</small></button>
    <button class="kp-key" data-k="4">4<small>GHI</small></button>
    <button class="kp-key" data-k="5">5<small>JKL</small></button>
    <button class="kp-key" data-k="6">6<small>MNO</small></button>
    <button class="kp-key" data-k="7">7<small>PQRS</small></button>
    <button class="kp-key" data-k="8">8<small>TUV</small></button>
    <button class="kp-key" data-k="9">9<small>WXYZ</small></button>
    <button class="kp-key" data-k="*">*<small>&nbsp;</small></button>
    <button class="kp-key" data-k="0">0<small>+</small></button>
    <button class="kp-key" data-k="#">#<small>&nbsp;</small></button>
  </div>
  <div class="kp-actions">
    <button class="kp-bs" id="kp-bs">⌫</button>
    <button class="kp-call" id="kp-call">📞 CALL</button>
    <button class="kp-end" id="kp-end" style="display:none">END</button>
  </div>
</div>

<div class="panel">
  <h1>◆ QUEUE</h1>
  <div class="q" id="queue"><div style="color:var(--t3);text-align:center;padding:20px;font-size:12px">No leads loaded</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const LS = (k,d) => localStorage.getItem(k) ?? d;
const SS = (k,v) => localStorage.setItem(k,v);

let device=null, conn=null, leads=[], idx=0, attempt=0, running=false, dialing=false, callTimer=null, callStart=0, gapTimer=null, headers=[], stats={conn:0,vm:0,fail:0};

// Twilio caller IDs — frontend picks the geographically closest one per lead
const NUMBERS = [
  {n:'+15862215707',lbl:'(586) Mount Clemens',lat:42.5973,lng:-82.8779},
  {n:'+12693869670',lbl:'(269) Colon',        lat:41.9559,lng:-85.3253},
  {n:'+18108193812',lbl:'(810) Brighton',     lat:42.5295,lng:-83.7799},
  {n:'+19893490235',lbl:'(989) Birch Run',    lat:43.2503,lng:-83.7894},
  {n:'+16163194434',lbl:'(616) Lowell',       lat:42.9337,lng:-85.3420},
  {n:'+12314442706',lbl:'(231) Cadillac',     lat:44.2519,lng:-85.4013},
  {n:'+12484532765',lbl:'(248) Rochester',    lat:42.6806,lng:-83.1340},
  {n:'+13136266971',lbl:'(313) Detroit',      lat:42.3314,lng:-83.0458},
  {n:'+17349844400',lbl:'(734) Flat Rock',    lat:42.1000,lng:-83.2747},
  {n:'+15176189305',lbl:'(517) Howell',       lat:42.6075,lng:-83.9297},
];
const AC_COORDS = {
  '231':{lat:44.76,lng:-85.62},'248':{lat:42.58,lng:-83.25},'269':{lat:42.29,lng:-85.59},
  '313':{lat:42.33,lng:-83.05},'517':{lat:42.73,lng:-84.56},'586':{lat:42.58,lng:-82.91},
  '616':{lat:42.96,lng:-85.67},'734':{lat:42.28,lng:-83.74},'810':{lat:43.01,lng:-83.69},
  '906':{lat:46.48,lng:-84.99},'947':{lat:42.58,lng:-83.25},'989':{lat:43.42,lng:-83.95},
  '419':{lat:41.66,lng:-83.56},'440':{lat:41.50,lng:-81.69},
  'default':{lat:43.33,lng:-84.54},
};
function closestNum(phone){
  const ac = phone.replace(/\D/g,'').slice(-10).slice(0,3);
  const c = AC_COORDS[ac] || AC_COORDS.default;
  let best = NUMBERS[0], bestD = Infinity;
  for(const n of NUMBERS){
    const dLat=(n.lat-c.lat)*Math.PI/180, dLng=(n.lng-c.lng)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(c.lat*Math.PI/180)*Math.cos(n.lat*Math.PI/180)*Math.sin(dLng/2)**2;
    const d = 3958.8*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    if(d<bestD){bestD=d;best=n;}
  }
  return best;
}

$('worker').value = LS('dialer_worker','');
$('worker').addEventListener('change', e => SS('dialer_worker', e.target.value));

function log(m,t=''){const d=document.createElement('div');d.className=t;d.textContent='['+new Date().toLocaleTimeString()+'] '+m;$('log').appendChild(d);$('log').scrollTop=1e9}

function setState(txt,cls=''){const p=$('state');p.className='pill '+cls;p.innerHTML='<span class="dot"></span>'+txt}
function setDev(txt,cls=''){const p=$('devpill');p.className='pill '+cls;p.innerHTML='<span class="dot"></span>'+txt}

// ── MIC / DEVICE ──
$('mic').onclick = async () => {
  const url = $('worker').value.trim();
  if(!url){alert('Enter Worker URL first');return}
  $('mic').disabled=true;
  try{
    const r = await fetch(url+'/token');
    const d = await r.json();
    if(!d.token) throw new Error(d.error||'No token');
    device = new Twilio.Device(d.token,{codecPreferences:['opus','pcmu'],logLevel:1});
    device.on('registered',()=>{setDev('READY','live');log('Device ready','ok');$('mic').textContent='Reconnect';$('mic').disabled=false;$('start').disabled = !leads.length});
    device.on('error',e=>{setDev('ERROR','err');log('Device: '+e.message,'err')});
    device.on('tokenWillExpire',async()=>{const r=await fetch(url+'/token');const d=await r.json();if(d.token)device.updateToken(d.token);log('Token refreshed')});
    await device.register();
  }catch(e){log('Mic init failed: '+e.message,'err');setDev('ERROR','err');$('mic').disabled=false}
};

// ── CSV ──
$('csv').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ev => parseCSV(ev.target.result);
  rd.readAsText(f);
};

function parseCSV(text){
  const rows = [];
  let cur=[],field='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"' && text[i+1]==='"'){field+='"';i++}
      else if(c==='"'){q=false}
      else field+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){cur.push(field);field=''}
      else if(c==='\n'||c==='\r'){if(field||cur.length){cur.push(field);rows.push(cur);cur=[];field=''}if(c==='\r'&&text[i+1]==='\n')i++}
      else field+=c;
    }
  }
  if(field||cur.length){cur.push(field);rows.push(cur)}
  if(!rows.length){alert('Empty CSV');return}
  headers = rows[0].map(h=>h.trim());
  leads = rows.slice(1).filter(r=>r[0]&&r[1]).map(r=>({
    name:(r[0]||'').trim(),
    phone:normalizePhone(r[1]||''),
    extra:headers.slice(2).map((h,i)=>({k:h,v:(r[i+2]||'').trim()})).filter(x=>x.v),
    status:'pending', attempts:0
  }));
  idx=0;attempt=0;stats={conn:0,vm:0,fail:0};updateStats();
  log('Loaded '+leads.length+' leads','ok');
  renderQueue();
  if(leads.length) showLead(0);
  $('start').disabled = !device || !leads.length;
}

function normalizePhone(p){
  let d = p.replace(/[^\d+]/g,'');
  if(!d) return '';
  if(d.startsWith('+')) return d;
  if(d.length===10) return '+1'+d;
  if(d.length===11 && d[0]==='1') return '+'+d;
  return '+'+d;
}

function showLead(i){
  if(i>=leads.length){$('name').textContent='—';$('phone').textContent='—';$('info').innerHTML='<div style="color:var(--t3);text-align:center;padding:20px">Done</div>';return}
  const l = leads[i];
  const from = closestNum(l.phone);
  $('name').textContent = l.name;
  $('phone').textContent = l.phone;
  $('att').textContent = 'Lead '+(i+1)+'/'+leads.length+' • Attempt '+(attempt+1)+'/'+ $('maxAtt').value+' • from '+from.lbl;
  $('info').innerHTML = l.extra.length
    ? l.extra.map(x=>`<div class="info-row"><div class="info-k">${esc(x.k)}</div><div class="info-v">${esc(x.v)}</div></div>`).join('')
    : '<div style="color:var(--t3);text-align:center;padding:20px">No extra info</div>';
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function renderQueue(){
  $('queue').innerHTML = leads.map((l,i)=>`<div class="q-item ${i===idx?'cur':''} ${l.status!=='pending'?'done':''}"><div class="q-num">${i+1}</div><div class="q-name">${esc(l.name)}</div><div class="q-st ${l.status}">${l.status.toUpperCase()}</div></div>`).join('');
}

// ── DIALING ──
$('start').onclick = ()=>{ if(!device){alert('Connect mic first');return} running=true;$('start').disabled=true;$('stop').disabled=false;$('skip').disabled=false;log('Auto-dial started','ok');dialNext()};
$('stop').onclick = ()=>{ running=false;dialing=false;$('stop').disabled=true;$('start').disabled=false;$('skip').disabled=true;clearTimeout(gapTimer);if(conn)try{conn.disconnect()}catch{}setState('STOPPED');log('Stopped','warn')};
$('skip').onclick = ()=>{ log('Skip pressed','warn');if(conn)try{conn.disconnect()}catch{};attempt = +$('maxAtt').value; afterCall('skipped')};

async function dialNext(){
  if(!running) return;
  if(dialing){log('dialNext blocked — already dialing','warn');return}
  if(idx>=leads.length){log('All leads complete','ok');$('stop').click();return}
  const lead = leads[idx];
  if(attempt >= +$('maxAtt').value){
    if(lead.status==='pending') lead.status='fail',stats.fail++;
    updateStats();renderQueue();
    idx++;attempt=0;
    showLead(idx);
    return setTimeout(dialNext, 300);
  }
  dialing = true;
  showLead(idx);
  const from = closestNum(lead.phone);
  setState('DIALING','ring');
  log('Dialing '+lead.name+' '+lead.phone+' from '+from.lbl+' (attempt '+(attempt+1)+')');
  try{
    const params = { To: lead.phone, callerId: from.n, leadName: lead.name };
    if($('amd').checked) params.MachineDetection = 'Enable';
    conn = await device.connect({ params });
    bindCall(lead);
  }catch(e){
    log('connect() failed: '+e.message,'err');
    dialing = false;
    attempt++;
    setTimeout(dialNext, 1500);
  }
}

function bindCall(lead){
  callStart = Date.now();
  let finalized = false;
  const finalize = (reason)=>{
    if(finalized) return;
    finalized = true;
    clearInterval(callTimer);
    afterCall(reason);
  };
  callTimer = setInterval(()=>{
    const s = Math.floor((Date.now()-callStart)/1000);
    $('timer').className='timer';
    $('timer').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  },250);

  conn.on('ringing',()=>{setState('RINGING','ring');log('Ringing…')});
  conn.on('accept',()=>{setState('CONNECTED','live');log('Accepted','ok')});

  conn.on('messageReceived',msg=>{
    const ab = msg?.content?.AnsweredBy || msg?.content?.answeredBy;
    if(ab) handleAMD(ab);
  });

  conn.on('disconnect',()=>{
    const dur = Math.floor((Date.now()-callStart)/1000);
    log('Disconnected after '+dur+'s');
    if(lead.status==='pending' && dur>=8){
      lead.status='done';stats.conn++;
      return finalize('connected');
    }
    finalize(lead.status==='pending'?'noanswer':lead.status);
  });
  conn.on('error',e=>{log('Call error: '+e.message,'err');finalize('error')});
  conn.on('cancel',()=>finalize('cancel'));
  conn.on('reject',()=>finalize('reject'));
}

function handleAMD(answeredBy){
  log('AMD: '+answeredBy, answeredBy.startsWith('machine')?'warn':'ok');
  const lead = leads[idx];
  if(answeredBy.startsWith('machine') || answeredBy==='fax'){
    setState('VOICEMAIL','vm');
    lead.status='vm';
    stats.vm++;
    try{conn.disconnect()}catch{}
    // disconnect handler will call afterCall
  }
}

function afterCall(reason){
  conn = null;
  dialing = false;
  $('timer').textContent='00:00';$('timer').className='timer idle';
  renderQueue();updateStats();
  if(!running) return;
  const lead = leads[idx];
  if(lead.status==='done'){
    idx++;attempt=0;
    setTimeout(dialNext, +$('gap').value*1000);
  }else{
    // VM, no-answer, error → retry or move on
    attempt++;
    if(attempt >= +$('maxAtt').value){
      if(lead.status==='pending') lead.status='fail',stats.fail++;
      idx++;attempt=0;
    }
    setTimeout(dialNext, +$('gap').value*1000);
  }
}

function updateStats(){
  $('s-total').textContent = leads.length;
  $('s-conn').textContent = stats.conn;
  $('s-vm').textContent = stats.vm;
  $('s-fail').textContent = stats.fail;
}

// ── KEYPAD ──
let kpBuf = '';
const kpDisp = $('kp-disp');
function kpRender(){
  if(!kpBuf){kpDisp.textContent='Type or click to dial';kpDisp.className='kp-display empty'}
  else{kpDisp.textContent=kpBuf;kpDisp.className='kp-display'}
}
function kpPress(k){
  // If a manual call is live, send DTMF instead of typing
  if(conn && manualCall){
    try{conn.sendDigits(k);log('DTMF: '+k)}catch(e){log('DTMF failed: '+e.message,'err')}
    return;
  }
  if(kpBuf.length<20) kpBuf += k;
  kpRender();
}
document.querySelectorAll('.kp-key').forEach(b=>b.onclick=()=>kpPress(b.dataset.k));
$('kp-bs').onclick = ()=>{kpBuf=kpBuf.slice(0,-1);kpRender()};
$('kp-bs').addEventListener('contextmenu',e=>{e.preventDefault();kpBuf='';kpRender()});

// keyboard input
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(/^[0-9*#+]$/.test(e.key)){kpPress(e.key);e.preventDefault()}
  else if(e.key==='Backspace'&&!manualCall){kpBuf=kpBuf.slice(0,-1);kpRender();e.preventDefault()}
  else if(e.key==='Enter'&&kpBuf&&!manualCall){$('kp-call').click();e.preventDefault()}
});

let manualCall = false;
$('kp-call').onclick = async ()=>{
  if(!device){alert('Connect mic first');return}
  if(!kpBuf){alert('Enter a number');return}
  if(running){alert('Stop the auto-dialer first');return}
  const num = normalizePhone(kpBuf);
  const from = closestNum(num);
  log('Manual dial: '+num+' from '+from.lbl);
  setState('DIALING','ring');
  manualCall = true;
  $('kp-call').style.display='none';
  $('kp-end').style.display='block';
  callStart = Date.now();
  callTimer = setInterval(()=>{
    const s=Math.floor((Date.now()-callStart)/1000);
    $('timer').className='timer';
    $('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  },250);
  try{
    conn = await device.connect({params:{To:num, callerId:from.n, leadName:'Manual'}});
    conn.on('ringing',()=>{setState('RINGING','ring');log('Ringing…')});
    conn.on('accept',()=>{setState('CONNECTED','live');log('Connected — keypad now sends DTMF','ok')});
    conn.on('disconnect',()=>{endManual('Disconnected')});
    conn.on('error',e=>{log('Call error: '+e.message,'err');endManual('Error')});
    conn.on('cancel',()=>endManual('Cancelled'));
    conn.on('reject',()=>endManual('Rejected'));
  }catch(e){log('Manual dial failed: '+e.message,'err');endManual('Failed')}
};
$('kp-end').onclick = ()=>{if(conn)try{conn.disconnect()}catch{}};
function endManual(reason){
  log(reason);
  clearInterval(callTimer);
  conn=null;manualCall=false;
  $('timer').textContent='00:00';$('timer').className='timer idle';
  setState('IDLE');
  $('kp-call').style.display='block';
  $('kp-end').style.display='none';
}

log('Ready. Enter Worker URL → Connect Mic → Load CSV → Start.');
</script>
