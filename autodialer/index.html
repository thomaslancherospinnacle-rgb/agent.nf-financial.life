<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Dialer v2</title>
<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.10.0/dist/twilio.min.js"></script>
<style>
:root{--bg:#0d0f12;--sf:#141720;--s2:#1c2030;--s3:#232840;--b:#2a3050;--b2:#3a4570;--tx:#e8eaf0;--t2:#8892b0;--t3:#4a5580;--green:#00e676;--gdim:#00a651;--red:#ff4d6d;--amber:#ffab00;--blue:#4fc3f7;--purple:#b39ddb;--pink:#c084fc}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Inter',sans-serif}
body{background:var(--bg);color:var(--tx);font-size:13px;min-height:100vh;padding:14px;display:grid;grid-template-columns:1fr 260px 340px;gap:14px}
@media(max-width:1180px){body{grid-template-columns:1fr 300px}}
@media(max-width:880px){body{grid-template-columns:1fr}}
h1{font-size:12px;letter-spacing:.1em;color:var(--green);font-weight:500;margin-bottom:12px;font-family:'SF Mono',monospace}
.panel{background:var(--sf);border:1px solid var(--b);border-radius:10px;padding:16px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
label{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;font-family:'SF Mono',monospace}
input,select,textarea{background:var(--s3);border:1px solid var(--b);color:var(--tx);padding:6px 9px;border-radius:5px;font-size:11px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b2)}
input[type=number]{width:60px}
button{padding:7px 12px;border-radius:6px;border:1px solid var(--b);background:var(--s3);color:var(--tx);cursor:pointer;font-size:11px;font-weight:500;transition:all .12s}
button:hover:not(:disabled){border-color:var(--b2)}
button:disabled{opacity:.35;cursor:not-allowed}
.btn-go{background:var(--gdim);color:#000;border-color:var(--gdim)}
.btn-stop{background:none;border-color:var(--red);color:var(--red)}
.btn-skip{background:none;border-color:var(--amber);color:var(--amber)}
.btn-vm{background:none;border-color:var(--pink);color:var(--pink)}
.btn-redial{background:var(--blue);color:#000;border-color:var(--blue);font-weight:600}
.btn-redial:hover:not(:disabled){background:#81d4fa}
.btn-redial:disabled{opacity:.3}
.btn-block{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
.btn-block:hover:not(:disabled){background:#ff7a92}
.btn-block:disabled{opacity:.3}
.btn-beep{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700;letter-spacing:.05em;box-shadow:0 0 0 0 rgba(255,171,0,.7);transition:all .2s}
.btn-beep:hover:not(:disabled){background:#ffc340;transform:scale(1.03)}
.btn-beep:active:not(:disabled){transform:scale(.95);box-shadow:0 0 0 8px rgba(255,171,0,0)}
.btn-beep:disabled{opacity:.3}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-family:'SF Mono',monospace;font-size:9px;letter-spacing:.06em;background:var(--s3);color:var(--t2)}
.pill.live{background:#0a2a1a;color:var(--green)}
.pill.ring{background:#2a2010;color:var(--amber)}
.pill.vm{background:#1a0828;color:var(--pink)}
.pill.err{background:#200a10;color:var(--red)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.live .dot,.ring .dot{box-shadow:0 0 6px currentColor;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.bigname{font-size:28px;font-weight:300;margin:16px 0 3px;min-height:36px}
.bigphone{font-family:'SF Mono',monospace;font-size:16px;color:var(--blue);margin-bottom:10px}
.timer{font-family:'SF Mono',monospace;font-size:36px;color:var(--green);margin:8px 0}
.timer.idle{color:var(--t3)}
.info{background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:12px;margin:12px 0;max-height:200px;overflow:auto}
.info-row{display:flex;padding:4px 0;border-bottom:1px solid var(--b);font-size:11px}
.info-row:last-child{border:none}
.info-k{color:var(--t2);min-width:120px;font-family:'SF Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.info-v{color:var(--tx);flex:1;word-break:break-word}
.script-wrap{background:var(--s2);border:1px solid var(--b);border-radius:7px;margin:12px 0;overflow:hidden}
.script-hdr{padding:8px 12px;background:var(--s3);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--b)}
.script-hdr select{flex:1}
.script-body{padding:14px;max-height:320px;overflow:auto;font-size:13px;line-height:1.65;white-space:pre-wrap;color:var(--tx)}
.script-body.empty{color:var(--t3);text-align:center;padding:30px;font-style:italic}
.tok{background:rgba(0,230,118,.15);color:var(--green);padding:1px 5px;border-radius:3px;font-weight:500}
.tok-missing{background:rgba(255,77,109,.15);color:var(--red);padding:1px 5px;border-radius:3px;font-weight:500}
.outcome-panel{background:rgba(255,171,0,.08);border:1px solid var(--amber);border-radius:8px;padding:12px;margin:12px 0;display:none}
.outcome-panel.show{display:block}
.outcome-panel h3{font-size:10px;color:var(--amber);letter-spacing:.08em;font-family:'SF Mono',monospace;margin-bottom:8px}
.out-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.obtn{padding:10px 6px;border-radius:6px;border:1px solid transparent;font-size:11px;cursor:pointer;font-weight:500;transition:all .12s}
.obtn:hover{filter:brightness(1.15)}
.o-book{background:#0a2a1a;border-color:var(--gdim);color:var(--green)}
.o-cb{background:#2a2010;border-color:#664400;color:var(--amber)}
.o-ni{background:#151530;border-color:#3a3a70;color:var(--purple)}
.o-wn{background:#200a10;border-color:#601020;color:var(--red)}
.o-dnc{background:#200a10;border-color:var(--red);color:var(--red);font-weight:700}
.o-np{background:var(--s3);border-color:var(--b);color:var(--t2)}
.actions{display:flex;gap:6px;margin-top:10px}
.actions button{flex:1;padding:12px}
.q{margin-top:12px;max-height:360px;overflow:auto}
.q-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid var(--b);font-size:11px}
.q-item.cur{background:#0a2a1a}
.q-item.done{opacity:.5}
.q-num{font-family:'SF Mono',monospace;color:var(--t3);font-size:9px;width:22px}
.q-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-st{font-family:'SF Mono',monospace;font-size:9px;padding:2px 6px;border-radius:7px;background:var(--s3);color:var(--t2)}
.q-st.pending{background:var(--s3);color:var(--t2)}
.q-st.done{background:#0a2a1a;color:var(--green)}
.q-st.vm{background:#1a0828;color:var(--pink)}
.q-st.fail{background:#200a10;color:var(--red)}
.q-st.dnc{background:var(--red);color:#fff;font-weight:700}
.log{background:#000;border:1px solid var(--b);border-radius:6px;padding:9px;height:130px;overflow:auto;font-family:'SF Mono',monospace;font-size:10px;color:var(--t2);margin-top:10px}
.log div{padding:1px 0}.log .ok{color:var(--green)}.log .warn{color:var(--amber)}.log .err{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.stat{background:var(--s2);border:1px solid var(--b);border-radius:6px;padding:8px;text-align:center}
.stat-v{font-family:'SF Mono',monospace;font-size:17px;color:var(--tx)}
.stat-l{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.kp-key{background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:13px 0;font-family:'SF Mono',monospace;font-size:18px;color:var(--tx);cursor:pointer;user-select:none}
.kp-key:hover{background:var(--s3);border-color:var(--b2)}
.kp-key:active{background:var(--gdim);color:#000;transform:scale(.96)}
.kp-display{background:#000;border:1px solid var(--b);border-radius:8px;padding:12px;font-family:'SF Mono',monospace;font-size:20px;color:var(--blue);text-align:center;margin-bottom:8px;min-height:46px}
.kp-display.empty{color:var(--t3);font-size:12px}
.kp-call{background:var(--gdim);color:#000;border-color:var(--gdim);font-weight:600}
.kp-call:hover:not(:disabled){background:#00c853}
.kp-end{background:var(--red);color:#fff;border-color:var(--red)}
.tabs-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.tabs-row select{flex:1}
details{margin-top:10px}
summary{cursor:pointer;color:var(--t2);font-size:10px;font-family:'SF Mono',monospace;padding:6px 0;letter-spacing:.08em}
summary:hover{color:var(--tx)}
.pending-syncs{display:inline-block;background:var(--amber);color:#000;border-radius:10px;padding:1px 7px;font-size:9px;font-family:'SF Mono',monospace;margin-left:6px}
</style></head><body>

<div class="panel">
  <h1>◆ AUTO DIALER v2</h1>

  <details open><summary>⚙ SETUP</summary>
    <div class="row" style="margin-top:8px">
      <label>Worker</label><input id="worker" style="flex:1;min-width:200px" placeholder="https://your-worker.workers.dev">
      <button id="mic">Connect Mic</button>
      <span class="pill" id="devpill"><span class="dot"></span>OFFLINE</span>
    </div>
    <div class="row">
      <label>Deployment ID</label><input id="gas-depid" style="flex:1;min-width:240px" placeholder="AKfycbw...TgfyZ5">
      <button id="load-tabs">↻ Refresh Tabs</button>
    </div>
    <div class="tabs-row">
      <label>Tab</label>
      <select id="tab-sel"><option value="">— pick a tab —</option></select>
      <button id="load-leads" class="btn-go">📥 Load Leads</button>
    </div>
    <div id="file-name" style="font-size:10px;color:var(--t3);font-family:'SF Mono',monospace;margin-top:6px"></div>
  </details>

  <div class="row" style="margin-top:12px">
    <label>Max Attempts</label><input type="number" id="maxAtt" value="3" min="1" max="10">
    <label>Gap (s)</label><input type="number" id="gap" value="2" min="0" max="60">
    <span style="font-size:10px;color:var(--pink);font-family:'SF Mono',monospace;letter-spacing:.05em">⚡ AUTO VM SKIP</span>
  </div>

  <div class="row" style="margin-bottom:0">
    <button id="start" class="btn-go" disabled>▶ START</button>
    <button id="stop" class="btn-stop" disabled>■ STOP</button>
    <button id="vm" class="btn-vm" disabled>📬 SENT TO VM</button>
    <button id="beep" class="btn-beep" disabled title="Press & HOLD to spam #01 tones through the line">🔔 BEEP!</button>
    <button id="redial" class="btn-redial" disabled title="Hang up and instantly redial this same number from the same caller ID">⚡ REDIAL</button>
    <button id="block-redial" class="btn-block" disabled title="Hang up and instantly redial from the NEXT closest caller ID (for when they've blocked the current number)">🚫 BLOCKED REDIAL</button>
    <button id="skip" class="btn-skip" disabled>⏭ SKIP</button>
    <span class="pill" id="state" style="margin-left:auto"><span class="dot"></span>IDLE</span>
    <span id="pending-syncs"></span>
  </div>

  <div class="bigname" id="name">—</div>
  <div class="bigphone" id="phone">—</div>
  <div class="timer idle" id="timer">00:00</div>
  <div style="font-family:'SF Mono',monospace;font-size:10px;color:var(--t3)" id="att"></div>

  <div class="info" id="info"><div style="color:var(--t3);text-align:center;padding:18px">Load a tab to begin</div></div>

  <div class="outcome-panel" id="outcome-panel">
    <h3>▸ LOG CALL OUTCOME</h3>
    <div class="out-grid">
      <button class="obtn o-book"  data-out="Booked">✅ Booked</button>
      <button class="obtn o-cb"    data-out="Callback">🔄 Callback</button>
      <button class="obtn o-ni"    data-out="Not Interested">❌ Not Interested</button>
      <button class="obtn o-wn"    data-out="Wrong Number">📵 Wrong Number</button>
      <button class="obtn o-np"    data-out="No Pickup">📵 No Pickup</button>
      <button class="obtn o-dnc"   data-out="DNC">🚫 DNC</button>
    </div>
  </div>

  <div class="script-wrap">
    <div class="script-hdr">
      <span style="font-size:10px;font-family:'SF Mono',monospace;color:var(--green);letter-spacing:.08em">◆ SCRIPT</span>
      <select id="script-sel">
        <option value="0">AGED MTG</option>
        <option value="1">HARD CARD</option>
        <option value="2">DISCOUNT CARD</option>
      </select>
    </div>
    <div class="script-body empty" id="script-body">Load a lead to see script</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-v" id="s-total">0</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-v" id="s-book" style="color:var(--green)">0</div><div class="stat-l">Booked</div></div>
    <div class="stat"><div class="stat-v" id="s-conn">0</div><div class="stat-l">Answered</div></div>
    <div class="stat"><div class="stat-v" id="s-vm">0</div><div class="stat-l">VM</div></div>
    <div class="stat"><div class="stat-v" id="s-fail">0</div><div class="stat-l">No Ans</div></div>
  </div>
  <div class="log" id="log"></div>
</div>

<div class="panel">
  <h1>◆ KEYPAD</h1>
  <div style="margin-bottom:10px">
    <label style="display:block;margin-bottom:4px">Dial From</label>
    <select id="kp-from" style="width:100%"><option value="auto">Auto (closest match)</option></select>
  </div>
  <div class="kp-display empty" id="kp-disp">Type to dial</div>
  <div class="kp-grid">
    <button class="kp-key" data-k="1">1</button><button class="kp-key" data-k="2">2</button><button class="kp-key" data-k="3">3</button>
    <button class="kp-key" data-k="4">4</button><button class="kp-key" data-k="5">5</button><button class="kp-key" data-k="6">6</button>
    <button class="kp-key" data-k="7">7</button><button class="kp-key" data-k="8">8</button><button class="kp-key" data-k="9">9</button>
    <button class="kp-key" data-k="*">*</button><button class="kp-key" data-k="0">0</button><button class="kp-key" data-k="#">#</button>
  </div>
  <div class="actions">
    <button id="kp-bs">⌫</button>
    <button class="kp-call" id="kp-call">📞 CALL</button>
    <button class="kp-end" id="kp-end" style="display:none">END</button>
  </div>
</div>

<div class="panel">
  <h1>◆ QUEUE</h1>
  <div class="q" id="queue"><div style="color:var(--t3);text-align:center;padding:20px;font-size:12px">No leads loaded</div></div>
</div>

<script>
'use strict';
// ══ HARDCODED SCRIPTS — tokens in {curly braces} auto-fill from CSV/sheet columns ══
const SCRIPTS = [
  {
    name: 'AGED MTG',
    text: `Hello hello {name}, its _____. Giving you a quick call here, I manage the brokerage, that handles the mortgage protection for {lender}. Reason for my call, Your file that's associated with your property on {address} came, across our system, as flagged for review or incomplete… Not a problem, {name}, the only reason for that is, sometime around when, you closed or refinanced the home…. We sent you like, several things in the mail, about the mortgage, protection Right, where, it pays off the home if you, get sick or, pass away, Does, that ring a bell at all {name}?

You did the right thing. I mean, you filled out the card, you mailed it back to us… But for some reason, on our end, we haven't gotten that completed…. I'm the senior underwriter in the area here. So, I just wanted to make sure we took care of you.

Now, is it just you in the home or is there a significant other or family there with you?

Gotcha, and im assuming that god forbid, you where to pass, your {beneficiary} would be the one, taking over the mortgage, right?

Ok so correct me if im wrong, you just wanted to make sure that {beneficiary} is taken care of right, so they dont have to take care of that financial burden.

Gotcha so usually you get the mortgage protection taken care of at closing, its showing youve got the homeowners insurance, which takes care of damages, and the PMI, that makes sure the bank gets their money if you default on the mortgage, and the mortgage protection is the 3rd and most important insurance takes care of the home god forbid you where to pass, does that make sense?

Ok is there a reason why you never got this taken care of, or you don't know?`
  },
  {
    name: 'HARD CARD',
    text: `Hey {name}? Hey {name} this is _____ with American Income Life, we handle some of your permanent benefits through the {union}. I'm calling because we just got back your beneficiary card and I just need to verify to make sure everything is up to date.

It looks like you have your {relation}, {beneficiary} down as the beneficiary. Is that still correct? Okay perfect, and you still want the benefit package to come down to {address}? Okay cool, and then just to verify your birthday I have {birthday}?

Okay perfect, now the {union} set you up with a permanent benefits package, and it looks like in our files here you are still one of the members who have not received it yet. So my job is to get you caught up with all the other members in your local {local}.

Now {name}, do you have a spouse or is it just yourself?

(only ask if they do not have spouse as beneficiary)
(ALWAYS GIVE IT A SHOT — "IF YOU GUYS HAVE 15 MINUTES TOGETHER WE CAN GET THIS KNOCKED OUT RIGHT NOW")

Okay perfect, now I'm sure you/you guys are really busy people, but what usually works better for you, mornings or evenings?

I gotcha, let me check my schedule so I can get you/you guys in. It'll be nice and quick because we are all virtual now… (pause) So as far as availability I have ___ or ___ today, what works the best?`
  },
  {
    name: 'DISCOUNT CARD',
    text: `Hello hello {name}?

Hey {name} this is _____ with Globe Life American Income division insurance company how are you doing today?

[if yes continue]
[if no → "you have the $2000 policy with us, it came across…"]

Great, I'm calling about that smaller policy you got with us, the $2,000 policy. It just came across my desk and it was showing me that we don't have a beneficiary for you. We also just got to make sure that we have you updated on the company wide updates for 2026, make sure you get the claims forms, all that good stuff.

Now we do this over the phone virtually to save you time, we don't have to come out to the house anymore like we used to. So what usually works better, mornings or evenings?`
  },
];

// ══ TWILIO NUMBERS (frontend picks closest) ══
const NUMBERS = [
  {n:'+15862215707',lbl:'(586) Mount Clemens',lat:42.5973,lng:-82.8779},
  {n:'+12693869670',lbl:'(269) Colon',        lat:41.9559,lng:-85.3253},
  {n:'+18108193812',lbl:'(810) Brighton',     lat:42.5295,lng:-83.7799},
  {n:'+19893490235',lbl:'(989) Birch Run',    lat:43.2503,lng:-83.7894},
  {n:'+16163194434',lbl:'(616) Lowell',       lat:42.9337,lng:-85.3420},
  {n:'+12314442706',lbl:'(231) Cadillac',     lat:44.2519,lng:-85.4013},
  {n:'+12484532765',lbl:'(248) Rochester',    lat:42.6806,lng:-83.1340},
  {n:'+13136266971',lbl:'(313) Detroit',      lat:42.3314,lng:-83.0458},
  {n:'+17349844400',lbl:'(734) Flat Rock',    lat:42.1000,lng:-83.2747},
  {n:'+15176189305',lbl:'(517) Howell',       lat:42.6075,lng:-83.9297},
];
const AC_COORDS={'231':{lat:44.76,lng:-85.62},'248':{lat:42.58,lng:-83.25},'269':{lat:42.29,lng:-85.59},'313':{lat:42.33,lng:-83.05},'517':{lat:42.73,lng:-84.56},'586':{lat:42.58,lng:-82.91},'616':{lat:42.96,lng:-85.67},'734':{lat:42.28,lng:-83.74},'810':{lat:43.01,lng:-83.69},'906':{lat:46.48,lng:-84.99},'947':{lat:42.58,lng:-83.25},'989':{lat:43.42,lng:-83.95},'default':{lat:43.33,lng:-84.54}};
function closestNum(p){const ac=p.replace(/\D/g,'').slice(-10).slice(0,3);const c=AC_COORDS[ac]||AC_COORDS.default;let best=NUMBERS[0],bestD=Infinity;for(const n of NUMBERS){const dLat=(n.lat-c.lat)*Math.PI/180,dLng=(n.lng-c.lng)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(c.lat*Math.PI/180)*Math.cos(n.lat*Math.PI/180)*Math.sin(dLng/2)**2;const d=3958.8*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));if(d<bestD){bestD=d;best=n;}}return best;}

// ══ STATE ══
const $=id=>document.getElementById(id);
const LS=(k,d='')=>{try{return localStorage.getItem(k)??d}catch{return d}};
const SS=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let device=null,conn=null,leads=[],idx=0,attempt=0,running=false,dialing=false,callTimer=null,callStart=0,gapTimer=null,headers=[],stats={book:0,conn:0,vm:0,fail:0},awaitingOutcome=false,tabName='',pendingSync=[];
try{pendingSync=JSON.parse(LS('dialer_pendingSync','[]'))}catch{pendingSync=[]}

function log(m,t=''){const d=document.createElement('div');d.className=t;d.textContent='['+new Date().toLocaleTimeString()+'] '+m;$('log').appendChild(d);$('log').scrollTop=1e9}
function setState(t,c=''){const p=$('state');p.className='pill '+c;p.innerHTML='<span class="dot"></span>'+t}
function setDev(t,c=''){const p=$('devpill');p.className='pill '+c;p.innerHTML='<span class="dot"></span>'+t}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function renderPendingSyncs(){$('pending-syncs').innerHTML=pendingSync.length?`<span class="pending-syncs">${pendingSync.length} pending sync</span>`:''}

// ══ PERSISTED CONFIG ══
$('worker').value=LS('dialer_worker','');
$('gas-depid').value=LS('dialer_depid','');
$('worker').addEventListener('change',e=>SS('dialer_worker',e.target.value));
$('gas-depid').addEventListener('change',e=>SS('dialer_depid',e.target.value.trim()));

// ══ MIC ══
$('mic').onclick=async()=>{
  const url=$('worker').value.trim();if(!url){alert('Enter Worker URL');return}
  $('mic').disabled=true;
  try{
    const r=await fetch(url+'/token');const d=await r.json();
    if(!d.token)throw new Error(d.error||'No token');
    device=new Twilio.Device(d.token,{codecPreferences:['opus','pcmu'],logLevel:1});
    device.on('registered',()=>{setDev('READY','live');log('Device ready','ok');$('mic').textContent='Reconnect';$('mic').disabled=false;checkCanStart()});
    device.on('error',e=>{setDev('ERROR','err');log('Device: '+e.message,'err')});
    device.on('tokenWillExpire',async()=>{try{const r=await fetch(url+'/token');const d=await r.json();if(d.token)device.updateToken(d.token);log('Token refreshed')}catch{}});
    await device.register();
  }catch(e){log('Mic init failed: '+e.message,'err');setDev('ERROR','err');$('mic').disabled=false}
};

// ══ GOOGLE SHEETS (via GAS — bound to one spreadsheet) ══
async function gasCall(action,payload={}){
  const depid=$('gas-depid').value.trim();
  if(!depid)throw new Error('Deployment ID not set');
  const url='https://script.google.com/macros/s/'+depid+'/exec';
  const body=JSON.stringify({action,...payload});
  const r=await fetch(url,{method:'POST',body,headers:{'Content-Type':'text/plain'},redirect:'follow'});
  if(!r.ok)throw new Error('GAS HTTP '+r.status);
  const d=await r.json();
  if(!d.ok)throw new Error(d.error||'GAS error');
  return d;
}

$('load-tabs').onclick=async()=>{
  if(!$('gas-depid').value.trim()){alert('Enter Deployment ID first');return}
  $('load-tabs').disabled=true;log('Loading tabs…');
  try{
    const d=await gasCall('listTabs');
    const sel=$('tab-sel');sel.innerHTML='<option value="">— pick a tab —</option>';
    d.tabs.forEach(t=>{
      const o=document.createElement('option');
      o.value=t.name;
      o.textContent=t.name+' ('+t.count+' leads)';
      sel.appendChild(o);
    });
    $('file-name').textContent='📂 '+d.fileName+' — '+d.tabs.length+' tabs';
    log('Found '+d.tabs.length+' tabs in "'+d.fileName+'"','ok');
  }catch(e){log('Tab load failed: '+e.message,'err');alert('Load tabs failed: '+e.message)}
  finally{$('load-tabs').disabled=false}
};

$('load-leads').onclick=async()=>{
  const tab=$('tab-sel').value;if(!tab){alert('Pick a tab first');return}
  $('load-leads').disabled=true;log('Loading leads from '+tab+'…');
  try{
    const d=await gasCall('loadTab',{tab});
    headers=d.headers;
    tabName=tab;
    const ni=headers.findIndex(h=>/name/i.test(h));
    const pi=headers.findIndex(h=>/phone|cell|mobile|number/i.test(h));
    if(pi<0)throw new Error('No phone column found. Headers: '+headers.join(', '));
    leads=d.rows.map((row,i)=>{
      const cells={};headers.forEach((h,j)=>{cells[h]=(row[j]??'').toString().trim()});
      const phone=normalizePhone(cells[headers[pi]]||'');
      if(!phone)return null;
      const name=ni>=0?(cells[headers[ni]]||'').trim()||'Row '+(i+2):'Row '+(i+2);
      const existingOutcomes=row.slice(headers.length).map(c=>String(c||'').trim()).filter(Boolean);
      const isDNC=existingOutcomes.some(o=>/DNC/i.test(o));
      return{rowIdx:i+2,name,phone,cells,status:isDNC?'dnc':'pending',attempts:0,history:existingOutcomes};
    }).filter(Boolean);
    idx=0;attempt=0;stats={book:0,conn:0,vm:0,fail:0};updateStats();
    log('Loaded '+leads.length+' leads from '+tab,'ok');
    renderQueue();if(leads.length)showLead(0);
    checkCanStart();
  }catch(e){log('Load failed: '+e.message,'err');alert('Load failed: '+e.message)}
  finally{$('load-leads').disabled=false}
};

function findLastNonEmpty(arr){for(let i=arr.length-1;i>=0;i--)if(String(arr[i]||'').trim())return i;return-1}
function normalizePhone(p){let d=p.replace(/[^\d+]/g,'');if(!d)return'';if(d.startsWith('+'))return d;if(d.length===10)return'+1'+d;if(d.length===11&&d[0]==='1')return'+'+d;return'+'+d}

function checkCanStart(){$('start').disabled=!device||!leads.length}

// ══ SYNC QUEUE (offline-safe) ══
async function syncOutcome(lead,outcome){
  const item={tab:tabName,rowIdx:lead.rowIdx,outcome,ts:new Date().toISOString()};
  pendingSync.push(item);SS('dialer_pendingSync',JSON.stringify(pendingSync));renderPendingSyncs();
  flushSync();
}
async function flushSync(){
  if(!pendingSync.length)return;
  if(!$('gas-depid').value.trim()){log('Deployment ID not set — '+pendingSync.length+' outcomes queued','warn');return}
  const batch=pendingSync.slice(0,10);
  try{
    await gasCall('logOutcomes',{items:batch});
    pendingSync=pendingSync.slice(batch.length);
    SS('dialer_pendingSync',JSON.stringify(pendingSync));renderPendingSyncs();
    if(pendingSync.length)setTimeout(flushSync,500);
  }catch(e){log('Sync failed (will retry): '+e.message,'warn')}
}
setInterval(flushSync,15000);

// ══ DIALING ══
$('start').onclick=()=>{if(!device){alert('Connect mic');return}running=true;$('start').disabled=true;$('stop').disabled=false;$('vm').disabled=false;$('skip').disabled=false;$('beep').disabled=false;$('redial').disabled=false;$('block-redial').disabled=false;log('Started','ok');dialNext()};
$('stop').onclick=()=>{running=false;dialing=false;$('stop').disabled=true;$('start').disabled=!leads.length;$('vm').disabled=true;$('skip').disabled=true;$('beep').disabled=true;$('redial').disabled=true;$('block-redial').disabled=true;clearTimeout(gapTimer);if(conn)try{conn.disconnect()}catch{};setState('STOPPED');log('Stopped','warn')};
// BEEP spam — press & hold fires #01 on repeat, release stops
let beepInterval=null, beepSeq=['#','0','1'], beepIdx=0;
function beepStart(e){
  if(e)e.preventDefault();
  if(!conn){log('BEEP: no active call','warn');return}
  if(beepInterval)return; // already spamming
  log('🔔 BEEP spam started','warn');
  $('beep').style.background='#ffc340';
  $('beep').style.transform='scale(.95)';
  // Fire immediately, then on interval
  const fire=()=>{
    if(!conn){beepStop();return}
    try{conn.sendDigits(beepSeq[beepIdx]);beepIdx=(beepIdx+1)%beepSeq.length}catch(e){log('BEEP err: '+e.message,'err');beepStop()}
  };
  fire();
  beepInterval=setInterval(fire, 90); // ~11 tones/sec — near Twilio's DTMF ceiling
}
function beepStop(){
  if(beepInterval){clearInterval(beepInterval);beepInterval=null;log('🔔 BEEP spam stopped','ok')}
  beepIdx=0;
  $('beep').style.background='';
  $('beep').style.transform='';
}
// Mouse
$('beep').addEventListener('mousedown',beepStart);
$('beep').addEventListener('mouseup',beepStop);
$('beep').addEventListener('mouseleave',beepStop);
// Touch (mobile / tablet)
$('beep').addEventListener('touchstart',beepStart,{passive:false});
$('beep').addEventListener('touchend',beepStop);
$('beep').addEventListener('touchcancel',beepStop);
// Prevent context menu on long-press (mobile)
$('beep').addEventListener('contextmenu',e=>e.preventDefault());

// Ranked list of caller IDs by distance to a given destination
function rankedNumbers(phone){
  const ac=phone.replace(/\D/g,'').slice(-10).slice(0,3);
  const c=AC_COORDS[ac]||AC_COORDS.default;
  return NUMBERS.map(n=>{
    const dLat=(n.lat-c.lat)*Math.PI/180,dLng=(n.lng-c.lng)*Math.PI/180;
    const a=Math.sin(dLat/2)**2+Math.cos(c.lat*Math.PI/180)*Math.cos(n.lat*Math.PI/180)*Math.sin(dLng/2)**2;
    const d=3958.8*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    return {n,d};
  }).sort((a,b)=>a.d-b.d).map(x=>x.n);
}

// Fast redial — same caller ID, zero delay, doesn't count as new attempt
async function fastRedial(from,reason){
  const lead=leads[idx];if(!lead){log('No active lead','warn');return}
  // Hang up current call if any
  if(conn){try{conn.disconnect()}catch{}}
  // Wait a tick for disconnect to settle, then fire
  setTimeout(async()=>{
    dialing=true;
    setState('DIALING','ring');
    log('⚡ '+reason+': '+lead.name+' from '+from.lbl);
    try{
      conn=await device.connect({params:{To:lead.phone,callerId:from.n,leadName:lead.name,MachineDetection:'DetectMessageEnd',MachineDetectionTimeout:'6'}});
      lead._lastCallerId=from.n;
      bindCall(lead);
    }catch(e){log('Redial failed: '+e.message,'err');dialing=false}
  },150);
}

$('redial').onclick=()=>{
  const lead=leads[idx];if(!lead){log('No active lead','warn');return}
  const from=lead._lastCallerId?NUMBERS.find(n=>n.n===lead._lastCallerId)||closestNum(lead.phone):closestNum(lead.phone);
  fastRedial(from,'INSTANT REDIAL');
};

$('block-redial').onclick=()=>{
  const lead=leads[idx];if(!lead){log('No active lead','warn');return}
  const ranked=rankedNumbers(lead.phone);
  // Track which numbers we've already tried on this lead
  if(!lead._triedIds)lead._triedIds=new Set();
  if(lead._lastCallerId)lead._triedIds.add(lead._lastCallerId);
  // Find the next closest one we haven't used yet
  let next=ranked.find(n=>!lead._triedIds.has(n.n));
  if(!next){
    // Cycled through all — reset and use second-closest
    log('All numbers tried — resetting rotation','warn');
    lead._triedIds=new Set();
    next=ranked[1]||ranked[0];
  }
  log('🚫 Blocked — rotating to '+next.lbl,'warn');
  fastRedial(next,'BLOCKED REDIAL');
};
$('skip').onclick=()=>{if(conn)try{conn.disconnect()}catch{};attempt=+$('maxAtt').value;afterCall('skipped')};
$('vm').onclick=()=>{
  const l=leads[idx];if(!l)return;
  log('📬 Manual VM: '+l.name+' (attempt '+(attempt+1)+'/'+$('maxAtt').value+')','warn');
  stats.vm++;
  l.history.push('Voicemail');
  syncOutcome(l,'Voicemail');
  updateStats();
  setState('VM','vm');
  // Stay on lead — afterCall() will increment attempt and retry if under maxAtt
  if(conn)try{conn.disconnect()}catch{}
  else afterCall('vm-manual');
};

async function dialNext(){
  if(!running||dialing)return;
  while(idx<leads.length&&leads[idx].status==='dnc')idx++;
  if(idx>=leads.length){log('All leads done','ok');$('stop').click();return}
  const lead=leads[idx];
  if(attempt>=+$('maxAtt').value){
    if(lead.status==='pending'){lead.status='fail';stats.fail++;syncOutcome(lead,'Max attempts reached')}
    updateStats();renderQueue();idx++;attempt=0;showLead(idx);return setTimeout(dialNext,300);
  }
  dialing=true;showLead(idx);
  const from=closestNum(lead.phone);
  setState('DIALING','ring');log('Dialing '+lead.name+' from '+from.lbl+' ('+(attempt+1)+'/'+$('maxAtt').value+')');
  try{
    conn=await device.connect({params:{To:lead.phone,callerId:from.n,leadName:lead.name,MachineDetection:'DetectMessageEnd',MachineDetectionTimeout:'6',MachineDetectionSpeechThreshold:'2400'}});
    lead._lastCallerId=from.n;
    bindCall(lead);
  }catch(e){log('connect() failed: '+e.message,'err');dialing=false;attempt++;setTimeout(dialNext,1500)}
}

function bindCall(lead){
  callStart=Date.now();let finalized=false;
  const finalize=reason=>{if(finalized)return;finalized=true;clearInterval(callTimer);afterCall(reason)};
  callTimer=setInterval(()=>{const s=Math.floor((Date.now()-callStart)/1000);$('timer').className='timer';$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);
  conn.on('ringing',()=>{setState('RINGING','ring');log('Ringing…')});
  conn.on('accept',()=>{setState('CONNECTED','live');log('Accepted','ok')});
  conn.on('messageReceived',msg=>{const c=msg?.content||{};const ab=c.AnsweredBy||c.answeredBy;if(ab)handleAMD(ab,lead)});
  conn.on('disconnect',()=>{
    const dur=Math.floor((Date.now()-callStart)/1000);
    log('Disconnected after '+dur+'s');
    if(lead.status==='pending'&&dur>=12){
      lead.status='human';stats.conn++;
      promptOutcome(lead);
      return finalize('human');
    }
    if(lead.status==='pending'&&dur>=3&&dur<12){
      log('Short connect → VM','warn');
      stats.vm++;
      lead.history.push('Voicemail');
      syncOutcome(lead,'Voicemail');
      updateStats();
      // don't set status='vm' — let afterCall retry if attempts remain
    }
    finalize(lead.status==='pending'?'noanswer':lead.status);
  });
  conn.on('error',e=>{log('Call error: '+e.message,'err');finalize('error')});
  conn.on('cancel',()=>finalize('cancel'));conn.on('reject',()=>finalize('reject'));
}
function handleAMD(ab,lead){
  log('AMD: '+ab,ab.startsWith('machine')?'warn':'ok');
  if(ab.startsWith('machine')||ab==='fax'||ab==='unknown'){
    setState('VM','vm');
    stats.vm++;
    lead.history.push('Voicemail');
    syncOutcome(lead,'Voicemail');
    updateStats();
    // Stay on lead — afterCall will retry if attempts remain
    try{conn.disconnect()}catch{}
  }
}

function promptOutcome(lead){
  awaitingOutcome=true;
  $('outcome-panel').classList.add('show');
  running=false; // pause auto-dialer until outcome logged
}
document.querySelectorAll('.obtn').forEach(b=>b.onclick=()=>{
  const out=b.dataset.out;const lead=leads[idx];if(!lead)return;
  log('Outcome: '+out+' for '+lead.name,'ok');
  syncOutcome(lead,out);
  if(out==='Booked'){lead.status='booked';stats.book++}
  else if(out==='DNC'){lead.status='dnc'}
  else{lead.status='done'}
  $('outcome-panel').classList.remove('show');awaitingOutcome=false;
  updateStats();renderQueue();
  idx++;attempt=0;running=true;
  setTimeout(dialNext,+$('gap').value*1000);
});

function afterCall(reason){
  conn=null;dialing=false;
  beepStop(); // kill any beep spam in progress
  $('timer').textContent='00:00';$('timer').className='timer idle';
  renderQueue();updateStats();
  if(awaitingOutcome)return; // wait for user to log outcome
  if(!running)return;
  const lead=leads[idx];
  // Lead is truly finished (booked / DNC / done outcome / max-failed) → advance
  if(['booked','dnc','done','fail'].includes(lead.status)){
    idx++;attempt=0;
    setTimeout(dialNext,+$('gap').value*1000);
    return;
  }
  // Otherwise: count this attempt (including VM) and retry or give up
  attempt++;
  if(attempt>=+$('maxAtt').value){
    if(lead.status==='pending'){
      // Decide final status from history
      const hadVm=lead.history.includes('Voicemail');
      lead.status=hadVm?'vm':'fail';
      if(!hadVm)stats.fail++;
      syncOutcome(lead,hadVm?'Max VM reached':'No Answer (max attempts)');
    }
    idx++;attempt=0;
  }
  setTimeout(dialNext,+$('gap').value*1000);
}

// ══ UI RENDER ══
function showLead(i){
  if(i>=leads.length){$('name').textContent='—';$('phone').textContent='—';$('info').innerHTML='<div style="color:var(--t3);text-align:center;padding:18px">Done</div>';renderScript(null);return}
  const l=leads[i];const from=closestNum(l.phone);
  $('name').textContent=l.name;$('phone').textContent=l.phone;
  $('att').textContent='Lead '+(i+1)+'/'+leads.length+' • Try '+(attempt+1)+'/'+$('maxAtt').value+' • '+from.lbl+(l.history.length?' • '+l.history.length+' prior':'');
  const entries=Object.entries(l.cells).filter(([k,v])=>v&&!/name|phone|cell|mobile/i.test(k));
  $('info').innerHTML=entries.length?entries.map(([k,v])=>`<div class="info-row"><div class="info-k">${esc(k)}</div><div class="info-v">${esc(v)}</div></div>`).join(''):'<div style="color:var(--t3);text-align:center;padding:18px">No extra info</div>';
  renderScript(l);
}

function renderScript(lead){
  const sIdx=+$('script-sel').value;const tpl=SCRIPTS[sIdx]?.text||'';
  const body=$('script-body');
  if(!tpl){body.className='script-body empty';body.textContent='Script empty';return}
  if(!lead){body.className='script-body empty';body.textContent='Load a lead';return}
  const lookup={};Object.entries(lead.cells).forEach(([k,v])=>{lookup[k.toLowerCase().trim()]=v});
  lookup['name']=(lead.name||'').split(/\s+/)[0]||lead.name||'';
  lookup['fullname']=lead.name||'';lookup['phone']=lead.phone||'';
  const aliases={'address':['address','addr','street','property','property address'],'lender':['lender','bank','mortgage company','servicer'],'beneficiary':['beneficiary','spouse','partner']};
  for(const[k,aa]of Object.entries(aliases)){if(lookup[k])continue;for(const a of aa){if(lookup[a]){lookup[k]=lookup[a];break}}}
  let html=esc(tpl).replace(/\{([^}\n]+)\}/g,(m,k)=>{const v=lookup[k.toLowerCase().trim()];return v?`<span class="tok">${esc(v)}</span>`:`<span class="tok-missing">{${esc(k)}}</span>`});
  body.className='script-body';body.innerHTML=html;
}
$('script-sel').onchange=()=>{SS('dialer_script',$('script-sel').value);renderScript(leads[idx])};
$('script-sel').value=LS('dialer_script','0');

function renderQueue(){$('queue').innerHTML=leads.map((l,i)=>`<div class="q-item ${i===idx?'cur':''} ${l.status!=='pending'?'done':''}"><div class="q-num">${i+1}</div><div class="q-name">${esc(l.name)}</div><div class="q-st ${l.status}">${l.status.toUpperCase()}</div></div>`).join('')}
function updateStats(){$('s-total').textContent=leads.length;$('s-book').textContent=stats.book;$('s-conn').textContent=stats.conn;$('s-vm').textContent=stats.vm;$('s-fail').textContent=stats.fail}

// ══ KEYPAD ══
NUMBERS.forEach(n=>{const o=document.createElement('option');o.value=n.n;o.textContent=n.lbl;$('kp-from').appendChild(o)});
$('kp-from').value=LS('kp_from','auto');$('kp-from').addEventListener('change',e=>SS('kp_from',e.target.value));
let kpBuf='',manualCall=false;const kpDisp=$('kp-disp');
function kpRender(){if(!kpBuf){kpDisp.textContent='Type to dial';kpDisp.className='kp-display empty'}else{kpDisp.textContent=kpBuf;kpDisp.className='kp-display'}}
function kpPress(k){if(conn&&manualCall){try{conn.sendDigits(k);log('DTMF: '+k)}catch{};return}if(kpBuf.length<20)kpBuf+=k;kpRender()}
document.querySelectorAll('.kp-key').forEach(b=>b.onclick=()=>kpPress(b.dataset.k));
$('kp-bs').onclick=()=>{kpBuf=kpBuf.slice(0,-1);kpRender()};
$('kp-call').onclick=async()=>{
  if(!device){alert('Connect mic');return}if(!kpBuf){alert('Enter number');return}if(running){alert('Stop auto-dialer first');return}
  const num=normalizePhone(kpBuf);const fromSel=$('kp-from').value;const from=fromSel==='auto'?closestNum(num):(NUMBERS.find(n=>n.n===fromSel)||closestNum(num));
  log('Manual: '+num+' from '+from.lbl);setState('DIALING','ring');manualCall=true;
  $('kp-call').style.display='none';$('kp-end').style.display='block';callStart=Date.now();
  callTimer=setInterval(()=>{const s=Math.floor((Date.now()-callStart)/1000);$('timer').className='timer';$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);
  try{
    conn=await device.connect({params:{To:num,callerId:from.n,leadName:'Manual'}});
    conn.on('accept',()=>{setState('CONNECTED','live');log('Connected','ok')});
    conn.on('disconnect',()=>endManual('Disconnected'));conn.on('error',e=>{log('Error: '+e.message,'err');endManual('Error')});
    conn.on('cancel',()=>endManual('Cancel'));conn.on('reject',()=>endManual('Reject'));
  }catch(e){log('Manual dial failed: '+e.message,'err');endManual('Failed')}
};
$('kp-end').onclick=()=>{if(conn)try{conn.disconnect()}catch{}};
function endManual(r){log(r);clearInterval(callTimer);beepStop();conn=null;manualCall=false;$('timer').textContent='00:00';$('timer').className='timer idle';setState('IDLE');$('kp-call').style.display='block';$('kp-end').style.display='none'}

renderPendingSyncs();log('Ready. Setup → Connect Mic → Refresh Tabs → Load Leads → Start.');
</script></body></html>
